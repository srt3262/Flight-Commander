<div class="tab-autotune">
    <div class="content_wrapper">
        <div class="tab_title">Autotune</div>
        <div class="fc-autotune-hero">
            <div>
                <span class="fc-eyebrow">Firmware-backed flight mode</span>
                <h2 id="autotuneVehicle">MAVLink vehicle</h2>
                <p>Flight Commander commands the connected ArduPilot vehicle's native AUTOTUNE or QAUTOTUNE mode and reports mode changes and autopilot messages live.</p>
            </div>
            <div class="fc-autotune-state">
                <span>Current mode</span>
                <strong id="autotuneCurrentMode">--</strong>
                <span id="autotuneArmState" class="fc-pill">DISARMED</span>
            </div>
        </div>
        <div class="fc-autotune-controls">
            <label>
                Autotune mode
                <select id="autotuneMode"></select>
            </label>
            <button id="autotuneStart" type="button">Enter Autotune</button>
            <label>
                Exit mode
                <select id="autotuneExitMode"></select>
            </label>
            <button id="autotuneStop" type="button">Exit Autotune</button>
        </div>
        <section class="fc-status-panel">
            <h3>Autopilot progress and status</h3>
            <div id="autotuneMessages" class="fc-message-log"></div>
        </section>
        <div id="autotuneStatus" class="fc-action-status"></div>
    </div>
</div>
