name: Correct Cube Orange+ v4.3.0 release

on:
  push:
    branches:
      - master
    paths:
      - .github/release-assets/cube-v4.3.0/**
      - .github/workflows/correct-cube-v4.3.0.yml

concurrency:
  group: correct-cube-v4.3.0-release
  cancel-in-progress: false

permissions:
  contents: write

env:
  RELEASE_TAG: v4.3.0
  CUBE_NAME: Flight-Commander-Firmware-4.3.0-CUBEORANGEPLUS.hex
  CUBE_SHA256: afb4ad1bb221652a3374506113f3e6e0c9fb226a69b5db886e1b645ca678d903
  CUBE_BYTES: "1938883"
  MICO_NAME: Flight-Commander-Firmware-4.3.0-MICOAIR743.hex
  BUNDLE_NAME: Flight-Commander-v4.3.0.zip

jobs:
  replace:
    name: Replace the regressed Cube release image
    if: github.repository == 'srt3262/Flight-Commander'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the corrective source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify the bench-tested Cube image and release declarations
        run: |
          set -euo pipefail
          cube="$RUNNER_TEMP/$CUBE_NAME"
          cat .github/release-assets/cube-v4.3.0/part-* > "$cube"
          test -s "$cube"
          test "$(stat -c '%s' "$cube")" = "$CUBE_BYTES"
          printf '%s  %s\n' "$CUBE_SHA256" "$cube" | sha256sum --check --strict
          python3 flight-commander/verify-compass-release.py "$cube"
          python3 - "$cube" RELEASE-MANIFEST.json configurator/package.json <<'PY'
          import hashlib, json, pathlib, sys
          cube = pathlib.Path(sys.argv[1])
          manifest = json.loads(pathlib.Path(sys.argv[2]).read_text())
          package = json.loads(pathlib.Path(sys.argv[3]).read_text())
          digest = hashlib.sha256(cube.read_bytes()).hexdigest()
          assert digest == 'afb4ad1bb221652a3374506113f3e6e0c9fb226a69b5db886e1b645ca678d903'
          assert cube.stat().st_size == 1938883
          assert manifest['version'] == package['version'] == '4.3.0'
          assert manifest['artifacts']['CUBEORANGEPLUS']['sha256'] == digest
          assert manifest['artifacts']['CUBEORANGEPLUS']['bytes'] == cube.stat().st_size
          declared = package['flightCommander']['firmwareReleaseArtifacts']['CUBEORANGEPLUS']
          assert declared['filename'] == cube.name
          assert declared['sha256'] == digest
          PY

      - name: Download the existing official assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/original"
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir "$RUNNER_TEMP/original" \
            --pattern "$BUNDLE_NAME" \
            --pattern "$MICO_NAME"

      - name: Rebuild the canonical bundle around the corrected Cube image
        run: |
          set -euo pipefail
          original="$RUNNER_TEMP/original/$BUNDLE_NAME"
          bundle_dir="$RUNNER_TEMP/bundle"
          corrected_bundle="$RUNNER_TEMP/$BUNDLE_NAME"
          corrected_cube="$RUNNER_TEMP/$CUBE_NAME"
          source_zip="$bundle_dir/FC-Firmware-Source-v4.3.0.zip"
          configurator_zip="$bundle_dir/FC-Configurator-Source-v4.3.0.zip"
          mkdir -p "$bundle_dir"
          unzip -q "$original" -d "$bundle_dir"

          mapfile -t before < <(find "$bundle_dir" -maxdepth 1 -type f -printf '%f\n' | sort)
          expected=(
            FC-Configurator-Source-v4.3.0.zip
            FC-Firmware-Source-v4.3.0.zip
            FC-Firmware-v4.3.0-CUBEORANGEPLUS.hex
            FC-Firmware-v4.3.0-MICOAIR743.hex
            FC-Windows-v4.3.0.zip
          )
          if [[ "${before[*]}" != "${expected[*]}" ]]; then
            echo "Existing bundle does not contain exactly the five canonical files." >&2
            printf 'Received: %s\n' "${before[*]}" >&2
            exit 1
          fi

          cp "$corrected_cube" "$bundle_dir/FC-Firmware-v4.3.0-CUBEORANGEPLUS.hex"
          python3 - "$source_zip" <<'PY'
          import runpy, sys
          from pathlib import Path
          release = runpy.run_path('flight-commander/package-release.py')
          manifest = release['read_manifest']()
          release['deterministic_zip'](
              Path(sys.argv[1]),
              manifest['version'],
              manifest['source_date_epoch'],
          )
          PY
          git archive --format=zip \
            --prefix="Flight-Commander-Configurator-Source-v4.3.0/" \
            --output="$configurator_zip" \
            "$GITHUB_SHA:configurator"

          python3 - "$source_zip" configurator/package.json <<'PY'
          import hashlib, json, pathlib, sys
          source = pathlib.Path(sys.argv[1])
          package = json.loads(pathlib.Path(sys.argv[2]).read_text())
          declared = package['flightCommander']['firmwareSourceSha256']
          assert hashlib.sha256(source.read_bytes()).hexdigest() == declared
          PY

          (
            cd "$bundle_dir"
            zip -X -9 "$corrected_bundle" "${expected[@]}"
          )
          test "$(unzip -Z1 "$corrected_bundle" | wc -l)" -eq 5
          test "$(unzip -p "$corrected_bundle" FC-Firmware-v4.3.0-CUBEORANGEPLUS.hex | wc -c)" = "$CUBE_BYTES"
          test "$(unzip -p "$corrected_bundle" FC-Firmware-v4.3.0-CUBEORANGEPLUS.hex | sha256sum | cut -d' ' -f1)" = "$CUBE_SHA256"

      - name: Prepare corrected release notes
        run: |
          set -euo pipefail
          (
            cd "$RUNNER_TEMP"
            sha256sum \
              "$BUNDLE_NAME" \
              "$RUNNER_TEMP/$CUBE_NAME" \
              "$RUNNER_TEMP/original/$MICO_NAME" \
              | sed "s#  $RUNNER_TEMP/original/#  #; s#  $RUNNER_TEMP/#  #"
          ) > "$RUNNER_TEMP/SHA256SUMS.txt"
          {
            cat docs/releases/v4.3.0.md
            printf '\n## Verified release assets\n\n```text\n'
            cat "$RUNNER_TEMP/SHA256SUMS.txt"
            printf '```\n'
          } > "$RUNNER_TEMP/release-notes.md"

      - name: Replace only the corrected public assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" \
            "$RUNNER_TEMP/$BUNDLE_NAME#Flight Commander 4.3.0 complete release bundle" \
            "$RUNNER_TEMP/$CUBE_NAME#Flight Commander Firmware 4.3.0 for CubePilot Cube Orange+" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
          gh release edit "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --latest

      - name: Verify the corrected GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          verify="$RUNNER_TEMP/verify"
          mkdir -p "$verify"
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir "$verify" \
            --pattern "$BUNDLE_NAME" \
            --pattern "$CUBE_NAME"
          printf '%s  %s\n' "$CUBE_SHA256" "$verify/$CUBE_NAME" | sha256sum --check --strict
          test "$(stat -c '%s' "$verify/$CUBE_NAME")" = "$CUBE_BYTES"
          test "$(unzip -p "$verify/$BUNDLE_NAME" FC-Firmware-v4.3.0-CUBEORANGEPLUS.hex | sha256sum | cut -d' ' -f1)" = "$CUBE_SHA256"
          mapfile -t assets < <(gh api \
            "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" \
            --jq '.assets[].name' | sort)
          expected=(
            Flight-Commander-Firmware-4.3.0-CUBEORANGEPLUS.hex
            Flight-Commander-Firmware-4.3.0-MICOAIR743.hex
            Flight-Commander-v4.3.0.zip
          )
          if [[ "${assets[*]}" != "${expected[*]}" ]]; then
            echo "Corrected release does not contain exactly the three public assets." >&2
            printf 'Received: %s\n' "${assets[*]}" >&2
            exit 1
          fi
          test "$(gh api \
            "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" \
            --jq '.assets[] | select(.name == env.CUBE_NAME) | .digest')" = "sha256:$CUBE_SHA256"
