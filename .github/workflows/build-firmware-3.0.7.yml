name: Build Flight Commander 3.0.7 firmware

"on":
  push:
    branches:
      - agent/release-3.0.7
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: flight-commander-firmware-3.0.7-${{ github.ref }}
  cancel-in-progress: true

env:
  RELEASE_VERSION: 3.0.7
  FIRMWARE_TARGET: MICOAIR743
  ACCEPTED_306_ARTIFACT_ID: "8912086169"
  ACCEPTED_306_SOURCE_SHA256: "61d21748c1ae79780180d0aa85b6885c884db4288eb27456e3f6eb29a0f58a6e"

jobs:
  firmware:
    name: Build and verify official MICOAIR743 firmware
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake ninja-build python3 unzip zip xz-utils

      - name: Retrieve accepted 3.0.6 firmware source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p work/input work/source dist
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ACCEPTED_306_ARTIFACT_ID}/zip" > work/input/fw306-artifact.zip
          unzip -q work/input/fw306-artifact.zip -d work/input/artifact
          source_zip="$(find work/input/artifact -type f -name 'Flight-Commander-Firmware-Source-v3.0.6.zip' -print -quit)"
          test -n "${source_zip}"
          printf '%s  %s\n' "${ACCEPTED_306_SOURCE_SHA256}" "${source_zip}" | sha256sum --check --strict
          unzip -q "${source_zip}" -d work/source
          test -d work/source/Flight-Commander-Firmware-Source-v3.0.6
          mv work/source/Flight-Commander-Firmware-Source-v3.0.6 \
             work/source/Flight-Commander-Firmware-Source-v${RELEASE_VERSION}

      - name: Prepare and statically verify 3.0.7 source
        shell: bash
        run: |
          set -euo pipefail
          source_root="$GITHUB_WORKSPACE/work/source/Flight-Commander-Firmware-Source-v${RELEASE_VERSION}"
          python3 release-candidate/prepare-firmware-3.0.7.py "${source_root}"
          python3 -m py_compile \
            "${source_root}/flight-commander/verify-release.py" \
            "${source_root}/flight-commander/verify-compass-release.py"
          python3 - "${source_root}" <<'PY'
          import importlib.util
          import pathlib
          import sys

          root = pathlib.Path(sys.argv[1])
          verifier_path = root / 'flight-commander/verify-release.py'
          spec = importlib.util.spec_from_file_location('verify_release', verifier_path)
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          module.verify_source(root)
          print('Firmware 3.0.7 source contract: PASS')
          PY

      - name: Install pinned Arm GNU Toolchain 13.2.1
        shell: bash
        run: |
          set -euo pipefail
          archive=arm-gnu-toolchain-13.2.rel1-x86_64-arm-none-eabi.tar.xz
          url=https://developer.arm.com/-/media/Files/downloads/gnu/13.2.rel1/binrel/${archive}
          curl --fail --location --retry 3 --output /tmp/${archive} "${url}"
          echo "6cd1bbc1d9ae57312bcd169ae283153a9572bd6a8e4eeae2fedfbc33b115fdbb  /tmp/${archive}" \
            | sha256sum --check --strict
          tar -xJf /tmp/${archive} -C /tmp
          echo "/tmp/arm-gnu-toolchain-13.2.Rel1-x86_64-arm-none-eabi/bin" >> "$GITHUB_PATH"

      - name: Build, manifest, verify, and package
        shell: bash
        run: |
          set -euo pipefail
          source_root="$GITHUB_WORKSPACE/work/source/Flight-Commander-Firmware-Source-v${RELEASE_VERSION}"
          source_revision="$({
            cd "${source_root}"
            find . -type f ! -path './RELEASE-MANIFEST.json' -print0 |
              LC_ALL=C sort -z | xargs -0 sha256sum
          } | sha1sum | cut -d' ' -f1)"
          source_tree="$({
            printf 'flight-commander-source-tree-v1\n'
            cd "${source_root}"
            find . -type f ! -path './RELEASE-MANIFEST.json' -print0 |
              LC_ALL=C sort -z | xargs -0 sha256sum
          } | sha1sum | cut -d' ' -f1)"
          source_date_epoch="$(date -u +%s)"
          export FLIGHT_COMMANDER_SOURCE_REVISION="${source_revision}"
          export SOURCE_DATE_EPOCH="${source_date_epoch}"

          bash "${source_root}/flight-commander/build-micoair743.sh" "$GITHUB_WORKSPACE/work/build"
          built_hex="$GITHUB_WORKSPACE/work/build/Flight-Commander-Firmware-${RELEASE_VERSION}-${FIRMWARE_TARGET}.hex"
          test -s "${built_hex}"
          firmware_sha256="$(sha256sum "${built_hex}" | cut -d' ' -f1)"
          firmware_bytes="$(stat -c '%s' "${built_hex}")"

          python3 - "${source_root}/RELEASE-MANIFEST.json" \
            "${source_revision}" "${source_tree}" "${source_date_epoch}" \
            "${firmware_sha256}" "${firmware_bytes}" <<'PY'
          import json
          import pathlib
          import sys

          output, revision, tree, epoch, digest, size = sys.argv[1:]
          manifest = {
              "schema": 1,
              "product": "Flight Commander Firmware",
              "version": "3.0.7",
              "target": "MICOAIR743",
              "inav_release": "9.1.0",
              "inav_commit": "e519b69b02e27c8bdc03b4a0889f1baaae211a54",
              "source_revision": revision,
              "source_tree": tree,
              "source_hash_scheme": "sha1(sorted sha256sum records, excluding RELEASE-MANIFEST.json)",
              "source_tree_hash_scheme": "sha1('flight-commander-source-tree-v1\\n' plus sorted sha256sum records, excluding RELEASE-MANIFEST.json)",
              "source_date_epoch": int(epoch),
              "capabilities": "0x00001fff",
              "artifact": {
                  "filename": "Flight-Commander-Firmware-3.0.7-MICOAIR743.hex",
                  "sha256": digest,
                  "bytes": int(size),
              },
              "bench_acceptance": {
                  "mapping": {"x": "-native_y", "y": "-native_x", "z": "native_z"},
                  "user_alignment": "CW0_DEG",
                  "result": "accepted",
              },
          }
          pathlib.Path(output).write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8")
          PY

          python3 "${source_root}/flight-commander/verify-release.py" \
            --source-root "${source_root}" \
            --hex "${built_hex}" \
            --manifest "${source_root}/RELEASE-MANIFEST.json"
          python3 "${source_root}/flight-commander/verify-compass-release.py" "${built_hex}"

          cp "${built_hex}" "$GITHUB_WORKSPACE/dist/Flight-Commander-Firmware-${RELEASE_VERSION}-${FIRMWARE_TARGET}.hex"
          cd "$GITHUB_WORKSPACE/work/source"
          zip -X -q -r "$GITHUB_WORKSPACE/dist/Flight-Commander-Firmware-Source-v${RELEASE_VERSION}.zip" \
            "Flight-Commander-Firmware-Source-v${RELEASE_VERSION}"
          source_sha256="$(sha256sum "$GITHUB_WORKSPACE/dist/Flight-Commander-Firmware-Source-v${RELEASE_VERSION}.zip" | cut -d' ' -f1)"
          unzip -tq "$GITHUB_WORKSPACE/dist/Flight-Commander-Firmware-Source-v${RELEASE_VERSION}.zip"

          python3 - "$GITHUB_WORKSPACE/dist/firmware-metadata.json" \
            "${firmware_sha256}" "${source_sha256}" "${source_revision}" "${source_tree}" "${firmware_bytes}" <<'PY'
          import json
          import pathlib
          import sys

          output, firmware_sha, source_sha, revision, tree, firmware_bytes = sys.argv[1:]
          data = {
              "version": "3.0.7",
              "target": "MICOAIR743",
              "firmware_sha256": firmware_sha,
              "firmware_bytes": int(firmware_bytes),
              "source_sha256": source_sha,
              "source_revision": revision,
              "source_tree": tree,
              "mapping": {"x": "-native_y", "y": "-native_x", "z": "native_z"},
              "user_alignment": "CW0_DEG",
          }
          pathlib.Path(output).write_text(json.dumps(data, indent=2) + "\n", encoding="utf-8")
          PY
          sha256sum "$GITHUB_WORKSPACE/dist/"*

      - name: Upload firmware and exact source
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: flight-commander-3.0.7-firmware
          path: dist/**
          if-no-files-found: error
          retention-days: 7
