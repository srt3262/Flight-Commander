name: Apply Flight Commander Configurator 4.0.0

"on":
  push:
    branches:
      - develop/4.0.0-holybro-moving-baseline
    paths:
      - scripts/apply-flight-commander-4.0.0.py
      - .github/workflows/apply-flight-commander-4.0.0.yml

permissions:
  contents: write

concurrency:
  group: flight-commander-4.0.0-configurator-apply
  cancel-in-progress: false

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop/4.0.0-holybro-moving-baseline
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - name: Apply source migration and run focused tests
        id: migration
        shell: bash
        run: |
          set +e
          : > configurator-4.0.0-apply.log
          python3 scripts/apply-flight-commander-4.0.0.py >> configurator-4.0.0-apply.log 2>&1
          rc=$?
          if [[ $rc -eq 0 ]]; then
            corepack enable >> configurator-4.0.0-apply.log 2>&1
            yarn install --frozen-lockfile >> configurator-4.0.0-apply.log 2>&1
            rc=$?
          fi
          if [[ $rc -eq 0 ]]; then
            yarn test:flight-commander >> configurator-4.0.0-apply.log 2>&1
            rc=$?
          fi
          echo "$rc" > configurator-4.0.0-apply.status
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Commit migration result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Validate Flight Commander Configurator 4.0.0 moving-baseline support'
          git push origin HEAD:develop/4.0.0-holybro-moving-baseline
      - name: Fail when migration tests failed
        if: steps.migration.outputs.rc != '0'
        shell: bash
        run: |
          cat configurator-4.0.0-apply.log
          exit 1
