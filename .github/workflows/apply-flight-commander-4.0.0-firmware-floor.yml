name: Apply Flight Commander 4.0.0 firmware floor

"on":
  push:
    branches:
      - develop/4.0.0-holybro-moving-baseline
    paths:
      - .github/workflows/apply-flight-commander-4.0.0-firmware-floor.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop/4.0.0-holybro-moving-baseline
          fetch-depth: 1
      - name: Set the 4.0.0 support floor and trigger coordinated validation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          catalog = Path('js/flightCommander/firmwareCatalog.js')
          text = catalog.read_text(encoding='utf-8')
          old = 'FLIGHT_COMMANDER_MINIMUM_SUPPORTED_FIRMWARE_VERSION = "3.0.7"'
          new = 'FLIGHT_COMMANDER_MINIMUM_SUPPORTED_FIRMWARE_VERSION = "4.0.0"'
          if old not in text and new not in text:
              raise SystemExit('Firmware support floor declaration was not found')
          catalog.write_text(text.replace(old, new), encoding='utf-8')

          finalizer = Path('scripts/finalize-flight-commander-4.0.0-contracts.py')
          text = finalizer.read_text(encoding='utf-8')
          marker = '# Flight Commander 4.0.0 is the minimum supported firmware for this coordinated release.\n'
          if marker not in text:
              text = text.replace(
                  '# Coordinated source and package contracts validated together.\n',
                  '# Coordinated source and package contracts validated together.\n' + marker,
                  1,
              )
          finalizer.write_text(text, encoding='utf-8')
          PY
          rm .github/workflows/apply-flight-commander-4.0.0-firmware-floor.yml
      - name: Commit the coordinated support-floor correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Set Flight Commander 4.0.0 as the firmware support floor'
          git push origin HEAD:develop/4.0.0-holybro-moving-baseline
