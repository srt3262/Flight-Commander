name: One-time inspect Flight Commander 4.0.8 MAVLink identity

"on":
  push:
    branches:
      - fix/flight-commander-4.1.3-gcs-flasher
    paths:
      - .github/workflows/one-time-inspect-flight-commander-4.0.8-mavlink.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: fix/flight-commander-4.1.3-gcs-flasher
          fetch-depth: 0
          persist-credentials: true

      - name: Inspect retained 4.0.8 firmware source
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/fc-fw-4.0.8"
          rm -rf "$work"
          mkdir -p "$work"
          unzip -q release/firmware/Flight-Commander-Firmware-Source-v4.0.8.zip -d "$work"
          mkdir -p docs/internal
          output=docs/internal/flight-commander-4.0.8-mavlink-identity-inspection.txt
          {
            echo 'Flight Commander Firmware 4.0.8 MAVLink identity inspection'
            echo
            echo '--- MAVLink-related source paths ---'
            find "$work" -type f \( -iname '*mavlink*' -o -iname '*telemetry*' \) | sort | sed "s#^$work/##" | head -n 500
            echo
            echo '--- Identity and AUTOPILOT_VERSION references ---'
            grep -RInE --include='*.c' --include='*.h' --include='*.cpp' \
              'AUTOPILOT_VERSION|flight_custom_version|mavlink_msg_autopilot_version|MAV_CMD_REQUEST_AUTOPILOT_CAPABILITIES|MAV_CMD_REQUEST_MESSAGE|FLIGHT_COMMANDER_INFO_SIGNATURE|FLIGHT_COMMANDER_CAPABILITIES' \
              "$work" | sed "s#^$work/##" | head -n 1200 || true
          } > "$output"
          test -s "$output"

      - name: Commit inspection result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/internal/flight-commander-4.0.8-mavlink-identity-inspection.txt
          git commit -m "Inspect Flight Commander 4.0.8 MAVLink identity path"
          git push origin HEAD:fix/flight-commander-4.1.3-gcs-flasher
