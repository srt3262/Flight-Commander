name: Fix Flight Commander 4.0.0 allocator loop types

"on":
  push:
    branches:
      - develop/4.0.0-holybro-moving-baseline
    paths:
      - .github/workflows/fix-flight-commander-4.0.0-allocator-sign.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop/4.0.0-holybro-moving-baseline
          fetch-depth: 1
      - name: Use integer node-ID bounds compatible with signed and unsigned loops
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/flight_commander_dronecan_allocator_4_0_0.py')
          text = path.read_text(encoding='utf-8')
          replacements = {
              '#define DRONECAN_ALLOCATOR_HIGHEST_ASSIGNABLE_NODE_ID 125U':
                  '#define DRONECAN_ALLOCATOR_HIGHEST_ASSIGNABLE_NODE_ID 125',
              '#define DRONECAN_ALLOCATOR_LOWEST_ASSIGNABLE_NODE_ID 1U':
                  '#define DRONECAN_ALLOCATOR_LOWEST_ASSIGNABLE_NODE_ID 1',
          }
          for old, new in replacements.items():
              if old not in text and new not in text:
                  raise SystemExit(f'Allocator bound was not found: {old}')
              text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')
          PY
          rm .github/workflows/fix-flight-commander-4.0.0-allocator-sign.yml
      - name: Commit the allocator type correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Fix DroneCAN allocator node-ID loop types'
          git push origin HEAD:develop/4.0.0-holybro-moving-baseline
