name: Integrate Flight Commander 4.0.0 DroneCAN allocator

"on":
  push:
    branches:
      - develop/4.0.0-holybro-moving-baseline
    paths:
      - .github/workflows/integrate-flight-commander-4.0.0-dna-allocator.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop/4.0.0-holybro-moving-baseline
          fetch-depth: 1
      - name: Integrate dynamic node allocation before firmware source hashing
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          generator = Path('scripts/prepare-flight-commander-firmware-4.0.0.py')
          text = generator.read_text(encoding='utf-8')
          import_line = 'from flight_commander_dronecan_allocator_4_0_0 import apply_dynamic_node_allocator\n'
          if import_line not in text:
              anchor = 'from pathlib import Path\n'
              if anchor not in text:
                  raise SystemExit('Firmware source generator import anchor was not found')
              text = text.replace(anchor, anchor + '\n' + import_line, 1)
          call = '    apply_dynamic_node_allocator(root)\n'
          if call not in text:
              anchor = '    patch_build(root)\n    revision, tree = write_manifest(root)\n'
              if anchor not in text:
                  raise SystemExit('Firmware source generator finalization anchor was not found')
              text = text.replace(
                  anchor,
                  '    patch_build(root)\n' + call + '    revision, tree = write_manifest(root)\n',
                  1,
              )
          generator.write_text(text, encoding='utf-8')

          for workflow_name in [
              '.github/workflows/build-flight-commander-firmware-4.0.0.yml',
              '.github/workflows/pr-validate-flight-commander-4.0.0.yml',
          ]:
              workflow = Path(workflow_name)
              text = workflow.read_text(encoding='utf-8')
              allocator_path = '      - scripts/flight_commander_dronecan_allocator_4_0_0.py\n'
              if allocator_path not in text:
                  anchor = '      - scripts/prepare-flight-commander-firmware-4.0.0.py\n'
                  if anchor not in text:
                      raise SystemExit(f'{workflow_name}: path trigger anchor was not found')
                  text = text.replace(anchor, anchor + allocator_path, 1)
              workflow.write_text(text, encoding='utf-8')

          guide = Path('docs/GPS_AND_RTK.md')
          text = guide.read_text(encoding='utf-8')
          paragraph = (
              'Flight Commander 4.0.0 also acts as the DroneCAN dynamic node-ID allocator. '
              'Holybro/AP_Periph modules left at `CAN_NODE=0` receive temporary unique IDs '
              'automatically, appear in discovery, and are then converted to persistent static '
              'IDs when **Configure and verify pair** completes.\n\n'
          )
          marker = '### Two-node Holybro/AP_Periph moving-baseline pair\n\n'
          if paragraph not in text:
              if marker not in text:
                  raise SystemExit('GPS/RTK moving-baseline documentation anchor was not found')
              text = text.replace(marker, marker + paragraph, 1)
          guide.write_text(text, encoding='utf-8')
          PY
          rm .github/workflows/integrate-flight-commander-4.0.0-dna-allocator.yml
      - name: Commit the allocator integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Integrate DroneCAN dynamic node allocation into Flight Commander 4.0.0'
          git push origin HEAD:develop/4.0.0-holybro-moving-baseline
