name: Repair 4.0.2 release branch once

"on":
  push:
    branches:
      - agent/fix-compass-persistence-and-local-flashing
    paths:
      - .github/workflows/repair-4.0.2-release-branch.yml

permissions:
  contents: write

concurrency:
  group: repair-flight-commander-4.0.2-release-branch
  cancel-in-progress: false

jobs:
  repair:
    name: Consolidate beta publication workflow
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the release branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: agent/fix-compass-persistence-and-local-flashing
          fetch-depth: 0

      - name: Repair stale references and remove legacy release workflows
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_REPAIR'
          import re
          from pathlib import Path

          root = Path.cwd()
          canonical = ".github/workflows/publish-flight-commander-beta.yml"
          obsolete = ".github/workflows/publish-flight-commander-4.0.2-beta.yml"

          replacements = {
              Path("tests/flight-commander/packaging/package-contract.test.mjs"): (
                  (obsolete, canonical),
                  (
                      "assert.match(releaseOrchestrator, /Publish Flight Commander 4\\.0\\.2 beta prerelease/);",
                      "assert.match(releaseOrchestrator, /name: Publish Flight Commander beta release/);",
                  ),
              ),
              Path("scripts/apply-flight-commander-4.0.2-beta.py"): (
                  (
                      'BETA_WORKFLOW = ".github/workflows/publish-flight-commander-4.0.2-beta.yml"',
                      'BETA_WORKFLOW = ".github/workflows/publish-flight-commander-beta.yml"',
                  ),
                  (
                      "assert.match(releaseOrchestrator, /Publish Flight Commander 4\\\\.0\\\\.2 beta prerelease/);",
                      "assert.match(releaseOrchestrator, /name: Publish Flight Commander beta release/);",
                  ),
              ),
          }

          for relative, edits in replacements.items():
              path = root / relative
              text = path.read_text(encoding="utf-8")
              for old, new in edits:
                  count = text.count(old)
                  if count != 1:
                      raise RuntimeError(f"{relative}: expected one occurrence of {old!r}, found {count}")
                  text = text.replace(old, new, 1)
              path.write_text(text, encoding="utf-8", newline="\n")

          workflow_dir = root / ".github/workflows"
          repair_path = workflow_dir / "repair-4.0.2-release-branch.yml"
          canonical_path = root / canonical
          if not canonical_path.is_file():
              raise RuntimeError(f"Canonical beta publisher is missing: {canonical}")

          workflow_text = canonical_path.read_text(encoding="utf-8")
          workflow_text = workflow_text.replace(
              "      - agent/fix-compass-persistence-and-local-flashing\n",
              "",
          )
          cleanup_marker = "      - name: Create or refresh the exact beta prerelease\n"
          cleanup_step = r'''      - name: Remove every standalone Flight Commander firmware asset older than 4.0.0
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/firmware-cleanup"
          rm -rf "$work"
          mkdir -p "$work"

          collect_assets() {
            local output="$1"
            local page=1
            : > "$output"
            while true; do
              local page_json="$work/releases-$page.json"
              gh api "/repos/$GITHUB_REPOSITORY/releases?per_page=100&page=$page" > "$page_json"
              local count
              count="$(jq 'length' "$page_json")"
              if [[ "$count" -eq 0 ]]; then break; fi
              jq -r '.[] | .assets[]? | [.id, .name] | @tsv' "$page_json" >> "$output"
              if [[ "$count" -lt 100 ]]; then break; fi
              page=$((page + 1))
            done
          }

          collect_assets "$work/assets.tsv"
          python3 - "$work/assets.tsv" "$work/delete.tsv" <<'PY_CLEANUP'
          from pathlib import Path
          import re
          import sys

          source = Path(sys.argv[1])
          output = Path(sys.argv[2])
          patterns = (
              re.compile(r'^Flight-Commander-Firmware-(\d+)\.(\d+)\.(\d+)-.+\.(?:hex|bin)$', re.I),
              re.compile(r'^FC-Firmware-v(\d+)\.(\d+)\.(\d+)-.+\.(?:hex|bin)$', re.I),
              re.compile(r'^Flight-Commander-Firmware-Source-v(\d+)\.(\d+)\.(\d+)\.zip$', re.I),
              re.compile(r'^FC-Firmware-Source-v(\d+)\.(\d+)\.(\d+)\.zip$', re.I),
          )
          minimum = (4, 0, 0)
          delete = []
          for line in source.read_text(encoding='utf-8').splitlines():
              asset_id, name = line.split('\t', 1)
              for pattern in patterns:
                  match = pattern.match(name)
                  if match:
                      if tuple(map(int, match.groups())) < minimum:
                          delete.append((asset_id, name))
                      break
          output.write_text(
              ''.join(f'{asset_id}\t{name}\n' for asset_id, name in delete),
              encoding='utf-8',
          )
          print(f'Identified {len(delete)} superseded standalone firmware assets.')
          PY_CLEANUP

          while IFS=$'\t' read -r asset_id asset_name; do
            [[ -n "$asset_id" ]] || continue
            echo "Removing superseded firmware asset: $asset_name"
            gh api --method DELETE \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "/repos/$GITHUB_REPOSITORY/releases/assets/$asset_id"
          done < "$work/delete.tsv"

          collect_assets "$work/remaining.tsv"
          python3 - "$work/remaining.tsv" <<'PY_VERIFY'
          from pathlib import Path
          import re
          import sys

          patterns = (
              re.compile(r'^Flight-Commander-Firmware-(\d+)\.(\d+)\.(\d+)-.+\.(?:hex|bin)$', re.I),
              re.compile(r'^FC-Firmware-v(\d+)\.(\d+)\.(\d+)-.+\.(?:hex|bin)$', re.I),
              re.compile(r'^Flight-Commander-Firmware-Source-v(\d+)\.(\d+)\.(\d+)\.zip$', re.I),
              re.compile(r'^FC-Firmware-Source-v(\d+)\.(\d+)\.(\d+)\.zip$', re.I),
          )
          minimum = (4, 0, 0)
          stale = []
          for line in Path(sys.argv[1]).read_text(encoding='utf-8').splitlines():
              _, name = line.split('\t', 1)
              for pattern in patterns:
                  match = pattern.match(name)
                  if match and tuple(map(int, match.groups())) < minimum:
                      stale.append(name)
                      break
          if stale:
              raise SystemExit('Superseded firmware remains after cleanup: ' + ', '.join(stale))
          print('Pre-4.0.0 standalone firmware cleanup: PASS')
          PY_VERIFY

'''
          if "Remove every standalone Flight Commander firmware asset older than 4.0.0" not in workflow_text:
              if workflow_text.count(cleanup_marker) != 1:
                  raise RuntimeError("The beta publication insertion point is missing or ambiguous.")
              workflow_text = workflow_text.replace(cleanup_marker, cleanup_step + cleanup_marker, 1)
          canonical_path.write_text(workflow_text, encoding="utf-8", newline="\n")

          removed = []
          explicit_obsolete = {
              "release-4.0.1-orchestrator.yml",
              "publish-flight-commander-4.0.2-beta.yml",
          }
          legacy_name = re.compile(
              r"^name:\s*.*Flight Commander 4\.0\.[01].*$",
              re.MULTILINE,
          )
          for path in sorted(workflow_dir.glob("*.y*ml")):
              if path in {repair_path, canonical_path}:
                  continue
              text = path.read_text(encoding="utf-8")
              if path.name in explicit_obsolete or legacy_name.search(text):
                  removed.append(path.as_posix())
                  path.unlink()

          test_text = (root / "tests/flight-commander/packaging/package-contract.test.mjs").read_text(encoding="utf-8")
          script_text = (root / "scripts/apply-flight-commander-4.0.2-beta.py").read_text(encoding="utf-8")
          canonical_text = canonical_path.read_text(encoding="utf-8")
          if obsolete in test_text or obsolete in script_text:
              raise RuntimeError("A stale version-specific beta workflow reference remains.")
          if "name: Publish Flight Commander beta release" not in test_text:
              raise RuntimeError("The packaging contract does not validate the canonical workflow name.")
          if "Superseded firmware remains after cleanup" not in canonical_text:
              raise RuntimeError("The consolidated publisher is missing firmware cleanup verification.")
          if "agent/fix-compass-persistence-and-local-flashing" in canonical_text:
              raise RuntimeError("The canonical publisher must run automatically only from main.")

          print("Removed legacy workflows:")
          for path in removed:
              print(f"  - {path}")
          if not removed:
              print("  - none found")

          repair_path.unlink()
          PY_REPAIR

      - name: Run focused publication contract test
        run: node --test tests/flight-commander/packaging/package-contract.test.mjs

      - name: Commit the consolidated release path
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Release branch already repaired."
            exit 0
          fi
          git commit -m "ci: consolidate beta publication workflow"
          git push origin "HEAD:agent/fix-compass-persistence-and-local-flashing"
