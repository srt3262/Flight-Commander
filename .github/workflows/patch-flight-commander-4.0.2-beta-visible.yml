name: Correct Flight Commander 4.0.2 beta retention

"on":
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
    paths:
      - .github/workflows/patch-flight-commander-4.0.2-beta-visible.yml

permissions: {}

jobs:
  patch-publisher:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Check out beta branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: agent/fix-compass-persistence-and-local-flashing
          fetch-depth: 1

      - name: Require only the declared current firmware pair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/publish-flight-commander-4.0.2-beta-visible.yml')
          text = path.read_text(encoding='utf-8')
          old = """          find release/firmware -maxdepth 1 -type f -name '*.hex' \\
            ! -name 'Flight-Commander-Firmware-4.0.2-MICOAIR743.hex' -delete
"""
          new = """          find release/firmware -maxdepth 1 -type f \\
            ! -name 'Flight-Commander-Firmware-4.0.2-MICOAIR743.hex' \\
            ! -name 'Flight-Commander-Firmware-Source-v4.0.2.zip' -delete
"""
          if old not in text:
              if new not in text:
                  raise SystemExit('Expected firmware-retention block is missing.')
          else:
              text = text.replace(old, new, 1)
          text = text.replace(
              "          test -f release/firmware/Flight-Commander-Firmware-Source-v4.0.1.zip\n",
              '',
              1,
          )
          path.write_text(text, encoding='utf-8', newline='\n')
          PY
          git diff --check
          git diff -- .github/workflows/publish-flight-commander-4.0.2-beta-visible.yml

      - name: Commit publisher correction and remove one-shot patcher
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/patch-flight-commander-4.0.2-beta-visible.yml
          git add .github/workflows/publish-flight-commander-4.0.2-beta-visible.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Require current firmware pair for 4.0.2 beta'
          git push origin HEAD:agent/fix-compass-persistence-and-local-flashing
