name: CI

"on":
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  normalize-release-branch:
    name: Normalize the 4.0.2 beta release branch once
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.finalize.outputs.changed }}

    steps:
      - name: Check out the event source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Apply and verify the one-time release repair
        id: finalize
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          CURRENT_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          echo "changed=false" >> "$GITHUB_OUTPUT"

          if [[ "$EVENT_NAME" != "pull_request" || \
                "$HEAD_REF" != "agent/fix-compass-persistence-and-local-flashing" || \
                "$HEAD_REPOSITORY" != "$CURRENT_REPOSITORY" || \
                ! -f scripts/finalize-flight-commander-4.0.2-beta.py ]]; then
            echo "No one-time release normalization is required."
            exit 0
          fi

          python3 scripts/finalize-flight-commander-4.0.2-beta.py
          node --test tests/flight-commander/packaging/package-contract.test.mjs

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "The release branch was already normalized."
            exit 0
          fi

          git commit -m "ci: finalize the Flight Commander 4.0.2 beta publisher"
          git push origin "HEAD:$HEAD_REF"
          echo "changed=true" >> "$GITHUB_OUTPUT"

  test:
    name: Test
    needs: normalize-release-branch
    if: needs.normalize-release-branch.outputs.changed != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Enable pinned Yarn
        run: |
          corepack enable
          yarn --version

      - name: Install dependencies
        run: yarn install --frozen-lockfile --non-interactive

      - name: Run tests
        run: yarn test

  firmware-reproducibility:
    name: Rebuild firmware from published source ZIP
    needs: normalize-release-branch
    if: needs.normalize-release-branch.outputs.changed != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Verify firmware source archive reproducibility
        run: bash scripts/rebuild-firmware-source-archive.sh

  windows-package:
    name: Package and verify Windows x64
    needs:
      - test
      - firmware-reproducibility
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Enable pinned Yarn
        shell: pwsh
        run: |
          corepack enable
          yarn --version

      - name: Install dependencies
        run: yarn install --frozen-lockfile --non-interactive

      - name: Package Windows x64
        run: yarn package:windows

      - name: Verify packaged application
        run: yarn verify:windows

      - name: Upload verified application
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: flight-commander-windows-x64-${{ github.sha }}
          path: out/**
          if-no-files-found: error
          retention-days: 7
