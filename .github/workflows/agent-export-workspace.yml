name: Agent export workspace

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  export-workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Clone exact pull-request branch without marketplace actions
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "${GITHUB_HEAD_REF}" \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" workspace

      - name: Create source workspace archive
        shell: bash
        run: |
          set -euo pipefail
          tar -C workspace --exclude=.git -czf flight-commander-workspace.tar.gz .

      - name: Upload source workspace through the runner artifact client
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .artifact-client
          cd .artifact-client
          npm init -y >/dev/null
          npm install --no-save --ignore-scripts @actions/artifact@2.3.2 >/dev/null
          cd ..
          node <<'NODE'
          const { DefaultArtifactClient } = require('./.artifact-client/node_modules/@actions/artifact');
          const path = require('node:path');
          (async () => {
            const archive = path.resolve('flight-commander-workspace.tar.gz');
            const client = new DefaultArtifactClient();
            const result = await client.uploadArtifact(
              'flight-commander-workspace',
              [archive],
              process.cwd(),
              { retentionDays: 1 },
            );
            console.log(JSON.stringify(result));
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE
