name: Validate Flight Commander 4.0.0 firmware

"on":
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/pr-validate-flight-commander-4.0.0.yml
      - .github/workflows/release-4.0.0-orchestrator.yml
      - scripts/**
      - release/firmware/**
      - js/**
      - tabs/**
      - tests/**
      - package.json
      - manifest.json

permissions:
  contents: read

concurrency:
  group: flight-commander-4.0.0-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out exact pull-request revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Install firmware build prerequisites
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build curl xz-utils unzip zip python3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Verify published firmware source reproducibility
        shell: bash
        run: bash scripts/rebuild-firmware-source-archive.sh

      - name: Run complete coordinated Configurator tests
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare yarn@1.22.22 --activate
          yarn install --frozen-lockfile --non-interactive
          yarn test
