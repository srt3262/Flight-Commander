name: One-time dispatch Flight Commander 4.1.3 preparation

"on":
  push:
    branches:
      - main
    paths:
      - .github/workflows/one-time-dispatch-flight-commander-4.1.3.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: one-time-dispatch-flight-commander-4.1.3
  cancel-in-progress: false

jobs:
  transform:
    name: Transform and test the Flight Commander 4.1.3 branch
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out transformation branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: fix/flight-commander-4.1.3-gcs-flasher
          fetch-depth: 0
          persist-credentials: true

      - name: Decode and apply the staged 4.1.3 transformation
        shell: bash
        run: |
          set -euo pipefail
          cat \
            scripts/internal/flight-commander-4.1.3-transform.b64.part00 \
            scripts/internal/flight-commander-4.1.3-transform.b64.part01 \
            | tr -d '\r\n' \
            | base64 --decode \
            | gzip --decompress \
            > /tmp/prepare-flight-commander-4.1.3.py
          python3 -m py_compile /tmp/prepare-flight-commander-4.1.3.py
          python3 /tmp/prepare-flight-commander-4.1.3.py

      - name: Inspect retained 4.0.8 firmware MAVLink identity support
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/fc-fw-4.0.8"
          rm -rf "$work"
          mkdir -p "$work"
          unzip -q release/firmware/Flight-Commander-Firmware-Source-v4.0.8.zip -d "$work"
          mkdir -p docs/internal
          output=docs/internal/flight-commander-4.0.8-mavlink-identity-inspection.txt
          {
            echo 'Flight Commander Firmware 4.0.8 MAVLink identity inspection'
            echo
            echo '--- Identity and AUTOPILOT_VERSION references ---'
            grep -RInE --include='*.c' --include='*.h' --include='*.cpp' \
              'AUTOPILOT_VERSION|flight_custom_version|mavlink_msg_autopilot_version|MAV_CMD_REQUEST_AUTOPILOT_CAPABILITIES|MAV_CMD_REQUEST_MESSAGE|FLIGHT_COMMANDER_INFO_SIGNATURE|FLIGHT_COMMANDER_CAPABILITIES' \
              "$work" | sed "s#^$work/##" | head -n 1600 || true
          } > "$output"
          test -s "$output"

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Install and run source tests
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare yarn@1.22.22 --activate
          yarn install --frozen-lockfile --non-interactive
          yarn test

      - name: Commit the tested transformation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- \
            ':!.github/workflows/one-time-prepare-flight-commander-4.1.3.yml' \
            ':!.github/workflows/one-time-inspect-flight-commander-4.0.8-mavlink.yml' \
            ':!scripts/internal/flight-commander-4.1.3-transform.b64.part00' \
            ':!scripts/internal/flight-commander-4.1.3-transform.b64.part01'
          if git diff --cached --quiet; then
            echo 'Transformation produced no source changes.'
            exit 1
          fi
          git commit -m "Prepare Flight Commander 4.1.3 GCS and flasher fixes"
          git push origin HEAD:fix/flight-commander-4.1.3-gcs-flasher
