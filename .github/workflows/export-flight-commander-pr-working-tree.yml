name: Export Flight Commander PR working tree

"on":
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/export-flight-commander-pr-working-tree.yml
      - release/firmware/**
      - release/firmware-patches/**
      - release/configurator-patches/4.0.8-compass-source-selection.patch
      - dev/firmware-4.0.7-source/**
      - tabs/configuration.*
      - scripts/assemble-flight-commander-4.0.8-beta.py
      - scripts/build-flight-commander-*-firmware.py
      - js/flightCommander/**
      - tabs/calibration.*
      - tabs/flight_data.*
      - tabs/flight_hud-v1.3.5.js
      - package.json
      - manifest.json

permissions:
  contents: write

jobs:
  assemble-4-0-8:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: agent/fix-4.0.6-imu-handedness
          fetch-depth: 0
      - name: Apply independent onboard and external compass selection
        shell: bash
        run: |
          set -euo pipefail
          if grep -q 'id="external-compass-source"' tabs/configuration.html; then
            echo 'Compass source selection contract is already applied.'
          else
            git apply --check release/configurator-patches/4.0.8-compass-source-selection.patch
            git apply release/configurator-patches/4.0.8-compass-source-selection.patch
          fi
      - name: Skip an already assembled release
        id: assembled
        shell: bash
        run: |
          set -euo pipefail
          if grep -q '"version": "4.0.8"' package.json \
             && test -s release/firmware/Flight-Commander-Firmware-4.0.8-MICOAIR743.hex \
             && test -s release/firmware/Flight-Commander-Firmware-Source-v4.0.8.zip; then
            echo 'skip=true' >> "$GITHUB_OUTPUT"
          else
            echo 'skip=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Install Arm GNU Toolchain 13.2.1
        if: steps.assembled.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          archive=arm-gnu-toolchain-13.2.rel1-x86_64-arm-none-eabi.tar.xz
          url="https://developer.arm.com/-/media/Files/downloads/gnu/13.2.rel1/binrel/$archive"
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/$archive" "$url"
          printf '%s  %s\n' \
            '6cd1bbc1d9ae57312bcd169ae283153a9572bd6a8e4eeae2fedfbc33b115fdbb' \
            "$RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xJf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/arm-gnu-toolchain-13.2.Rel1-x86_64-arm-none-eabi/bin" >> "$GITHUB_PATH"
      - name: Assemble and compile 4.0.8 beta inputs
        if: steps.assembled.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          test "$(arm-none-eabi-gcc -dumpfullversion -dumpversion)" = '13.2.1'
          python3 scripts/assemble-flight-commander-4.0.8-beta.py "$RUNNER_TEMP/flight-commander-4.0.8"
          python3 -m py_compile scripts/assemble-flight-commander-4.0.8-beta.py \
            scripts/build-flight-commander-4.0.8-firmware.py
          bash scripts/rebuild-firmware-source-archive.sh
      - name: Commit exact 4.0.8 release inputs
        if: steps.assembled.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git add \
            tabs/configuration.html tabs/configuration.js \
            js/flightCommander/headingFusion.js \
            dev/firmware-4.0.7-source/src/main/flight_commander/heading_fusion.c \
            tests/flight-commander/configurator/compass-source-configuration.test.mjs \
            release/configurator-patches/4.0.8-compass-source-selection.patch \
            package.json manifest.json CHANGELOG.md \
            js/main/ntripClient.js tabs/landing.html tabs/flight_hud-v1.3.5.js \
            tests/flight-commander/gcs/ground-control-hud.test.mjs \
            tests/flight-commander/firmware/flight-commander-catalog.test.mjs \
            tests/flight-commander/firmware/export-calibration-source.test.mjs \
            tests/flight-commander/packaging/package-contract.test.mjs \
            release/notes/v4.0.8-beta.md \
            release/firmware-patches/4.0.8.patch \
            release/firmware/Flight-Commander-Firmware-4.0.8-MICOAIR743.hex \
            release/firmware/Flight-Commander-Firmware-Source-v4.0.8.zip \
            release/firmware/build-metadata-4.0.8.json \
            scripts/build-flight-commander-4.0.8-firmware.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Assemble coordinated Flight Commander 4.0.8 beta inputs'
          git push origin HEAD:agent/fix-4.0.6-imu-handedness

  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Archive exact checked-out working tree
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=zip --output=flight-commander-pr-working-tree.zip HEAD
          test -s flight-commander-pr-working-tree.zip
      - uses: actions/upload-artifact@v4
        with:
          name: flight-commander-pr-working-tree
          retention-days: 1
          if-no-files-found: error
          path: flight-commander-pr-working-tree.zip

  diagnose-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: yarn.lock
      - name: Enable pinned Yarn
        run: |
          corepack enable
          yarn --version
      - name: Install dependencies
        run: yarn install --frozen-lockfile --non-interactive
      - name: Run tests and extract concise failures
        id: tests
        shell: bash
        run: |
          set +e
          yarn test > full-test.log 2>&1
          status=$?
          python3 - "$status" <<'PY'
          import re
          import sys
          from pathlib import Path

          status = int(sys.argv[1])
          lines = Path('full-test.log').read_text(encoding='utf-8', errors='replace').splitlines()
          output = [f'yarn test exit status: {status}', '']
          seen = set()
          for index, line in enumerate(lines):
              if not re.search(r'(^|\s)not ok\b|AssertionError|ERR_ASSERTION|SyntaxError|ReferenceError|TypeError|RangeError|error:', line):
                  continue
              start = max(0, index - 12)
              end = min(len(lines), index + 34)
              block = tuple(lines[start:end])
              marker = '\n'.join(block)
              if marker in seen:
                  continue
              seen.add(marker)
              output.append(f'===== FAILURE CONTEXT {len(seen)} =====')
              output.extend(block)
              output.append('')
              if len(seen) >= 20:
                  break
          if len(output) == 2:
              output.extend(lines[-240:])
          Path('ci-failure-summary.txt').write_text('\n'.join(output), encoding='utf-8')
          PY
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: flight-commander-4.0.8-test-failures
          retention-days: 1
          if-no-files-found: error
          path: ci-failure-summary.txt
      - name: Fail after preserving diagnostics
        if: steps.tests.outputs.status != '0'
        run: exit 1
