name: Package finalized Flight Commander 3.0.3

"on":
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: flight-commander-3.0.3-final-packaging
  cancel-in-progress: false

env:
  FINAL_SHA: 97dd54ee61713be06d977f0f76727c0a85212734

jobs:
  verify:
    name: Verify exact source and reproducible firmware
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out finalized release source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.FINAL_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact finalized revision
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "${FINAL_SHA}" ]]
          [[ "$(node -p "require('./package.json').version")" == '3.0.3' ]]

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Enable pinned Yarn
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare yarn@1.22.22 --activate
          [[ "$(yarn --version)" == '1.22.22' ]]

      - name: Install dependencies
        run: yarn install --frozen-lockfile --non-interactive

      - name: Run complete source tests
        run: yarn test

      - name: Rebuild firmware byte-for-byte from published source ZIP
        run: bash scripts/rebuild-firmware-source-archive.sh

  package:
    name: Build and verify coordinated Windows release candidate
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 55

    steps:
      - name: Check out finalized release source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.FINAL_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact finalized revision
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $actual = (git rev-parse HEAD).Trim().ToLowerInvariant()
          if ($actual -cne $env:FINAL_SHA.Trim().ToLowerInvariant()) {
            throw "Checkout $actual does not match $env:FINAL_SHA."
          }

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Enable pinned Yarn
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          corepack enable
          corepack prepare yarn@1.22.22 --activate
          if ((yarn --version).Trim() -cne '1.22.22') {
            throw 'Yarn 1.22.22 was not activated.'
          }

      - name: Install dependencies
        run: yarn install --frozen-lockfile --non-interactive

      - name: Package Windows x64
        run: yarn package:windows

      - name: Verify packaged application
        run: yarn verify:windows

      - name: Create and verify all coordinated assets
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -AssemblyName System.IO.Compression.FileSystem

          $manifest = Get-Content -LiteralPath package.json -Raw | ConvertFrom-Json
          $version = [string]$manifest.version
          $firmwareVersion = [string]$manifest.flightCommander.firmwareReleaseVersion
          if ($version -cne '3.0.3' -or $firmwareVersion -cne $version) {
            throw "Expected coordinated 3.0.3 versions; Configurator=$version firmware=$firmwareVersion."
          }
          if (-not [bool]$manifest.flightCommander.firmwareChangedInRelease) {
            throw '3.0.3 must declare a firmware change.'
          }

          $packages = @(
            Get-ChildItem -LiteralPath out -Directory |
              Where-Object { $_.Name -like '*-win32-x64' }
          )
          if ($packages.Count -ne 1) {
            throw "Expected one Windows x64 package; found $($packages.Count)."
          }

          $candidate = Join-Path $env:GITHUB_WORKSPACE 'release-candidate'
          $bundleStaging = Join-Path $env:RUNNER_TEMP 'fc303-complete'
          New-Item -ItemType Directory -Path $candidate | Out-Null
          New-Item -ItemType Directory -Path $bundleStaging | Out-Null

          $windowsName = "FC-Windows-v$version.zip"
          $sourceName = "FC-Configurator-Source-v$version.zip"
          $firmwareName = "FC-Firmware-v$version-MICOAIR743.hex"
          $firmwareSourceName = "FC-Firmware-Source-v$version.zip"
          $completeName = "Flight-Commander-v$version.zip"

          $windowsPath = Join-Path $candidate $windowsName
          $sourcePath = Join-Path $candidate $sourceName
          $firmwarePath = Join-Path $candidate $firmwareName
          $firmwareSourcePath = Join-Path $candidate $firmwareSourceName
          $completePath = Join-Path $candidate $completeName

          [System.IO.Compression.ZipFile]::CreateFromDirectory(
            $packages[0].FullName,
            $windowsPath,
            [System.IO.Compression.CompressionLevel]::Optimal,
            $false
          )

          & git archive --format=zip "--prefix=FC-Configurator-Source-v$version/" `
            "--output=$sourcePath" $env:FINAL_SHA
          if ($LASTEXITCODE -ne 0) {
            throw "Source archive failed with exit code $LASTEXITCODE."
          }

          $repositoryFirmware = Join-Path $env:GITHUB_WORKSPACE (
            "release/firmware/Flight-Commander-Firmware-$version-MICOAIR743.hex"
          )
          $repositoryFirmwareSource = Join-Path $env:GITHUB_WORKSPACE (
            "release/firmware/Flight-Commander-Firmware-Source-v$version.zip"
          )
          Copy-Item -LiteralPath $repositoryFirmware -Destination $firmwarePath
          Copy-Item -LiteralPath $repositoryFirmwareSource -Destination $firmwareSourcePath

          $firmwareHash = (Get-FileHash -LiteralPath $firmwarePath -Algorithm SHA256).Hash.ToLowerInvariant()
          $firmwareSourceHash = (Get-FileHash -LiteralPath $firmwareSourcePath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($firmwareHash -cne [string]$manifest.flightCommander.firmwareReleaseSha256) {
            throw 'Firmware SHA-256 does not match package.json.'
          }
          if ($firmwareSourceHash -cne [string]$manifest.flightCommander.firmwareSourceSha256) {
            throw 'Firmware-source SHA-256 does not match package.json.'
          }

          $windowsExtract = Join-Path $env:RUNNER_TEMP 'fc303-windows-extract'
          [System.IO.Compression.ZipFile]::ExtractToDirectory($windowsPath, $windowsExtract)
          node scripts/verify-windows-package.mjs $windowsExtract
          if ($LASTEXITCODE -ne 0) {
            throw "Extracted Windows verification failed with exit code $LASTEXITCODE."
          }

          $sourceExtract = Join-Path $env:RUNNER_TEMP 'fc303-source-extract'
          [System.IO.Compression.ZipFile]::ExtractToDirectory($sourcePath, $sourceExtract)
          $sourceRoots = @(Get-ChildItem -LiteralPath $sourceExtract)
          if ($sourceRoots.Count -ne 1 -or -not $sourceRoots[0].PSIsContainer) {
            throw 'Configurator source ZIP must contain one top-level directory.'
          }
          $sourceManifest = Get-Content -LiteralPath (
            Join-Path $sourceRoots[0].FullName 'package.json'
          ) -Raw | ConvertFrom-Json
          if ([string]$sourceManifest.version -cne $version) {
            throw 'Configurator source ZIP contains the wrong version.'
          }
          foreach ($temporaryPath in @(
            '.github/workflows/prepare-flight-commander-3.0.3.yml',
            '.github/workflows/export-source-for-packaging.yml',
            'scripts/prepare-flight-commander-3.0.3-bundle.part00'
          )) {
            if (Test-Path -LiteralPath (Join-Path $sourceRoots[0].FullName $temporaryPath)) {
              throw "Temporary preparation input leaked into source ZIP: $temporaryPath"
            }
          }

          $firmwareSourceExtract = Join-Path $env:RUNNER_TEMP 'fc303-firmware-source-extract'
          [System.IO.Compression.ZipFile]::ExtractToDirectory($firmwareSourcePath, $firmwareSourceExtract)
          $firmwareSourceRoots = @(Get-ChildItem -LiteralPath $firmwareSourceExtract)
          if (
            $firmwareSourceRoots.Count -ne 1 -or
            $firmwareSourceRoots[0].Name -cne "Flight-Commander-Firmware-Source-v$version"
          ) {
            throw 'Firmware source ZIP has the wrong canonical root.'
          }
          $firmwareReleaseManifest = Get-Content -LiteralPath (
            Join-Path $firmwareSourceRoots[0].FullName 'RELEASE-MANIFEST.json'
          ) -Raw | ConvertFrom-Json
          if (
            [string]$firmwareReleaseManifest.version -cne $version -or
            [string]$firmwareReleaseManifest.source_revision -cne [string]$manifest.flightCommander.firmwareSourceRevision -or
            [string]$firmwareReleaseManifest.source_tree -cne [string]$manifest.flightCommander.firmwareSourceTree -or
            [string]$firmwareReleaseManifest.artifact.sha256 -cne $firmwareHash -or
            [long]$firmwareReleaseManifest.artifact.bytes -ne (Get-Item -LiteralPath $firmwarePath).Length
          ) {
            throw 'Firmware source manifest does not match the firmware artifact.'
          }

          foreach ($path in @($windowsPath, $sourcePath, $firmwarePath, $firmwareSourcePath)) {
            Copy-Item -LiteralPath $path -Destination $bundleStaging
          }
          [System.IO.Compression.ZipFile]::CreateFromDirectory(
            $bundleStaging,
            $completePath,
            [System.IO.Compression.CompressionLevel]::Optimal,
            $false
          )

          $assetPaths = @($windowsPath, $sourcePath, $firmwarePath, $firmwareSourcePath, $completePath)
          $sumLines = foreach ($path in $assetPaths) {
            $hash = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $([IO.Path]::GetFileName($path))"
          }
          $sumLines | Set-Content -LiteralPath (Join-Path $candidate 'SHA256SUMS.txt') -Encoding ascii

          $releaseManifest = [ordered]@{
            schemaVersion = 1
            version = $version
            commitSha = $env:FINAL_SHA
            firmwareSourceRevision = [string]$manifest.flightCommander.firmwareSourceRevision
            firmwareSourceTree = [string]$manifest.flightCommander.firmwareSourceTree
            assets = @{}
          }
          foreach ($path in $assetPaths) {
            $file = Get-Item -LiteralPath $path
            $releaseManifest.assets[$file.Name] = [ordered]@{
              sha256 = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              bytes = $file.Length
            }
          }
          $releaseManifest | ConvertTo-Json -Depth 8 |
            Set-Content -LiteralPath (Join-Path $candidate 'release-candidate-manifest.json') -Encoding utf8

          Get-ChildItem -LiteralPath $candidate | Sort-Object Name | Format-Table Name, Length

      - name: Upload verified coordinated 3.0.3 release candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: flight-commander-3.0.3-final-${{ env.FINAL_SHA }}
          path: release-candidate/**
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
