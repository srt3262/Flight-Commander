name: Finalize Flight Commander 3.0.3 source

"on":
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: flight-commander-3.0.3-finalizer
  cancel-in-progress: false

jobs:
  finalize:
    name: Build firmware and push coordinated 3.0.3 source
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out exact release-branch source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: 1e017ff783cf698cf013a7e8e306b3b484cbdb41
          fetch-depth: 1
          persist-credentials: true

      - name: Verify release-branch revision
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == '1e017ff783cf698cf013a7e8e306b3b484cbdb41' ]]

      - name: Expand and patch pinned preparation inputs
        run: |
          set -euo pipefail
          cat scripts/prepare-flight-commander-3.0.3-bundle.part* | base64 --decode > "${RUNNER_TEMP}/prepare-flight-commander-3.0.3.tar.gz"
          printf '%s  %s\n' '9c43c0c9c83c38187ef05f6c63754df7047e6d45172cc44188d74cfa0ac0254b' "${RUNNER_TEMP}/prepare-flight-commander-3.0.3.tar.gz" | sha256sum --check --strict
          tar -xzf "${RUNNER_TEMP}/prepare-flight-commander-3.0.3.tar.gz" -C .
          python3 - <<'PY'
          from pathlib import Path

          release_path = Path('.github/workflows/release.yml')
          release_source = release_path.read_text()
          current_trigger = "Publish Flight Commander 3.0.3 release"
          prior_trigger = "Publish Flight Commander 3.0.2 release"
          if release_source.count(current_trigger) != 2:
              raise SystemExit('Unexpected pre-authorized release trigger contract.')
          release_path.write_text(release_source.replace(current_trigger, prior_trigger))

          path = Path('scripts/prepare-flight-commander-3.0.3.sh')
          source = path.read_text()
          needle = 'git add -A\n'
          replacement = (
              '# Workflow YAML is retained from the pre-authorized branch head.\n'
              'git checkout HEAD -- .github/workflows\n'
              'git add -A\n'
          )
          if source.count(needle) != 1:
              raise SystemExit('Unexpected finalizer staging contract.')
          path.write_text(source.replace(needle, replacement, 1))
          PY

      - name: Build exact firmware, verify retained source, and push final source
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: bash scripts/prepare-flight-commander-3.0.3.sh
