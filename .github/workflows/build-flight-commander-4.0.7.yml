name: Build Flight Commander 4.0.7 IMU hotfix

"on":
  push:
    branches:
      - agent/fix-4.0.6-imu-handedness
    paths:
      - .github/workflows/build-flight-commander-4.0.7.yml
      - release/firmware-patches/4.0.7.patch
      - release/configurator-patches/4.0.7.patch
      - scripts/build-flight-commander-4.0.7-firmware.py
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/build-flight-commander-4.0.7.yml
      - release/firmware-patches/4.0.7.patch
      - release/configurator-patches/4.0.7.patch
      - scripts/build-flight-commander-4.0.7-firmware.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-flight-commander-4.0.7-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-retain:
    name: Build, verify and retain 4.0.7
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out the exact hotfix branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
          persist-credentials: true

      - name: Apply the reviewed Configurator and release patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object release/configurator-patches/4.0.7.patch)" = \
            "2bf3759a63cc3d5e41da01cb2cb27bc768fde3df"
          git -c core.whitespace=cr-at-eol apply --whitespace=error-all \
            --exclude=tests/flight-commander/firmware/flight-commander-catalog.test.mjs \
            --exclude=tests/flight-commander/packaging/package-contract.test.mjs \
            release/configurator-patches/4.0.7.patch
          python3 - <<'PY'
          from pathlib import Path

          def replace(path_name, old, new, expected=1):
              path = Path(path_name)
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != expected:
                  raise SystemExit(
                      f'{path}: expected {expected} occurrences of {old!r}; found {count}'
                  )
              path.write_text(text.replace(old, new), encoding='utf-8')

          catalog = 'tests/flight-commander/firmware/flight-commander-catalog.test.mjs'
          replace(
              catalog,
              'assert.equal(FLIGHT_COMMANDER_MINIMUM_SUPPORTED_FIRMWARE_VERSION, "4.0.6");',
              'assert.equal(FLIGHT_COMMANDER_MINIMUM_SUPPORTED_FIRMWARE_VERSION, "4.0.7");',
          )
          replace(
              catalog,
              '    assert.equal(isSupportedFlightCommanderFirmwareVersion("4.0.6"), true);\n'
              '    assert.equal(isSupportedFlightCommanderFirmwareVersion("4.1.0"), true);',
              '    assert.equal(isSupportedFlightCommanderFirmwareVersion("4.0.6"), false);\n'
              '    assert.equal(isSupportedFlightCommanderFirmwareVersion("4.0.7"), true);\n'
              '    assert.equal(isSupportedFlightCommanderFirmwareVersion("4.1.0"), true);',
          )
          replace(
              catalog,
              '        tag_name: "v4.0.6",\n        name: "Firmware 4.0.6 beta",',
              '        tag_name: "v4.0.7",\n        name: "Firmware 4.0.7 beta",',
          )
          replace(
              catalog,
              'Flight-Commander-Firmware-4.0.6-MICOAIR743-BENCH-ONLY.hex',
              'Flight-Commander-Firmware-4.0.7-MICOAIR743-BENCH-ONLY.hex',
          )
          replace(
              catalog,
              'Flight-Commander-Firmware-4.0.6-source.zip',
              'Flight-Commander-Firmware-4.0.7-source.zip',
          )
          replace(
              catalog,
              'const filename = "Flight-Commander-Firmware-4.0.6-MICOAIR743.hex";',
              'const filename = "Flight-Commander-Firmware-4.0.7-MICOAIR743.hex";',
          )
          replace(
              catalog,
              '        tag_name: "v4.0.6",\n        assets:',
              '        tag_name: "v4.0.7",\n        assets:',
          )
          replace(
              catalog,
              '["4.0.6", "3.0.7"]',
              '["4.0.7", "3.0.7"]',
              expected=2,
          )
          replace(
              catalog,
              'test("keeps 3.0.7 and 4.0.6 while removing every verified-bad intervening release",',
              'test("keeps 3.0.7 and 4.0.7 while removing every verified-bad intervening release",',
          )
          replace(
              catalog,
              '    releaseFor("4.0.6", "a"),\n  ]);',
              '    releaseFor("4.0.6", "a"),\n'
              '    releaseFor("4.0.7", "b"),\n'
              '  ]);',
          )

          contract = 'tests/flight-commander/packaging/package-contract.test.mjs'
          replace(
              contract,
              'assert.equal(packageManifest.flightCommander.firmwareReleaseVersion, "4.0.6");',
              'assert.equal(packageManifest.flightCommander.firmwareReleaseVersion, "4.0.7");',
          )
          replace(
              contract,
              'assert.equal(packageManifest.flightCommander.firmwareSourceVersion, "4.0.6");',
              'assert.equal(packageManifest.flightCommander.firmwareSourceVersion, "4.0.7");',
          )
          replace(
              contract,
              '"release/firmware/Flight-Commander-Firmware-Source-v4.0.6.zip",',
              '"release/firmware/Flight-Commander-Firmware-Source-v4.0.7.zip",',
          )
          replace(
              contract,
              'FLIGHT_COMMANDER_MINIMUM_SUPPORTED_FIRMWARE_VERSION = "4\\.0\\.6"',
              'FLIGHT_COMMANDER_MINIMUM_SUPPORTED_FIRMWARE_VERSION = "4\\.0\\.7"',
          )
          replace(
              contract,
              'assert.equal(packageManifest.version, "4.0.6");',
              'assert.equal(packageManifest.version, "4.0.7");',
          )
          PY

      - name: Install firmware build prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends cmake ninja-build xz-utils

      - name: Install exact Arm GNU Toolchain 13.2.1
        shell: bash
        run: |
          set -euo pipefail
          release=arm-gnu-toolchain-13.2.Rel1-x86_64-arm-none-eabi
          archive=arm-gnu-toolchain-13.2.rel1-x86_64-arm-none-eabi.tar.xz
          expected=6cd1bbc1d9ae57312bcd169ae283153a9572bd6a8e4eeae2fedfbc33b115fdbb
          url="https://developer.arm.com/-/media/Files/downloads/gnu/13.2.rel1/binrel/$archive"
          mkdir -p "$RUNNER_TEMP/toolchain"
          curl --fail --location --retry 3 --retry-all-errors \
            --output "$RUNNER_TEMP/toolchain/$archive" "$url"
          printf '%s  %s\n' "$expected" "$RUNNER_TEMP/toolchain/$archive" \
            | sha256sum --check --strict
          tar -xJf "$RUNNER_TEMP/toolchain/$archive" -C "$RUNNER_TEMP/toolchain"
          echo "$RUNNER_TEMP/toolchain/$release/bin" >> "$GITHUB_PATH"

      - name: Build and retain the reviewed firmware and source archive
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/build-flight-commander-4.0.7-firmware.py \
            --workspace "$GITHUB_WORKSPACE" \
            --work "$RUNNER_TEMP/flight-commander-4.0.7" \
            --update-repository

      - name: Verify reproducibility and regression contracts
        shell: bash
        run: |
          set -euo pipefail
          arm-none-eabi-gcc --version | head -1
          bash scripts/rebuild-firmware-source-archive.sh
          node scripts/check-flight-commander-version.mjs
          node --test \
            tests/flight-commander/firmware/imu-handedness-regression.test.mjs \
            tests/flight-commander/firmware/flight-commander-catalog.test.mjs \
            tests/flight-commander/firmware/onboard-ist8310-transform.test.mjs
          git -c core.whitespace=cr-at-eol diff --check

      - name: Commit the verified generated release inputs once
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/build-flight-commander-4.0.7.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git -c core.whitespace=cr-at-eol diff --cached --check
          git commit -m "Flight Commander 4.0.7: restore IMU handedness"
          target_branch="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          git push origin "HEAD:${target_branch}"
