name: Publish verified Flight Commander 4.0.6 beta
run-name: Publish verified Flight Commander 4.0.6 beta

"on":
  push:
    branches:
      - main
    paths:
      - .github/workflows/finalize-flight-commander-4.0.6-release-v2.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: publish-flight-commander-4.0.6
  cancel-in-progress: true

env:
  FC_TAG: v4.0.6-beta
  FC_RELEASE_SOURCE_RUN: 31133260246
  FC_RELEASE_ARTIFACT: fc406-release-31133260246

jobs:
  finalize:
    name: Integrate, publish, and verify 4.0.6 beta
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Record the publication run
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment 21 --repo "$GITHUB_REPOSITORY" --body \
            "Final Flight Commander 4.0.6 publication run **${GITHUB_RUN_ID}** started: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Check out current main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Download the already verified coordinated release
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ env.FC_RELEASE_ARTIFACT }}
          path: release-candidate/Flight-Commander-v4.0.6
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.FC_RELEASE_SOURCE_RUN }}

      - name: Verify the release artifact and integrate tested source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import shutil
          import stat
          import subprocess
          import zipfile
          from pathlib import Path, PurePosixPath

          workspace = Path(os.environ['GITHUB_WORKSPACE']).resolve()
          git_root = Path(subprocess.check_output(
              ['git', 'rev-parse', '--show-toplevel'],
              cwd=workspace,
              text=True,
          ).strip()).resolve()
          if workspace != git_root:
              raise SystemExit(f'Workspace mismatch: {workspace} != {git_root}')

          release_root = workspace / 'release-candidate/Flight-Commander-v4.0.6'
          sums = {}
          for raw in (release_root / 'SHA256SUMS.txt').read_text(encoding='utf-8').splitlines():
              if raw.strip():
                  digest, name = raw.split('  ', 1)
                  sums[name] = digest.lower()

          canonical = [
              'FC-Windows-v4.0.6.zip',
              'FC-Configurator-Source-v4.0.6.zip',
              'FC-Firmware-v4.0.6-MICOAIR743.hex',
              'FC-Firmware-Source-v4.0.6.zip',
          ]
          complete_name = 'Flight-Commander-v4.0.6.zip'
          expected_names = set(canonical + [complete_name])
          if set(sums) != expected_names:
              raise SystemExit(
                  f'SHA256SUMS contract mismatch: expected={sorted(expected_names)}; actual={sorted(sums)}'
              )

          for name, expected in sums.items():
              path = release_root / name
              if not path.is_file() or path.stat().st_size == 0:
                  raise SystemExit(f'Missing or empty release file: {name}')
              actual = hashlib.sha256(path.read_bytes()).hexdigest()
              if actual != expected:
                  raise SystemExit(f'Release checksum mismatch for {name}: {actual}')

          with zipfile.ZipFile(release_root / complete_name) as archive:
              names = sorted(info.filename for info in archive.infolist() if not info.is_dir())
              if names != sorted(canonical):
                  raise SystemExit(f'Complete bundle mismatch: {names}')
              for name in canonical:
                  if archive.read(name) != (release_root / name).read_bytes():
                      raise SystemExit(f'Complete bundle byte mismatch: {name}')

          source_zip = release_root / 'FC-Configurator-Source-v4.0.6.zip'
          extract_root = Path(os.environ['RUNNER_TEMP']).resolve() / 'fc406-tested-source'
          if extract_root.exists():
              shutil.rmtree(extract_root)
          extract_root.mkdir(parents=True)

          with zipfile.ZipFile(source_zip) as archive:
              seen = set()
              for info in archive.infolist():
                  if info.filename in seen:
                      raise SystemExit(f'Duplicate source entry: {info.filename}')
                  seen.add(info.filename)
                  relative = PurePosixPath(info.filename)
                  if relative.is_absolute() or '..' in relative.parts:
                      raise SystemExit(f'Unsafe source path: {info.filename}')
                  if stat.S_ISLNK(info.external_attr >> 16):
                      raise SystemExit(f'Symlink is not allowed in source archive: {info.filename}')
                  candidate = (extract_root / info.filename).resolve()
                  if candidate != extract_root and extract_root not in candidate.parents:
                      raise SystemExit(f'Source path escaped extraction root: {info.filename}')
              archive.extractall(extract_root)

          roots = []
          for candidate in [extract_root, *extract_root.rglob('*')]:
              if candidate.is_dir() and (
                  (candidate / 'package.json').is_file()
                  and (candidate / 'manifest.json').is_file()
                  and (candidate / 'release/configurator-patches/4.0.6.patch').is_file()
              ):
                  roots.append(candidate.resolve())
          roots = sorted(set(roots))
          if len(roots) != 1:
              raise SystemExit(f'Expected one tested source root; found {[str(path) for path in roots]}')
          source_root = roots[0]

          package_bytes = (source_root / 'package.json').read_bytes()
          manifest_bytes = (source_root / 'manifest.json').read_bytes()
          package = json.loads(package_bytes.decode('utf-8'))
          manifest = json.loads(manifest_bytes.decode('utf-8'))
          if package.get('version') != '4.0.6' or manifest.get('version') != '4.0.6':
              raise SystemExit(
                  f'Tested source version mismatch: package={package.get("version")!r}; '
                  f'manifest={manifest.get("version")!r}'
              )

          metadata = package.get('flightCommander', {})
          required_metadata = {
              'firmwareReleaseVersion': '4.0.6',
              'firmwareSourceVersion': '4.0.6',
              'firmwareReleaseSha256': sums['FC-Firmware-v4.0.6-MICOAIR743.hex'],
              'firmwareSourceSha256': sums['FC-Firmware-Source-v4.0.6.zip'],
          }
          for key, expected in required_metadata.items():
              if metadata.get(key) != expected:
                  raise SystemExit(
                      f'Tested package metadata mismatch for {key}: '
                      f'expected={expected!r}; actual={metadata.get(key)!r}'
                  )

          expected_patch_paths = {
              'CHANGELOG.md',
              'js/fc.js',
              'js/flightCommander/compassOrientation.js',
              'js/flightCommander/firmwareCatalog.js',
              'js/flightCommander/firmwareIdentity.js',
              'js/main/ntripClient.js',
              'js/msp/MSPCodes.js',
              'js/msp/MSPHelper.js',
              'manifest.json',
              'package.json',
              'release/notes/v4.0.6-beta.md',
              'src/css/tabs/calibration.css',
              'tabs/calibration.html',
              'tabs/calibration.js',
              'tabs/firmware_info.html',
              'tabs/landing.html',
              'tests/flight-commander/firmware/compass-orientation.test.mjs',
              'tests/flight-commander/firmware/flight-commander-catalog.test.mjs',
              'tests/flight-commander/firmware/flight-commander-identity.test.mjs',
              'tests/flight-commander/firmware/onboard-ist8310-transform.test.mjs',
              'tests/flight-commander/packaging/package-contract.test.mjs',
          }
          patch = source_root / 'release/configurator-patches/4.0.6.patch'
          numstat = subprocess.check_output(
              ['git', 'apply', '--numstat', str(patch)],
              cwd=workspace,
              text=True,
          )
          actual_patch_paths = {
              line.split('\t', 2)[2]
              for line in numstat.splitlines()
              if line.strip()
          }
          if actual_patch_paths != expected_patch_paths:
              raise SystemExit(
                  f'4.0.6 patch path contract changed: '
                  f'missing={sorted(expected_patch_paths - actual_patch_paths)}; '
                  f'extra={sorted(actual_patch_paths - expected_patch_paths)}'
              )

          support_paths = {
              'release/configurator-patches/4.0.6.patch',
              'release/firmware-patches/4.0.6.patch',
              'scripts/build-flight-commander-4.0.6.py',
              'scripts/prepare-flight-commander-firmware-4.0.6.py',
          }
          deferred = {'package.json', 'manifest.json'}
          ordinary = sorted((expected_patch_paths | support_paths) - deferred)

          for relative_text in ordinary:
              relative = PurePosixPath(relative_text)
              source = source_root.joinpath(*relative.parts)
              target = workspace.joinpath(*relative.parts)
              if not source.is_file():
                  raise SystemExit(f'Missing tested source file: {relative_text}')
              target.parent.mkdir(parents=True, exist_ok=True)
              if target.is_symlink():
                  target.unlink()
              shutil.copyfile(source, target)
              target.chmod(0o755 if target.suffix in {'.py', '.sh'} else 0o644)
              if target.read_bytes() != source.read_bytes():
                  raise SystemExit(f'Integrated source byte mismatch: {relative_text}')

          for relative_text, payload in (
              ('package.json', package_bytes),
              ('manifest.json', manifest_bytes),
          ):
              target = workspace / relative_text
              if target.is_symlink():
                  target.unlink()
              target.write_bytes(payload)
              target.chmod(0o644)
              if target.read_bytes() != payload:
                  raise SystemExit(f'Integrated version file byte mismatch: {relative_text}')

          retained = {
              'release/firmware/Flight-Commander-Firmware-4.0.6-MICOAIR743.hex':
                  'FC-Firmware-v4.0.6-MICOAIR743.hex',
              'release/firmware/Flight-Commander-Firmware-Source-v4.0.6.zip':
                  'FC-Firmware-Source-v4.0.6.zip',
          }
          shutil.rmtree(workspace / 'release/firmware', ignore_errors=True)
          for relative_text, canonical_name in retained.items():
              source = release_root / canonical_name
              target = workspace / relative_text
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(source, target)
              target.chmod(0o644)
              if target.read_bytes() != source.read_bytes():
                  raise SystemExit(f'Retained firmware byte mismatch: {relative_text}')

          ci = workspace / '.github/workflows/ci.yml'
          if ci.is_file():
              lines = ci.read_text(encoding='utf-8').splitlines(keepends=True)
              ci.write_text(
                  ''.join(
                      line for line in lines
                      if not (
                          line.lstrip().startswith('if:')
                          and 'Start Flight Commander 4.0.6 release' in line
                      )
                  ),
                  encoding='utf-8',
              )

          marker = {
              'version': '4.0.6',
              'tag': 'v4.0.6-beta',
              'status': 'source-integrated',
              'workflow_run_id': int(os.environ['GITHUB_RUN_ID']),
              'workflow_run_attempt': int(os.environ['GITHUB_RUN_ATTEMPT']),
              'verified_firmware_run_id': 31131510835,
              'verified_release_run_id': 31133260246,
              'verified_release_artifact': 'fc406-release-31133260246',
              'source_zip_sha256': sums['FC-Configurator-Source-v4.0.6.zip'],
              'bundle_sha256': sums[complete_name],
              'component_sha256': {name: sums[name] for name in canonical},
          }
          marker_path = workspace / 'release/published/v4.0.6-beta-build.json'
          marker_path.parent.mkdir(parents=True, exist_ok=True)
          marker_path.write_text(json.dumps(marker, indent=2) + '\n', encoding='utf-8')

          integrated_package = json.loads((workspace / 'package.json').read_text(encoding='utf-8'))
          integrated_manifest = json.loads((workspace / 'manifest.json').read_text(encoding='utf-8'))
          if integrated_package.get('version') != '4.0.6' or integrated_manifest.get('version') != '4.0.6':
              raise SystemExit('Integrated source is not version 4.0.6')

          print(json.dumps({
              'source_root': str(source_root),
              'source_zip_sha256': sums['FC-Configurator-Source-v4.0.6.zip'],
              'bundle_sha256': sums[complete_name],
              'integrated_paths': len(ordinary) + len(deferred) + len(retained),
          }, indent=2))
          PY

      - name: Commit canonical 4.0.6 source and remove one-time machinery
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .flight-commander/4.0.6-build-inputs.part-* \
            .flight-commander/publish-4.0.6.trigger \
            .github/workflows/build-flight-commander-4.0.6.yml \
            .github/workflows/finalize-flight-commander-4.0.6.yml \
            .github/workflows/publish-flight-commander-4.0.6.yml \
            .github/workflows/resume-flight-commander-4.0.6.yml \
            .github/workflows/finalize-flight-commander-4.0.6-release.yml \
            .github/workflows/finalize-flight-commander-4.0.6-release-v2.yml \
            .github/workflows/manual-release-command.yml \
            .github/workflows/bootstrap-flight-commander-4.0.6.yml \
            .github/workflows/bootstrap-flight-commander-4.0.6-finalizer-v2.yml \
            .github/workflows/bootstrap-flight-commander-4.0.6-final.yml \
            .github/workflows/repair-and-dispatch-flight-commander-4.0.6-finalizer.yml \
            .github/workflows/repair-and-run-flight-commander-4.0.6-finalizer.yml
          printf '%s\n' 'release-candidate/' >> .git/info/exclude
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Flight Commander 4.0.6: learned compass orientation [skip ci]'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
          source_sha="$(git rev-parse HEAD)"
          echo "SOURCE_SHA=$source_sha" >> "$GITHUB_ENV"
          echo "Canonical 4.0.6 source commit: $source_sha"

      - name: Create the 4.0.6 beta prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          root='release-candidate/Flight-Commander-v4.0.6'
          assets=(
            "$root/FC-Windows-v4.0.6.zip"
            "$root/FC-Configurator-Source-v4.0.6.zip"
            "$root/FC-Firmware-v4.0.6-MICOAIR743.hex"
            "$root/FC-Firmware-Source-v4.0.6.zip"
            "$root/Flight-Commander-v4.0.6.zip"
            "$root/SHA256SUMS.txt"
          )
          if gh release view "$FC_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete "$FC_TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
          fi
          gh release create "$FC_TAG" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SOURCE_SHA" \
            --title 'Flight Commander 4.0.6 Beta' \
            --notes-file release/notes/v4.0.6-beta.md \
            --prerelease
          release_url="$(gh release view "$FC_TAG" --repo "$GITHUB_REPOSITORY" --json url --jq '.url')"
          echo "RELEASE_URL=$release_url" >> "$GITHUB_ENV"
          echo "Published prerelease: $release_url"

      - name: Re-download and byte-verify every published asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          local_root='release-candidate/Flight-Commander-v4.0.6'
          published="$RUNNER_TEMP/published-fc406"
          rm -rf "$published"
          mkdir -p "$published"
          gh release download "$FC_TAG" --repo "$GITHUB_REPOSITORY" --dir "$published"
          expected=(
            FC-Windows-v4.0.6.zip
            FC-Configurator-Source-v4.0.6.zip
            FC-Firmware-v4.0.6-MICOAIR743.hex
            FC-Firmware-Source-v4.0.6.zip
            Flight-Commander-v4.0.6.zip
            SHA256SUMS.txt
          )
          mapfile -t actual < <(find "$published" -maxdepth 1 -type f -printf '%f\n' | sort)
          mapfile -t wanted < <(printf '%s\n' "${expected[@]}" | sort)
          [[ "${actual[*]}" == "${wanted[*]}" ]]
          for name in "${expected[@]}"; do
            cmp "$local_root/$name" "$published/$name"
          done
          (
            cd "$published"
            sha256sum --check --strict SHA256SUMS.txt
          )
          release_json="$(gh release view "$FC_TAG" --repo "$GITHUB_REPOSITORY" \
            --json url,tagName,isPrerelease,publishedAt,assets)"
          test "$(jq -r '.tagName' <<< "$release_json")" = "$FC_TAG"
          test "$(jq -r '.isPrerelease' <<< "$release_json")" = 'true'
          test "$(jq '.assets | length' <<< "$release_json")" = '6'
          printf '%s\n' "$release_json"

      - name: Mark the release published and retarget the tag to final main
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          path = Path('release/published/v4.0.6-beta-build.json')
          marker = json.loads(path.read_text(encoding='utf-8'))
          marker.update({
              'status': 'published',
              'source_commit': os.environ['SOURCE_SHA'],
              'release_url': os.environ['RELEASE_URL'],
              'published_at_utc': datetime.now(timezone.utc).isoformat(),
          })
          path.write_text(json.dumps(marker, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(marker, indent=2))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add release/published/v4.0.6-beta-build.json
          git commit -m 'ci: record verified Flight Commander 4.0.6 publication [skip ci]'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
          final_sha="$(git rev-parse HEAD)"
          git tag -f "$FC_TAG" "$final_sha"
          git push origin "refs/tags/$FC_TAG" --force
          test "$(git ls-remote origin "refs/tags/$FC_TAG" | cut -f1)" = "$final_sha"
          echo "FINAL_SHA=$final_sha" >> "$GITHUB_ENV"
          echo "Final main/tag commit: $final_sha"

      - name: Verify final main, tag, versions, marker, prerelease, and bundle
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin main --tags --force
          test "$(git rev-parse origin/main)" = "$FINAL_SHA"
          test "$(git rev-parse "$FC_TAG^{commit}")" = "$FINAL_SHA"
          package="$(git show origin/main:package.json)"
          manifest="$(git show origin/main:manifest.json)"
          marker="$(git show origin/main:release/published/v4.0.6-beta-build.json)"
          test "$(jq -r '.version' <<< "$package")" = '4.0.6'
          test "$(jq -r '.version' <<< "$manifest")" = '4.0.6'
          test "$(jq -r '.version' <<< "$marker")" = '4.0.6'
          test "$(jq -r '.tag' <<< "$marker")" = "$FC_TAG"
          test "$(jq -r '.status' <<< "$marker")" = 'published'
          test "$(jq -r '.release_url' <<< "$marker")" = "$RELEASE_URL"
          final_check="$RUNNER_TEMP/final-fc406-check"
          rm -rf "$final_check"
          mkdir -p "$final_check"
          gh release download "$FC_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern 'Flight-Commander-v4.0.6.zip' \
            --dir "$final_check"
          cmp \
            'release-candidate/Flight-Commander-v4.0.6/Flight-Commander-v4.0.6.zip' \
            "$final_check/Flight-Commander-v4.0.6.zip"
          release_json="$(gh release view "$FC_TAG" --repo "$GITHUB_REPOSITORY" \
            --json url,tagName,isPrerelease,publishedAt,assets)"
          test "$(jq -r '.tagName' <<< "$release_json")" = "$FC_TAG"
          test "$(jq -r '.isPrerelease' <<< "$release_json")" = 'true'
          test "$(jq '.assets | length' <<< "$release_json")" = '6'
          printf '%s\n' "$release_json"

      - name: Report successful publication
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment 21 --repo "$GITHUB_REPOSITORY" --body \
            "Flight Commander **4.0.6 beta is published and fully verified**. Final main/tag commit: \`${FINAL_SHA}\`. Release: ${RELEASE_URL}. Firmware run: 31131510835; Configurator/package run: 31133260246; publication run: ${GITHUB_RUN_ID}."

      - name: Report publication failure
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment 21 --repo "$GITHUB_REPOSITORY" --body \
            "Final Flight Commander 4.0.6 publication run **${GITHUB_RUN_ID}** failed before full verification: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
