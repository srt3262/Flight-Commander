name: Repair Flight Commander 4.0.5 source epoch
run-name: Repair and verify Flight Commander 4.0.5 firmware-source epoch

"on":
  push:
    branches:
      - agent/complete-4.0.5-known-good-catalog
    paths:
      - .github/workflows/repair-flight-commander-4.0.5-source-epoch.yml

permissions:
  contents: write

concurrency:
  group: repair-flight-commander-4.0.5-source-epoch
  cancel-in-progress: false

jobs:
  repair:
    name: Normalize source epoch, rebuild firmware, and commit corrected archive
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out the exact correction branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: agent/complete-4.0.5-known-good-catalog
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Repair the deterministic firmware-source archive and metadata
        id: repair
        shell: bash
        run: |
          set -euo pipefail
          archive="release/firmware/Flight-Commander-Firmware-Source-v4.0.5.zip"
          work="$RUNNER_TEMP/flight-commander-4.0.5-source-epoch"
          root="$work/Flight-Commander-Firmware-Source-v4.0.5"
          repaired="$RUNNER_TEMP/Flight-Commander-Firmware-Source-v4.0.5.zip"
          epoch=1786010400

          rm -rf "$work" "$repaired"
          mkdir -p "$work"
          unzip -q "$archive" -d "$work"
          test -d "$root"

          python3 - "$root/RELEASE-MANIFEST.json" "$epoch" <<'PY'
          import json
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          epoch = int(sys.argv[2])
          manifest = json.loads(path.read_text(encoding="utf-8"))
          assert manifest["version"] == "4.0.5"
          manifest["source_date_epoch"] = epoch
          path.write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8")
          PY

          python3 - "$root" "$repaired" "$epoch" <<'PY'
          from __future__ import annotations

          import stat
          import sys
          import time
          import zipfile
          from pathlib import Path

          root = Path(sys.argv[1]).resolve()
          destination = Path(sys.argv[2]).resolve()
          epoch = int(sys.argv[3])
          stamp = time.gmtime(epoch)[:6]
          with zipfile.ZipFile(destination, "w", zipfile.ZIP_DEFLATED, compresslevel=9) as archive:
              for path in sorted(root.rglob("*")):
                  if not path.is_file() or "__pycache__" in path.parts or path.suffix == ".pyc":
                      continue
                  relative = Path(root.name) / path.relative_to(root)
                  info = zipfile.ZipInfo(relative.as_posix(), stamp)
                  info.create_system = 3
                  mode = 0o755 if path.suffix in {".sh", ".py"} else 0o644
                  info.external_attr = (stat.S_IFREG | mode) << 16
                  info.compress_type = zipfile.ZIP_DEFLATED
                  archive.writestr(
                      info,
                      path.read_bytes(),
                      compress_type=zipfile.ZIP_DEFLATED,
                      compresslevel=9,
                  )
          PY

          unzip -tq "$repaired"
          mv "$repaired" "$archive"
          source_sha="$(sha256sum "$archive" | cut -d' ' -f1)"

          python3 - package.json "$source_sha" <<'PY'
          import json
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          source_sha = sys.argv[2]
          package = json.loads(path.read_text(encoding="utf-8"))
          package["flightCommander"]["firmwareSourceSha256"] = source_sha
          path.write_text(json.dumps(package, indent=2) + "\n", encoding="utf-8")
          PY

          python3 - CHANGELOG.md <<'PY'
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          text = path.read_text(encoding="utf-8")
          old = "- Retire firmware older than 4.0.5 from the online flasher selection list.\n"
          new = (
              "- Keep the physically verified 3.0.7 recovery baseline selectable alongside "
              "4.0.5 and later, while removing failed 3.0.6-and-earlier, 3.0.8, and "
              "4.0.0-through-4.0.4 firmware from the managed flasher.\n"
          )
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit("Expected 4.0.5 flasher changelog entry was not found")
          path.write_text(text, encoding="utf-8")
          PY

          echo "source_sha256=$source_sha" >> "$GITHUB_OUTPUT"
          echo "Repaired source SHA-256: $source_sha"

      - name: Rebuild and compare the published firmware byte-for-byte
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/rebuild-firmware-source-archive.sh

      - name: Run release metadata and catalog tests
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare yarn@1.22.22 --activate
          yarn install --frozen-lockfile --non-interactive
          node --test \
            tests/flight-commander/firmware/flight-commander-catalog.test.mjs \
            tests/flight-commander/packaging/package-contract.test.mjs \
            tests/flight-commander/packaging/version-contract.test.mjs
          node scripts/check-flight-commander-version.mjs

      - name: Commit the verified source-epoch repair
        shell: bash
        env:
          SOURCE_SHA256: ${{ steps.repair.outputs.source_sha256 }}
          TARGET_BRANCH: agent/complete-4.0.5-known-good-catalog
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            CHANGELOG.md \
            package.json \
            release/firmware/Flight-Commander-Firmware-Source-v4.0.5.zip
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Expected source-epoch repair changes, but the staged tree is empty." >&2
            exit 1
          fi
          git commit \
            -m "Flight Commander 4.0.5: normalize firmware source epoch" \
            -m "Firmware source SHA-256: $SOURCE_SHA256"
          git push origin "HEAD:$TARGET_BRANCH"
