name: Clean duplicate Flight Commander workflow artifacts
# Triggered through a dedicated main-branch merge before the 4.0.6 finalizer.

"on":
  push:
    branches:
      - main
    paths:
      - .github/workflows/cleanup-flight-commander-artifacts.yml
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: clean-flight-commander-artifact-storage
  cancel-in-progress: true

jobs:
  cleanup:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - name: Remove downloaded duplicate 4.0.5 workflow artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for artifact_id in \
            8966074845 \
            8965978980 \
            8965846690
          do
            gh api --method DELETE "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}" || true
          done
          gh api --paginate "/repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | [.id, .name, .size_in_bytes, .expired] | @tsv' || true
