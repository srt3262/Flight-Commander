name: Inspect compass persistence and local flasher paths

"on":
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact branch revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Extract retained Flight Commander 4.0.1 firmware source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf work/inspect-firmware
          mkdir -p work/inspect-firmware
          unzip -q release/firmware/Flight-Commander-Firmware-Source-v4.0.1.zip -d work/inspect-firmware
          root="$(find work/inspect-firmware -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          test -n "$root"
          printf '%s\n' "$root" > work/firmware-root.txt

      - name: Print exact target and compass patch anchors
        shell: bash
        run: |
          set -euo pipefail
          root="$(cat work/firmware-root.txt)"
          echo '===== TARGET HEADER ====='
          nl -ba "$root/src/main/target/MICOAIR743/target.h" | sed -n '1,240p'
          echo '===== TARGET CONFIG ====='
          nl -ba "$root/src/main/target/MICOAIR743/config.c" | sed -n '1,300p'
          echo '===== COMPASS HEADER ====='
          nl -ba "$root/src/main/sensors/compass.h" | sed -n '1,280p'
          echo '===== COMPASS SOURCE RESET/VALIDATION ====='
          nl -ba "$root/src/main/sensors/compass.c" | sed -n '80,250p'
          echo '===== COMPASS SOURCE INIT ====='
          nl -ba "$root/src/main/sensors/compass.c" | sed -n '250,430p'
          echo '===== COMPASS SOURCE CALIBRATION COMPLETION ====='
          nl -ba "$root/src/main/sensors/compass.c" | sed -n '430,650p'
          echo '===== GENERIC ALIGNMENT FIXUP ====='
          nl -ba "$root/src/main/fc/config.c" | sed -n '210,330p'

      - name: Print firmware baseline and verifier extension contracts
        shell: bash
        run: |
          set -euo pipefail
          root="$(cat work/firmware-root.txt)"
          python3 - "$root/flight-commander/INAV-9.1.0-BASELINE.json" <<'PY'
          import json, sys
          path = sys.argv[1]
          data = json.load(open(path, encoding='utf-8'))
          print('===== BASELINE TOP-LEVEL KEYS =====')
          print(sorted(data))
          print('===== RELEVANT INTENTIONAL EXTENSIONS =====')
          for key, value in data.get('intentional_extensions', {}).items():
              if key in {
                  'src/main/drivers/compass/compass_ist8310.c',
                  'src/main/sensors/compass.c',
                  'src/main/sensors/compass.h',
                  'src/main/target/MICOAIR743/config.c',
                  'src/main/target/MICOAIR743/target.h',
              }:
                  print(key)
                  print(json.dumps(value, indent=2, sort_keys=True))
          PY
          echo '===== VERIFY RELEASE REFERENCES ====='
          grep -n -E 'intentional_extensions|patched_sha256|compass_ist8310|sensors/compass|MICOAIR743/config|MICOAIR743/target' \
            "$root/flight-commander/verify-release.py" | head -n 500 || true
          echo '===== VERSION/BUILD REFERENCES ====='
          grep -R -n -E '4\.0\.1|VERSION_PATCH|Firmware-4\.0\.1' \
            "$root/CMakeLists.txt" "$root/src/main/build/flight_commander.h" "$root/flight-commander" \
            --include='*.py' --include='*.sh' --include='*.h' --include='CMakeLists.txt' | head -n 500 || true

      - name: Print embedded local-firmware identity strings
        shell: bash
        run: |
          set -euo pipefail
          python3 - release/firmware/Flight-Commander-Firmware-4.0.1-MICOAIR743.hex <<'PY'
          import re, sys
          memory = {}
          upper = 0
          for raw in open(sys.argv[1], encoding='ascii'):
              raw = raw.strip()
              if not raw or not raw.startswith(':'):
                  continue
              rec = bytes.fromhex(raw[1:])
              length = rec[0]
              address = (rec[1] << 8) | rec[2]
              kind = rec[3]
              payload = rec[4:4 + length]
              if kind == 0:
                  base = upper + address
                  for index, value in enumerate(payload):
                      memory[base + index] = value
              elif kind == 4:
                  upper = int.from_bytes(payload, 'big') << 16
              elif kind == 2:
                  upper = int.from_bytes(payload, 'big') << 4
          addresses = sorted(memory)
          regions = []
          if addresses:
              start = previous = addresses[0]
              data = bytearray([memory[start]])
              for address in addresses[1:]:
                  if address != previous + 1:
                      regions.append((start, bytes(data)))
                      start = address
                      data = bytearray()
                  data.append(memory[address])
                  previous = address
              regions.append((start, bytes(data)))
          print('===== MATCHING PRINTABLE STRINGS =====')
          for start, data in regions:
              for match in re.finditer(rb'[\x20-\x7e]{4,}', data):
                  text = match.group().decode('ascii', errors='replace')
                  if any(token.lower() in text.lower() for token in ('mico', 'micro', 'flight commander', 'fcfw', 'inav')):
                      print(f'0x{start + match.start():08x}: {text}')
          PY

      - name: Print Configurator local firmware acceptance code
        shell: bash
        run: |
          set -euo pipefail
          echo '===== tabs/firmware_flasher.js acceptance section ====='
          nl -ba tabs/firmware_flasher.js | sed -n '430,820p'
          echo '===== js/flightCommander/firmwareCatalog.js ====='
          nl -ba js/flightCommander/firmwareCatalog.js | sed -n '1,340p'
