name: Inspect compass persistence and local flasher paths

"on":
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact branch revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Extract retained Flight Commander 4.0.1 firmware source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf work/inspect-firmware
          mkdir -p work/inspect-firmware
          unzip -q release/firmware/Flight-Commander-Firmware-Source-v4.0.1.zip -d work/inspect-firmware
          root="$(find work/inspect-firmware -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          test -n "$root"
          printf '%s\n' "$root" > work/firmware-root.txt

      - name: Print IST8310 driver and target contract
        shell: bash
        run: |
          set -euo pipefail
          root="$(cat work/firmware-root.txt)"
          echo '===== src/main/drivers/compass/compass_ist8310.c ====='
          sed -n '1,360p' "$root/src/main/drivers/compass/compass_ist8310.c"
          echo '===== src/main/target/MICOAIR743/target.h ====='
          sed -n '1,300p' "$root/src/main/target/MICOAIR743/target.h"
          echo '===== src/main/target/MICOAIR743/config.c ====='
          sed -n '1,320p' "$root/src/main/target/MICOAIR743/config.c"

      - name: Print compass calibration and persistent configuration paths
        shell: bash
        run: |
          set -euo pipefail
          root="$(cat work/firmware-root.txt)"
          echo '===== src/main/sensors/compass.c ====='
          sed -n '1,660p' "$root/src/main/sensors/compass.c"
          echo '===== src/main/sensors/compass.h ====='
          sed -n '1,340p' "$root/src/main/sensors/compass.h"
          echo '===== compass settings section ====='
          sed -n '530,640p' "$root/src/main/fc/settings.yaml"
          echo '===== compass default macro definitions ====='
          grep -R -n -E 'SETTING_ALIGN_MAG_DEFAULT|SETTING_MAGGAIN_[XYZ]_DEFAULT|FLIGHT_COMMANDER_MAG_DEFAULT_ALIGN' \
            "$root" --include='*.c' --include='*.h' --include='*.yaml' --include='*.yml' \
            | head -n 400 || true

      - name: Print generic config fixups and load order
        shell: bash
        run: |
          set -euo pipefail
          root="$(cat work/firmware-root.txt)"
          echo '===== src/main/fc/config.c ====='
          sed -n '180,360p' "$root/src/main/fc/config.c"
          echo '===== src/main/fc/fc_init.c configuration load sequence ====='
          sed -n '180,330p' "$root/src/main/fc/fc_init.c"
          echo '===== config-fixup callers ====='
          grep -R -n -E 'validateAndFixConfig|validateAndFix.*Config|readEEPROM|loadConfig|writeEEPROM|saveConfig' \
            "$root/src/main/fc" "$root/src/main/config" \
            --include='*.c' --include='*.h' | head -n 800 || true

      - name: Print parameter-group load and migration behavior
        shell: bash
        run: |
          set -euo pipefail
          root="$(cat work/firmware-root.txt)"
          echo '===== src/main/config/config_eeprom.c ====='
          sed -n '100,330p' "$root/src/main/config/config_eeprom.c"
          echo '===== src/main/config/parameter_group.c ====='
          sed -n '1,180p' "$root/src/main/config/parameter_group.c"
          echo '===== src/main/config/parameter_group.h ====='
          sed -n '90,250p' "$root/src/main/config/parameter_group.h"
          echo '===== PG_COMPASS_CONFIG ID ====='
          grep -n -E 'PG_COMPASS_CONFIG|PG_FLIGHT_COMMANDER' "$root/src/main/config/parameter_group_ids.h" || true

      - name: Print Flight Commander heading configuration storage
        shell: bash
        run: |
          set -euo pipefail
          root="$(cat work/firmware-root.txt)"
          echo '===== heading_fusion.h ====='
          sed -n '1,250p' "$root/src/main/flight_commander/heading_fusion.h"
          echo '===== heading_fusion.c reset and calibration sections ====='
          sed -n '1,360p' "$root/src/main/flight_commander/heading_fusion.c"
          sed -n '480,590p' "$root/src/main/flight_commander/heading_fusion.c"

      - name: Print Configurator local firmware acceptance code
        shell: bash
        run: |
          set -euo pipefail
          echo '===== tabs/firmware_flasher.js acceptance section ====='
          sed -n '430,820p' tabs/firmware_flasher.js
          echo '===== js/flightCommander/firmwareCatalog.js ====='
          sed -n '1,320p' js/flightCommander/firmwareCatalog.js
          echo '===== related tests ====='
          find tests -maxdepth 5 -type f | sort | grep -E 'firmware|flasher|catalog' || true
