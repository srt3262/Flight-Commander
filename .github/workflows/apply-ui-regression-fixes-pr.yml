name: Build Flight Commander 4.0.8 UI-fix downloads

"on":
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - .github/workflows/apply-ui-regression-fixes-pr.yml

permissions:
  contents: write

jobs:
  patch-test-package:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Check out the repair branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: agent/fix-4.0.8-ui-regressions
          fetch-depth: 0

      - name: Apply the targeted source repairs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python scripts/apply-ui-regression-fixes.py

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Install pinned dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          corepack enable
          corepack prepare yarn@1.22.22 --activate
          yarn install --frozen-lockfile --non-interactive

      - name: Run the complete Configurator test suite
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          yarn test

      - name: Package and verify Windows x64
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          yarn package:windows
          yarn verify:windows

      - name: Commit the verified repair and create the two download ZIP files
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          git rm scripts/apply-ui-regression-fixes.py .github/workflows/apply-ui-regression-fixes-pr.yml
          git add tabs/configuration.js src/css/styles.css src/css/ui-regressions.css tests/flight-commander/configurator/ui-regression-fixes.test.mjs
          git config user.name 'Flight Commander Build'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'Fix compass status, failsafe illustrations, and planner labels'

          New-Item -ItemType Directory -Force -Path downloads | Out-Null
          $packageDirectories = @(Get-ChildItem -Path out -Directory | Where-Object { $_.Name -like '*-win32-x64' })
          if ($packageDirectories.Count -ne 1) {
            throw "Expected one unpacked Windows x64 package, found $($packageDirectories.Count)."
          }

          Compress-Archive -Path $packageDirectories[0].FullName -DestinationPath downloads/FC-Windows-v4.0.8-UI-Fix.zip -CompressionLevel Optimal
          git archive --format=zip --prefix=Flight-Commander-Configurator-Source-v4.0.8-UI-Fix/ --output=downloads/FC-Configurator-Source-v4.0.8-UI-Fix.zip HEAD

          $windowsHash = (Get-FileHash downloads/FC-Windows-v4.0.8-UI-Fix.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          $sourceHash = (Get-FileHash downloads/FC-Configurator-Source-v4.0.8-UI-Fix.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          @(
            "$windowsHash  FC-Windows-v4.0.8-UI-Fix.zip"
            "$sourceHash  FC-Configurator-Source-v4.0.8-UI-Fix.zip"
          ) | Set-Content -Path downloads/SHA256SUMS.txt -Encoding ascii

          git push origin HEAD:agent/fix-4.0.8-ui-regressions

      - name: Upload the Configurator and source ZIP files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Flight-Commander-v4.0.8-UI-Fix-Downloads
          path: |
            downloads/FC-Windows-v4.0.8-UI-Fix.zip
            downloads/FC-Configurator-Source-v4.0.8-UI-Fix.zip
            downloads/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
