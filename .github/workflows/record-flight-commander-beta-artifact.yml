name: Record Flight Commander beta artifact
run-name: Record beta artifact for ${{ github.event.workflow_run.head_sha }}

"on":
  workflow_run:
    workflows:
      - Publish Flight Commander beta release
    types:
      - completed

permissions: {}

concurrency:
  group: record-flight-commander-beta-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  record:
    name: Record release run and artifact IDs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      statuses: write

    steps:
      - name: Record successful main-branch publication
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          set -euo pipefail

          if [[ "$HEAD_BRANCH" != "main" || "$RUN_CONCLUSION" != "success" ]]; then
            echo "No successful main-branch beta publication to record."
            exit 0
          fi

          artifacts="$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts")"
          artifact_id="$(jq -r '
            .artifacts[]
            | select(.expired == false)
            | select(.name | startswith("flight-commander-") and endswith("-beta-bundle"))
            | .id
          ' <<<"$artifacts" | head -n 1)"
          artifact_name="$(jq -r '
            .artifacts[]
            | select(.expired == false)
            | select(.name | startswith("flight-commander-") and endswith("-beta-bundle"))
            | .name
          ' <<<"$artifacts" | head -n 1)"

          if [[ -z "$artifact_id" || "$artifact_id" == "null" || -z "$artifact_name" || "$artifact_name" == "null" ]]; then
            echo "The successful beta run has no retained beta-bundle artifact." >&2
            exit 1
          fi

          description="run=${RUN_ID}; artifact=${artifact_id}"
          gh api --method POST "/repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" \
            -f state='success' \
            -f context='release/flight-commander-beta' \
            -f description="$description" \
            -f target_url="$RUN_URL" >/dev/null

          echo "Recorded $artifact_name as artifact $artifact_id from run $RUN_ID on $HEAD_SHA."
