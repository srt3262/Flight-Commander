name: Purge all GitHub Actions run history

"on":
  push:
    branches:
      - main
    paths:
      - .github/workflows/delete-all-workflow-runs-v2.yml

permissions:
  actions: write
  contents: write

concurrency:
  group: flight-commander-purge-all-actions-history-v2
  cancel-in-progress: true

jobs:
  purge:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Purge every run and remove the one-time cleanup machinery
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_RUN_ID: ${{ github.run_id }}
          MARKER_PATH: release/published/workflow-run-cleanup.json
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import base64
          import json
          import os
          import time
          import urllib.error
          import urllib.parse
          import urllib.request
          from datetime import datetime, timezone

          API = "https://api.github.com"
          REPO = os.environ["GITHUB_REPOSITORY"]
          TOKEN = os.environ["GH_TOKEN"]
          CURRENT_RUN_ID = int(os.environ["CURRENT_RUN_ID"])
          MARKER_PATH = os.environ["MARKER_PATH"]
          TEMP_BRANCH = "agent/delete-all-workflow-runs-20260807"
          WORKFLOW_PATHS = (
              ".github/workflows/delete-all-workflow-runs-main.yml",
              ".github/workflows/delete-all-workflow-runs-v2.yml",
          )

          deleted = 0
          already_absent = 0
          active_cancelled = 0

          def api_request(
              method: str,
              path: str,
              payload: dict | None = None,
              timeout: int = 30,
          ) -> tuple[int, bytes]:
              body = None if payload is None else json.dumps(payload).encode("utf-8")
              headers = {
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {TOKEN}",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "flight-commander-actions-history-purge",
              }
              if body is not None:
                  headers["Content-Type"] = "application/json"
              request = urllib.request.Request(
                  API + path,
                  data=body,
                  headers=headers,
                  method=method,
              )
              try:
                  with urllib.request.urlopen(request, timeout=timeout) as response:
                      return response.status, response.read()
              except urllib.error.HTTPError as error:
                  return error.code, error.read()
              except Exception as error:
                  return 0, str(error).encode("utf-8", errors="replace")

          def require_ok(code: int, body: bytes, expected: set[int], operation: str) -> bytes:
              if code not in expected:
                  detail = body.decode("utf-8", errors="replace")[:2000]
                  raise RuntimeError(f"{operation} failed with HTTP {code}: {detail}")
              return body

          def utc_now() -> str:
              return datetime.now(timezone.utc).isoformat()

          def put_marker(marker: dict) -> None:
              content = base64.b64encode(
                  (json.dumps(marker, indent=2, sort_keys=True) + "\n").encode("utf-8")
              ).decode("ascii")
              encoded_path = urllib.parse.quote(MARKER_PATH, safe="/")
              code, body = api_request(
                  "GET",
                  f"/repos/{REPO}/contents/{encoded_path}?ref=main",
              )
              payload = {
                  "message": "Record workflow-run purge status [skip ci]",
                  "content": content,
                  "branch": "main",
              }
              if code == 200:
                  payload["sha"] = json.loads(body)["sha"]
              elif code != 404:
                  require_ok(code, body, {200, 404}, "read purge marker")
              code, body = api_request(
                  "PUT",
                  f"/repos/{REPO}/contents/{encoded_path}",
                  payload,
              )
              require_ok(code, body, {200, 201}, "write purge marker")

          def list_runs() -> list[dict]:
              runs: list[dict] = []
              page = 1
              while True:
                  code, body = api_request(
                      "GET",
                      f"/repos/{REPO}/actions/runs?per_page=100&page={page}",
                  )
                  require_ok(code, body, {200}, "list workflow runs")
                  batch = list(json.loads(body).get("workflow_runs", []))
                  runs.extend(batch)
                  if len(batch) < 100:
                      return runs
                  page += 1

          def get_run_status(run_id: int) -> str | None:
              code, body = api_request("GET", f"/repos/{REPO}/actions/runs/{run_id}")
              if code == 404:
                  return None
              require_ok(code, body, {200}, f"read workflow run {run_id}")
              return str(json.loads(body).get("status", "unknown"))

          def finish_active_run(run_id: int) -> None:
              global active_cancelled
              status = get_run_status(run_id)
              if status is None or status == "completed":
                  return

              api_request("POST", f"/repos/{REPO}/actions/runs/{run_id}/cancel")
              active_cancelled += 1
              for attempt in range(180):
                  status = get_run_status(run_id)
                  if status is None or status == "completed":
                      return
                  if attempt == 20:
                      api_request("POST", f"/repos/{REPO}/actions/runs/{run_id}/force-cancel")
                  time.sleep(0.5)
              raise RuntimeError(f"workflow run {run_id} did not complete after cancellation")

          def delete_run(run: dict | int) -> None:
              global deleted, already_absent
              if isinstance(run, dict):
                  run_id = int(run["id"])
                  status = str(run.get("status", "unknown"))
              else:
                  run_id = int(run)
                  status = get_run_status(run_id) or "completed"

              if status != "completed":
                  finish_active_run(run_id)

              for attempt in range(30):
                  code, body = api_request(
                      "DELETE",
                      f"/repos/{REPO}/actions/runs/{run_id}",
                  )
                  if code == 204:
                      deleted += 1
                      return
                  if code == 404:
                      already_absent += 1
                      return
                  if attempt == 5:
                      api_request("POST", f"/repos/{REPO}/actions/runs/{run_id}/force-cancel")
                  time.sleep(min(0.5 + attempt * 0.25, 5.0))
              detail = body.decode("utf-8", errors="replace")[:2000]
              raise RuntimeError(f"unable to delete workflow run {run_id}: HTTP {code}: {detail}")

          def delete_branch(branch: str) -> None:
              encoded = urllib.parse.quote(branch, safe="/")
              code, body = api_request(
                  "DELETE",
                  f"/repos/{REPO}/git/refs/heads/{encoded}",
              )
              require_ok(code, body, {204, 404}, f"delete branch {branch}")

          def delete_repository_file(path: str) -> None:
              encoded = urllib.parse.quote(path, safe="/")
              code, body = api_request(
                  "GET",
                  f"/repos/{REPO}/contents/{encoded}?ref=main",
              )
              if code == 404:
                  return
              require_ok(code, body, {200}, f"read {path}")
              sha = json.loads(body)["sha"]
              code, body = api_request(
                  "DELETE",
                  f"/repos/{REPO}/contents/{encoded}",
                  {
                      "message": "Remove one-time workflow-run purge machinery [skip ci]",
                      "sha": sha,
                      "branch": "main",
                  },
              )
              require_ok(code, body, {200}, f"delete {path}")

          started = {
              "repository": REPO,
              "status": "started",
              "started_at": utc_now(),
              "current_run_id": CURRENT_RUN_ID,
          }
          put_marker(started)

          initial_runs = list_runs()
          initial_total = len(initial_runs)

          for pass_number in range(1, 31):
              candidates = [
                  run for run in list_runs()
                  if int(run["id"]) != CURRENT_RUN_ID
              ]
              if not candidates:
                  break
              for run in candidates:
                  delete_run(run)
          else:
              raise RuntimeError("workflow runs remained after 30 deletion passes")

          unexpected = [
              int(run["id"])
              for run in list_runs()
              if int(run["id"]) != CURRENT_RUN_ID
          ]
          if unexpected:
              raise RuntimeError(f"unexpected workflow runs remain: {unexpected}")

          put_marker({
              "repository": REPO,
              "status": "current_run_self_delete_pending",
              "started_at": started["started_at"],
              "updated_at": utc_now(),
              "initial_workflow_runs": initial_total,
              "deleted_before_current_run": deleted,
              "already_absent": already_absent,
              "active_runs_cancelled": active_cancelled,
              "current_run_id": CURRENT_RUN_ID,
              "remaining_before_self_delete": 1,
          })

          delete_branch(TEMP_BRANCH)
          for workflow_path in WORKFLOW_PATHS:
              delete_repository_file(workflow_path)

          os.environ.pop("RUNNER_TRACKING_ID", None)
          first_child = os.fork()
          if first_child > 0:
              print(
                  json.dumps(
                      {
                          "initial_workflow_runs": initial_total,
                          "deleted_before_current_run": deleted,
                          "current_run_id": CURRENT_RUN_ID,
                          "finalizer": "launched",
                      },
                      indent=2,
                  )
              )
              raise SystemExit(0)

          os.setsid()
          second_child = os.fork()
          if second_child > 0:
              os._exit(0)

          os.chdir("/")
          os.umask(0o077)
          null_descriptor = os.open(os.devnull, os.O_RDWR)
          for descriptor in (0, 1, 2):
              try:
                  os.dup2(null_descriptor, descriptor)
              except OSError:
                  pass
          if null_descriptor > 2:
              os.close(null_descriptor)

          time.sleep(0.10)
          api_request("POST", f"/repos/{REPO}/actions/runs/{CURRENT_RUN_ID}/cancel")

          final_deleted = False
          for attempt in range(6000):
              code, _ = api_request(
                  "DELETE",
                  f"/repos/{REPO}/actions/runs/{CURRENT_RUN_ID}",
                  timeout=10,
              )
              if code in {204, 404}:
                  final_deleted = True
                  break
              if attempt == 20:
                  api_request(
                      "POST",
                      f"/repos/{REPO}/actions/runs/{CURRENT_RUN_ID}/force-cancel",
                  )
              time.sleep(0.05)

          if not final_deleted:
              os._exit(1)

          late_deleted = 0
          stable_zero_checks = 0
          for _ in range(360):
              try:
                  remaining = list_runs()
              except Exception:
                  time.sleep(0.10)
                  continue

              if not remaining:
                  stable_zero_checks += 1
                  if stable_zero_checks >= 3:
                      break
                  time.sleep(0.20)
                  continue

              stable_zero_checks = 0
              for run in remaining:
                  try:
                      delete_run(run)
                      late_deleted += 1
                  except Exception:
                      pass
              time.sleep(0.10)
          else:
              os._exit(2)

          put_marker({
              "repository": REPO,
              "status": "verified_zero",
              "started_at": started["started_at"],
              "verified_at": utc_now(),
              "initial_workflow_runs": initial_total,
              "deleted_before_current_run": deleted,
              "deleted_current_run": 1,
              "deleted_late_arriving_runs": late_deleted,
              "already_absent": already_absent,
              "active_runs_cancelled": active_cancelled,
              "remaining_workflow_runs": 0,
              "temporary_branch_removed": TEMP_BRANCH,
              "temporary_workflow_files_removed": list(WORKFLOW_PATHS),
          })
          os._exit(0)
          PY
