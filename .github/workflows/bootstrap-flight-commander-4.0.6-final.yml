name: One-time Flight Commander 4.0.6 final dispatcher

"on":
  push:
    branches:
      - main
    paths:
      - .github/workflows/bootstrap-flight-commander-4.0.6-final.yml
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: bootstrap-flight-commander-4.0.6-final
  cancel-in-progress: true

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Adopt or dispatch exactly one finalizer run
        id: finalizer
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          workflow='finalize-flight-commander-4.0.6-release-v2.yml'
          run="$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow "$workflow" \
            --limit 20 \
            --json databaseId,url,status,event,createdAt,headSha \
            --jq 'if length == 0 then "" else ([.[] | select(.status != "completed")][0] // {}) | if has("databaseId") then "\(.databaseId)\t\(.url)\t\(.status)\t\(.event)\t\(.createdAt)\t\(.headSha)" else "" end end')"
          if [[ -z "$run" ]]; then
            before="$(date -u +%s)"
            gh workflow run "$workflow" --repo "$GITHUB_REPOSITORY" --ref main
            for attempt in {1..30}; do
              candidate="$(gh run list \
                --repo "$GITHUB_REPOSITORY" \
                --workflow "$workflow" \
                --event workflow_dispatch \
                --limit 5 \
                --json databaseId,url,status,event,createdAt,headSha \
                --jq 'if length == 0 then "" else .[0] | "\(.databaseId)\t\(.url)\t\(.status)\t\(.event)\t\(.createdAt)\t\(.headSha)" end')"
              if [[ -n "$candidate" ]]; then
                created="$(cut -f5 <<< "$candidate")"
                if (( $(date -u -d "$created" +%s) >= before )); then
                  run="$candidate"
                  break
                fi
              fi
              sleep 4
            done
          fi
          if [[ -z "$run" ]]; then
            echo 'No finalizer run could be located after dispatch.' >&2
            exit 1
          fi
          IFS=$'\t' read -r run_id run_url run_status run_event created_at head_sha <<< "$run"
          {
            echo "run_id=$run_id"
            echo "run_url=$run_url"
            echo "run_status=$run_status"
            echo "run_event=$run_event"
            echo "created_at=$created_at"
            echo "head_sha=$head_sha"
          } >> "$GITHUB_OUTPUT"

      - name: Report the actual finalizer run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.finalizer.outputs.run_id }}
          RUN_URL: ${{ steps.finalizer.outputs.run_url }}
          RUN_STATUS: ${{ steps.finalizer.outputs.run_status }}
          RUN_EVENT: ${{ steps.finalizer.outputs.run_event }}
          CREATED_AT: ${{ steps.finalizer.outputs.created_at }}
          HEAD_SHA: ${{ steps.finalizer.outputs.head_sha }}
        run: |
          set -euo pipefail
          gh issue comment 21 --repo "$GITHUB_REPOSITORY" --body \
            "Manifest-derived Flight Commander 4.0.6 finalizer run **${RUN_ID}** is ${RUN_STATUS} (event: ${RUN_EVENT}, head: \`${HEAD_SHA}\`): ${RUN_URL} — created ${CREATED_AT}."

      - name: Remove this one-time dispatcher
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          git rm -f .github/workflows/bootstrap-flight-commander-4.0.6-final.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'ci: remove one-time final 4.0.6 dispatcher'
          git push origin HEAD:main
