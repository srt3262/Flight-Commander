name: Stage coordinated Flight Commander 3.0.7 release

"on":
  push:
    branches:
      - agent/release-3.0.7
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: stage-flight-commander-3.0.7
  cancel-in-progress: false

env:
  RELEASE_VERSION: 3.0.7
  FIRMWARE_ARTIFACT_ID: "8913254724"
  FIRMWARE_SHA256: "d62ea585f9d4a3a4bbdb29e65caefa9675cd41a5440d42ec814d1cd8ca32df8f"
  FIRMWARE_SOURCE_SHA256: "4937ffe7cef7f97f60ec2c301340efe19de0f9f3ac33fccfa5379d88e5558306"

jobs:
  stage:
    name: Apply release policy and retain verified artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out release branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: agent/release-3.0.7
          fetch-depth: 1

      - name: Stop if the final release source is already staged
        id: state
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          if [[ "${version}" == "${RELEASE_VERSION}" ]]; then
            echo 'already_staged=true' >> "$GITHUB_OUTPUT"
          else
            [[ "${version}" == '3.0.3' ]]
            echo 'already_staged=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Download compiler-verified firmware artifact
        if: steps.state.outputs.already_staged != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p work/firmware
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${FIRMWARE_ARTIFACT_ID}/zip" > work/firmware-artifact.zip
          unzip -q work/firmware-artifact.zip -d work/firmware
          firmware="$(find work/firmware -type f -name 'Flight-Commander-Firmware-3.0.7-MICOAIR743.hex' -print -quit)"
          source="$(find work/firmware -type f -name 'Flight-Commander-Firmware-Source-v3.0.7.zip' -print -quit)"
          test -n "${firmware}"
          test -n "${source}"
          printf '%s  %s\n' "${FIRMWARE_SHA256}" "${firmware}" | sha256sum --check --strict
          printf '%s  %s\n' "${FIRMWARE_SOURCE_SHA256}" "${source}" | sha256sum --check --strict
          unzip -tq "${source}"

      - name: Prepare Configurator 3.0.7 and release policy
        if: steps.state.outputs.already_staged != 'true'
        shell: bash
        run: |
          set -euo pipefail
          cat \
            release-candidate/prepare-configurator-3.0.7.part1.py \
            release-candidate/prepare-configurator-3.0.7.part2.py \
            release-candidate/prepare-configurator-3.0.7.part3.py \
            release-candidate/prepare-configurator-3.0.7.part4.py \
            > work/prepare-configurator-3.0.7.py
          python3 -m py_compile work/prepare-configurator-3.0.7.py
          python3 work/prepare-configurator-3.0.7.py "$GITHUB_WORKSPACE"

          firmware="$(find work/firmware -type f -name 'Flight-Commander-Firmware-3.0.7-MICOAIR743.hex' -print -quit)"
          source="$(find work/firmware -type f -name 'Flight-Commander-Firmware-Source-v3.0.7.zip' -print -quit)"
          install -m 0644 "${firmware}" release/firmware/Flight-Commander-Firmware-3.0.7-MICOAIR743.hex
          install -m 0644 "${source}" release/firmware/Flight-Commander-Firmware-Source-v3.0.7.zip
          printf '%s  %s\n' "${FIRMWARE_SHA256}" release/firmware/Flight-Commander-Firmware-3.0.7-MICOAIR743.hex | sha256sum --check --strict
          printf '%s  %s\n' "${FIRMWARE_SOURCE_SHA256}" release/firmware/Flight-Commander-Firmware-Source-v3.0.7.zip | sha256sum --check --strict

          # The repository GitHub App may publish workflow files, but a workflow
          # token may not rewrite them. Keep release.yml unchanged and test the
          # small 3.0.7 orchestrator that performs ordered cleanup then dispatches
          # the existing verified release pipeline.
          git checkout HEAD -- .github/workflows/release.yml
          python3 - <<'PY'
          from pathlib import Path

          path = Path('tests/flight-commander/packaging/package-contract.test.mjs')
          text = path.read_text(encoding='utf-8')
          release_constant = '''const releaseWorkflow = readFileSync(\n  resolve(projectRoot, ".github/workflows/release.yml"),\n  "utf8",\n);\n'''
          orchestrator_constant = release_constant + '''const releaseOrchestrator = readFileSync(\n  resolve(projectRoot, ".github/workflows/release-3.0.7-orchestrator.yml"),\n  "utf8",\n);\n'''
          if 'const releaseOrchestrator =' not in text:
              if release_constant not in text:
                  raise SystemExit('release workflow constant anchor not found')
              text = text.replace(release_constant, orchestrator_constant, 1)

          old_guard = '''test("guarded push publication is tied to the current release version", () => {\n  assert.match(\n    releaseWorkflow,\n    new RegExp(\n      `github\\.event\\.head_commit\\.message == 'Publish Flight Commander ${packageManifest.version.replaceAll(".", "\\\\.")} release'`,\n    ),\n  );\n});'''
          new_guard = '''test("guarded push publication is tied to the current release version", () => {\n  assert.match(\n    releaseOrchestrator,\n    new RegExp(\n      `github\\.event\\.head_commit\\.message == 'Publish Flight Commander ${packageManifest.version.replaceAll(".", "\\\\.")} release'`,\n    ),\n  );\n  assert.match(releaseOrchestrator, /gh workflow run release\\.yml/);\n});'''
          if old_guard not in text:
              raise SystemExit('guarded publication test anchor not found')
          text = text.replace(old_guard, new_guard, 1)
          text = text.replace(
              'assert.match(releaseWorkflow, /Remove every superseded standalone Flight Commander firmware asset/);',
              'assert.match(releaseOrchestrator, /Remove every standalone Flight Commander firmware asset older than 3\\.0\\.7/);',
              1,
          )
          text = text.replace(
              'assert.match(releaseWorkflow, /Superseded firmware asset remains after cleanup/);',
              'assert.match(releaseOrchestrator, /Superseded firmware remains after cleanup/);',
              1,
          )
          path.write_text(text, encoding='utf-8')
          PY

      - name: Verify coordinated release source
        if: steps.state.outputs.already_staged != 'true'
        shell: bash
        run: |
          set -euo pipefail
          node scripts/check-flight-commander-version.mjs
          node --test tests/flight-commander/firmware/flight-commander-catalog.test.mjs
          node --test tests/flight-commander/packaging/version-contract.test.mjs
          node --test tests/flight-commander/packaging/package-contract.test.mjs
          git diff --check
          test "$(find release/firmware -maxdepth 1 -type f | wc -l)" -eq 2
          test -f release/firmware/Flight-Commander-Firmware-3.0.7-MICOAIR743.hex
          test -f release/firmware/Flight-Commander-Firmware-Source-v3.0.7.zip
          ! find release/firmware -maxdepth 1 -type f -name '*3.0.3*' | grep -q .

      - name: Remove temporary release-preparation machinery
        if: steps.state.outputs.already_staged != 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            release-candidate/prepare-firmware-3.0.7.py \
            release-candidate/prepare-configurator-3.0.7.part1.py \
            release-candidate/prepare-configurator-3.0.7.part2.py \
            release-candidate/prepare-configurator-3.0.7.part3.py \
            release-candidate/prepare-configurator-3.0.7.part4.py
          rmdir release-candidate 2>/dev/null || true
          rm -rf work

      - name: Commit the exact coordinated release candidate
        if: steps.state.outputs.already_staged != 'true'
        shell: bash
        run: |
          set -euo pipefail
          # Never ask a workflow token to rewrite workflow files. The current
          # workflow set, including the 3.0.7 orchestrator, is already committed.
          git checkout HEAD -- .github/workflows
          git config user.name 'Flight Commander Release Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Stage coordinated Flight Commander 3.0.7 release'
          git push origin HEAD:agent/release-3.0.7
