name: Publish Flight Commander 4.0.1 release

"on":
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact main-branch commit SHA to clean and publish
        required: true
        type: string
      publish_confirmation:
        description: Type PUBLISH_FLIGHT_COMMANDER_4.0.1 after explicit release approval
        required: true
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: flight-commander-4.0.1-orchestrator
  cancel-in-progress: false

jobs:
  cleanup-and-dispatch:
    name: Remove superseded firmware before Configurator publication
    if: inputs.publish_confirmation == 'PUBLISH_FLIGHT_COMMANDER_4.0.1'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out exact coordinated 4.0.1 source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.expected_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact coordinated 4.0.1 source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ inputs.expected_sha }}"
          test "$(node -p "require('./package.json').version")" = '4.0.1'
          test "$(node -p "require('./package.json').flightCommander.firmwareReleaseVersion")" = '4.0.1'
          test -f release/firmware/Flight-Commander-Firmware-4.0.1-MICOAIR743.hex
          test -f release/firmware/Flight-Commander-Firmware-Source-v4.0.1.zip
          grep -q 'FLIGHT_COMMANDER_MINIMUM_SUPPORTED_FIRMWARE_VERSION = "4.0.0"' \
            js/flightCommander/firmwareCatalog.js
          node scripts/check-flight-commander-version.mjs

      - name: Remove every standalone Flight Commander firmware asset older than 4.0.0
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/firmware-cleanup"
          page=1
          : > "$RUNNER_TEMP/firmware-cleanup/assets.tsv"
          while true; do
            page_json="$RUNNER_TEMP/firmware-cleanup/releases-$page.json"
            gh api "/repos/$GITHUB_REPOSITORY/releases?per_page=100&page=$page" > "$page_json"
            count="$(jq 'length' "$page_json")"
            if [[ "$count" -eq 0 ]]; then break; fi
            jq -r '.[] | .assets[]? | [.id, .name] | @tsv' "$page_json" \
              >> "$RUNNER_TEMP/firmware-cleanup/assets.tsv"
            if [[ "$count" -lt 100 ]]; then break; fi
            page=$((page + 1))
          done

          python3 - "$RUNNER_TEMP/firmware-cleanup/assets.tsv" \
            "$RUNNER_TEMP/firmware-cleanup/delete.tsv" <<'PY'
          from pathlib import Path
          import re
          import sys

          source = Path(sys.argv[1])
          output = Path(sys.argv[2])
          patterns = (
              re.compile(r'^Flight-Commander-Firmware-(\d+)\.(\d+)\.(\d+)-.+\.(?:hex|bin)$', re.I),
              re.compile(r'^FC-Firmware-v(\d+)\.(\d+)\.(\d+)-.+\.(?:hex|bin)$', re.I),
              re.compile(r'^Flight-Commander-Firmware-Source-v(\d+)\.(\d+)\.(\d+)\.zip$', re.I),
              re.compile(r'^FC-Firmware-Source-v(\d+)\.(\d+)\.(\d+)\.zip$', re.I),
          )
          minimum = (4, 0, 0)
          delete = []
          for line in source.read_text(encoding='utf-8').splitlines():
              asset_id, name = line.split('\t', 1)
              for pattern in patterns:
                  match = pattern.match(name)
                  if match:
                      if tuple(map(int, match.groups())) < minimum:
                          delete.append((asset_id, name))
                      break
          output.write_text(
              ''.join(f'{asset_id}\t{name}\n' for asset_id, name in delete),
              encoding='utf-8',
          )
          print(f'Identified {len(delete)} superseded standalone firmware assets.')
          PY

          while IFS=$'\t' read -r asset_id asset_name; do
            [[ -n "$asset_id" ]] || continue
            echo "Removing superseded firmware asset: $asset_name"
            gh api --method DELETE \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "/repos/$GITHUB_REPOSITORY/releases/assets/$asset_id"
          done < "$RUNNER_TEMP/firmware-cleanup/delete.tsv"

      - name: Verify no pre-4.0.0 standalone firmware remains
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          page=1
          : > "$RUNNER_TEMP/firmware-cleanup/remaining.tsv"
          while true; do
            page_json="$RUNNER_TEMP/firmware-cleanup/verify-$page.json"
            gh api "/repos/$GITHUB_REPOSITORY/releases?per_page=100&page=$page" > "$page_json"
            count="$(jq 'length' "$page_json")"
            if [[ "$count" -eq 0 ]]; then break; fi
            jq -r '.[] | .assets[]? | [.id, .name] | @tsv' "$page_json" \
              >> "$RUNNER_TEMP/firmware-cleanup/remaining.tsv"
            if [[ "$count" -lt 100 ]]; then break; fi
            page=$((page + 1))
          done
          python3 - "$RUNNER_TEMP/firmware-cleanup/remaining.tsv" <<'PY'
          from pathlib import Path
          import re
          import sys

          patterns = (
              re.compile(r'^Flight-Commander-Firmware-(\d+)\.(\d+)\.(\d+)-.+\.(?:hex|bin)$', re.I),
              re.compile(r'^FC-Firmware-v(\d+)\.(\d+)\.(\d+)-.+\.(?:hex|bin)$', re.I),
              re.compile(r'^Flight-Commander-Firmware-Source-v(\d+)\.(\d+)\.(\d+)\.zip$', re.I),
              re.compile(r'^FC-Firmware-Source-v(\d+)\.(\d+)\.(\d+)\.zip$', re.I),
          )
          minimum = (4, 0, 0)
          stale = []
          for line in Path(sys.argv[1]).read_text(encoding='utf-8').splitlines():
              _, name = line.split('\t', 1)
              for pattern in patterns:
                  match = pattern.match(name)
                  if match and tuple(map(int, match.groups())) < minimum:
                      stale.append(name)
                      break
          if stale:
              raise SystemExit('Superseded firmware remains after cleanup: ' + ', '.join(stale))
          print('Pre-4.0.0 standalone firmware cleanup: PASS')
          PY

      - name: Dispatch verified release pipeline
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v4.0.1 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Release v4.0.1 already exists; skipping duplicate dispatch.'
          else
            gh workflow run release.yml \
              --repo "$GITHUB_REPOSITORY" \
              --ref main \
              -f expected_sha="${{ inputs.expected_sha }}"
            echo "Dispatched release.yml for explicitly approved Flight Commander 4.0.1 SHA ${{ inputs.expected_sha }} after firmware cleanup."
          fi
