name: Apply Flight Commander 4.0.0 test contract

"on":
  push:
    branches:
      - develop/4.0.0-holybro-moving-baseline
    paths:
      - .github/workflows/apply-flight-commander-4.0.0-test-contract.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop/4.0.0-holybro-moving-baseline
          fetch-depth: 1
      - name: Update the exact 4.0.0 firmware-source contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('tests/flight-commander/packaging/package-contract.test.mjs')
          text = path.read_text(encoding='utf-8')
          old = 'release/firmware/Flight-Commander-Firmware-Source-v3.0.7.zip'
          new = 'release/firmware/Flight-Commander-Firmware-Source-v4.0.0.zip'
          if old not in text and new not in text:
              raise SystemExit('Expected firmware-source archive contract was not found')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          rm .github/workflows/apply-flight-commander-4.0.0-test-contract.yml
      - name: Commit the source-contract correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Correct Flight Commander 4.0.0 firmware-source test contract'
          git push origin HEAD:develop/4.0.0-holybro-moving-baseline
