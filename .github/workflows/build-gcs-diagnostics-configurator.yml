name: Build and verify Flight Commander 4.1.0 GCS recovery

"on":
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/build-gcs-diagnostics-configurator.yml
      - scripts/apply-gcs-altitude-order-recovery-v2.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: flight-commander-4.1.0-gcs-recovery
  cancel-in-progress: false

jobs:
  verify-package-and-commit:
    name: Verify, package, and commit the 4.1.0 source
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Check out the exact development branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: agent/fix-4.0.8-ui-regressions
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Apply the deterministic 4.1.0 source assembly
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $patchScript = Join-Path $PWD 'scripts/apply-gcs-altitude-order-recovery-v2.py'
          if (-not (Test-Path -LiteralPath $patchScript)) {
            throw 'The deterministic 4.1.0 assembly script is missing.'
          }

          # The packaging environment sequence appears in both the packaging and
          # upload jobs. The assembler intentionally updates only the first one.
          $scriptText = Get-Content -LiteralPath $patchScript -Raw
          $scriptText = $scriptText.Replace(
            'if text.count(old_env) != 1:',
            'if text.count(old_env) < 1:'
          )
          Set-Content -LiteralPath $patchScript -Value $scriptText -Encoding utf8NoBOM
          python -m py_compile $patchScript
          python $patchScript

          function Replace-ExactlyOnce {
            param(
              [Parameter(Mandatory = $true)][string]$Path,
              [Parameter(Mandatory = $true)][string]$Old,
              [Parameter(Mandatory = $true)][string]$New,
              [Parameter(Mandatory = $true)][string]$Label
            )
            $text = Get-Content -LiteralPath $Path -Raw
            $count = ([regex]::Matches($text, [regex]::Escape($Old))).Count
            if ($count -ne 1) {
              throw ('{0}: expected exactly one {1} marker, found {2}.' -f $Path, $Label, $count)
            }
            Set-Content -LiteralPath $Path -Value $text.Replace($Old, $New) -Encoding utf8NoBOM
          }

          # Keep the release-surface assertion aligned with YAML output syntax.
          $publisherTest = Join-Path $PWD 'tests/flight-commander/release/software-only-beta-publisher.test.mjs'
          Replace-ExactlyOnce `
            -Path $publisherTest `
            -Old '/firmware_version=\$\{\{ steps\.metadata\.outputs\.firmware_version \}\}/' `
            -New '/firmware_version:\s+\$\{\{ steps\.metadata\.outputs\.firmware_version \}\}/' `
            -Label 'firmware-version output assertion'

          # Complete the release-version conversion that the first assembly pass
          # intentionally left for the final release validation layer.
          Replace-ExactlyOnce `
            -Path (Join-Path $PWD 'js/main/ntripClient.js') `
            -Old 'NTRIP FlightCommander/4.0.8' `
            -New 'NTRIP FlightCommander/4.1.0' `
            -Label 'NTRIP User-Agent version'

          $packageContract = Join-Path $PWD 'tests/flight-commander/packaging/package-contract.test.mjs'
          Replace-ExactlyOnce `
            -Path $packageContract `
            -Old 'assert.equal(packageManifest.flightCommander.firmwareChangedInRelease, true);' `
            -New 'assert.equal(packageManifest.flightCommander.firmwareChangedInRelease, false);' `
            -Label 'Configurator-only firmware-change contract'
          Replace-ExactlyOnce `
            -Path $packageContract `
            -Old 'assert.equal(packageManifest.version, "4.0.8");' `
            -New 'assert.equal(packageManifest.version, "4.1.0");' `
            -Label 'landing-page release version contract'

      - name: Install dependencies and run all source tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          corepack enable
          corepack prepare yarn@1.22.22 --activate
          yarn install --frozen-lockfile --non-interactive
          node --check js/mavlink/mavlinkSession.js
          node --check js/serial_backend.js
          node --test tests/flight-commander/gcs/mavlink-altitude-telemetry.test.mjs
          node --test tests/flight-commander/gcs/mavlink-waiting-recovery.test.mjs
          node --test tests/flight-commander/release/software-only-beta-publisher.test.mjs
          yarn test

      - name: Remove one-time assembly files and commit verified source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          @(
            '.github/workflows/apply-mavlink-altitude-telemetry-fix.yml',
            '.github/workflows/apply-mavlink-altitude-telemetry-fix-v2.yml',
            '.github/workflows/apply-gcs-altitude-and-order-recovery.yml',
            '.github/workflows/build-gcs-diagnostics-configurator.yml',
            'scripts/apply-gcs-altitude-order-recovery.py',
            'scripts/apply-gcs-altitude-order-recovery-v2.py',
            'release/notes/v4.0.8-gcs-diagnostics-test.md'
          ) | ForEach-Object {
            $path = Join-Path $PWD $_
            if (Test-Path -LiteralPath $path) {
              Remove-Item -LiteralPath $path -Force
            }
          }

          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git diff --cached --quiet
          $hasChanges = $LASTEXITCODE -ne 0
          if (-not $hasChanges) {
            throw 'The 4.1.0 assembly produced no source changes.'
          }
          git commit -m 'Flight Commander 4.1.0 order-independent GCS and RTK workflow'
          git push origin HEAD:agent/fix-4.0.8-ui-regressions
          $sourceSha = (git rev-parse HEAD).Trim()
          "VERIFIED_SOURCE_SHA=$sourceSha" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Verified source commit: $sourceSha"

      - name: Package and verify Windows x64
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          yarn package:windows
          yarn verify:windows

      - name: Create downloadable 4.1.0 verification ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $packages = @(
            Get-ChildItem -LiteralPath (Join-Path $PWD 'out') -Directory |
              Where-Object { Test-Path -LiteralPath (Join-Path $_.FullName 'flight-commander.exe') }
          )
          if ($packages.Count -ne 1) {
            throw "Expected one Windows x64 package directory, found $($packages.Count)."
          }

          $artifactDir = Join-Path $PWD 'flight-commander-4.1.0-verification'
          New-Item -ItemType Directory -Force -Path $artifactDir | Out-Null
          $zipName = 'FC-Windows-v4.1.0-GCS-Recovery-Test.zip'
          $zipPath = Join-Path $artifactDir $zipName
          [System.IO.Compression.ZipFile]::CreateFromDirectory(
            $packages[0].FullName,
            $zipPath,
            [System.IO.Compression.CompressionLevel]::Optimal,
            $false
          )
          $hash = (Get-FileHash -LiteralPath $zipPath -Algorithm SHA256).Hash.ToLowerInvariant()
          @"
          Flight Commander 4.1.0 GCS connection-recovery verification build
          Source commit: $env:VERIFIED_SOURCE_SHA
          ZIP SHA-256: $hash

          Verified Configurator changes:
          - Removes the radio/aircraft/PC startup-order dependency.
          - Refreshes only the waiting vehicle-radio COM port until heartbeat.
          - Preserves the independent USB RTK base survey while aircraft is off.
          - Restores INAV relative barometer/INS altitude and valid GPS MSL altitude routing.
          - Retains the 4.0.8 compass, IMU, UI, and GCS diagnostic fixes.

          Flight Commander Firmware 4.0.8 is retained unchanged; no firmware reflash is required.
          "@ | Set-Content -LiteralPath (Join-Path $artifactDir 'BUILD-INFO.txt') -Encoding utf8
          "$hash  $zipName" | Set-Content -LiteralPath (Join-Path $artifactDir 'SHA256SUMS.txt') -Encoding ascii

      - name: Upload the verified Windows build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Flight-Commander-v4.1.0-GCS-Recovery-Test
          path: flight-commander-4.1.0-verification
          if-no-files-found: error
          retention-days: 7