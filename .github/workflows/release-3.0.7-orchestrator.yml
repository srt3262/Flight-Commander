name: Retire superseded firmware and publish Flight Commander 3.0.7

"on":
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact main-branch commit SHA to clean and release
        required: true
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: flight-commander-3.0.7-orchestrator
  cancel-in-progress: false

jobs:
  cleanup-and-dispatch:
    name: Remove pre-3.0.7 firmware before Configurator publication
    if: >-
      github.ref == 'refs/heads/main' &&
      (
        github.event_name == 'workflow_dispatch' ||
        github.event.head_commit.message == 'Publish Flight Commander 3.0.7 release'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out exact coordinated release source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.expected_sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify the 3.0.7 coordinated source
        shell: bash
        run: |
          set -euo pipefail
          expected_sha="${{ github.event_name == 'workflow_dispatch' && inputs.expected_sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "${expected_sha}"
          test "$(node -p "require('./package.json').version")" = '3.0.7'
          test "$(node -p "require('./package.json').flightCommander.firmwareReleaseVersion")" = '3.0.7'
          test -f release/firmware/Flight-Commander-Firmware-3.0.7-MICOAIR743.hex
          test -f release/firmware/Flight-Commander-Firmware-Source-v3.0.7.zip
          grep -q 'FLIGHT_COMMANDER_MINIMUM_SUPPORTED_FIRMWARE_VERSION = "3.0.7"' \
            js/flightCommander/firmwareCatalog.js

      - name: Remove every standalone Flight Commander firmware asset older than 3.0.7
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/firmware-cleanup"
          page=1
          : > "$RUNNER_TEMP/firmware-cleanup/assets.tsv"
          while true; do
            page_json="$RUNNER_TEMP/firmware-cleanup/releases-$page.json"
            gh api "/repos/$GITHUB_REPOSITORY/releases?per_page=100&page=$page" > "$page_json"
            count="$(jq 'length' "$page_json")"
            if [[ "$count" -eq 0 ]]; then break; fi
            jq -r '.[] | .assets[]? | [.id, .name] | @tsv' "$page_json" \
              >> "$RUNNER_TEMP/firmware-cleanup/assets.tsv"
            if [[ "$count" -lt 100 ]]; then break; fi
            page=$((page + 1))
          done

          python3 - "$RUNNER_TEMP/firmware-cleanup/assets.tsv" \
            "$RUNNER_TEMP/firmware-cleanup/delete.tsv" <<'PY'
          from pathlib import Path
          import re
          import sys

          source = Path(sys.argv[1])
          output = Path(sys.argv[2])
          patterns = (
              re.compile(r'^Flight-Commander-Firmware-(\d+)\.(\d+)\.(\d+)-.+\.(?:hex|bin)$', re.I),
              re.compile(r'^FC-Firmware-v(\d+)\.(\d+)\.(\d+)-.+\.(?:hex|bin)$', re.I),
              re.compile(r'^Flight-Commander-Firmware-Source-v(\d+)\.(\d+)\.(\d+)\.zip$', re.I),
              re.compile(r'^FC-Firmware-Source-v(\d+)\.(\d+)\.(\d+)\.zip$', re.I),
          )
          minimum = (3, 0, 7)
          delete = []
          for line in source.read_text(encoding='utf-8').splitlines():
              asset_id, name = line.split('\t', 1)
              for pattern in patterns:
                  match = pattern.match(name)
                  if match:
                      if tuple(map(int, match.groups())) < minimum:
                          delete.append((asset_id, name))
                      break
          output.write_text(
              ''.join(f'{asset_id}\t{name}\n' for asset_id, name in delete),
              encoding='utf-8',
          )
          print(f'Identified {len(delete)} superseded standalone firmware assets.')
          PY

          while IFS=$'\t' read -r asset_id asset_name; do
            [[ -n "$asset_id" ]] || continue
            echo "Removing superseded firmware asset: $asset_name"
            gh api --method DELETE \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "/repos/$GITHUB_REPOSITORY/releases/assets/$asset_id"
          done < "$RUNNER_TEMP/firmware-cleanup/delete.tsv"

      - name: Verify no pre-3.0.7 standalone firmware remains
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          page=1
          : > "$RUNNER_TEMP/firmware-cleanup/remaining.tsv"
          while true; do
            page_json="$RUNNER_TEMP/firmware-cleanup/verify-$page.json"
            gh api "/repos/$GITHUB_REPOSITORY/releases?per_page=100&page=$page" > "$page_json"
            count="$(jq 'length' "$page_json")"
            if [[ "$count" -eq 0 ]]; then break; fi
            jq -r '.[] | .assets[]? | [.id, .name] | @tsv' "$page_json" \
              >> "$RUNNER_TEMP/firmware-cleanup/remaining.tsv"
            if [[ "$count" -lt 100 ]]; then break; fi
            page=$((page + 1))
          done
          python3 - "$RUNNER_TEMP/firmware-cleanup/remaining.tsv" <<'PY'
          from pathlib import Path
          import re
          import sys

          patterns = (
              re.compile(r'^Flight-Commander-Firmware-(\d+)\.(\d+)\.(\d+)-.+\.(?:hex|bin)$', re.I),
              re.compile(r'^FC-Firmware-v(\d+)\.(\d+)\.(\d+)-.+\.(?:hex|bin)$', re.I),
              re.compile(r'^Flight-Commander-Firmware-Source-v(\d+)\.(\d+)\.(\d+)\.zip$', re.I),
              re.compile(r'^FC-Firmware-Source-v(\d+)\.(\d+)\.(\d+)\.zip$', re.I),
          )
          minimum = (3, 0, 7)
          stale = []
          for line in Path(sys.argv[1]).read_text(encoding='utf-8').splitlines():
              _, name = line.split('\t', 1)
              for pattern in patterns:
                  match = pattern.match(name)
                  if match and tuple(map(int, match.groups())) < minimum:
                      stale.append(name)
                      break
          if stale:
              raise SystemExit('Superseded firmware remains after cleanup: ' + ', '.join(stale))
          print('Pre-3.0.7 standalone firmware cleanup: PASS')
          PY

      - name: Dispatch the existing verified release pipeline
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          expected_sha="${{ github.event_name == 'workflow_dispatch' && inputs.expected_sha || github.sha }}"
          gh workflow run release.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f expected_sha="$expected_sha"
          echo "Dispatched release.yml for tested main SHA $expected_sha after firmware cleanup."
