name: Move retained Flight Commander 3.0.7 firmware baseline

"on":
  push:
    branches:
      - develop/4.0.0-holybro-moving-baseline
    paths:
      - .github/workflows/move-flight-commander-3.0.7-baseline.yml

permissions:
  contents: write

jobs:
  move-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop/4.0.0-holybro-moving-baseline
          fetch-depth: 1
      - name: Preserve the source baseline while keeping release/firmware version-pure
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/prepare-flight-commander-firmware-4.0.0.py')
          text = path.read_text(encoding='utf-8')
          old = '''def main() -> int:
    parser = argparse.ArgumentParser()
    parser.add_argument("--archive", type=Path, required=True)
    parser.add_argument("--output", type=Path, required=True)
    args = parser.parse_args()
    prepare(args.archive.resolve(), args.output.resolve())
    return 0
'''
          new = '''def main() -> int:
    parser = argparse.ArgumentParser()
    parser.add_argument("--archive", type=Path, required=True)
    parser.add_argument("--output", type=Path, required=True)
    args = parser.parse_args()

    repository_root = Path(__file__).resolve().parents[1]
    legacy_release_source = repository_root / "release/firmware/Flight-Commander-Firmware-Source-v3.0.7.zip"
    legacy_release_hex = repository_root / "release/firmware/Flight-Commander-Firmware-3.0.7-MICOAIR743.hex"
    retained_baseline = repository_root / "firmware-baseline/Flight-Commander-Firmware-Source-v3.0.7.zip"

    archive = args.archive.resolve()
    if archive == legacy_release_source:
        retained_baseline.parent.mkdir(parents=True, exist_ok=True)
        if legacy_release_source.exists():
            shutil.copy2(legacy_release_source, retained_baseline)
        if not retained_baseline.exists():
            raise FileNotFoundError(
                "The retained Flight Commander 3.0.7 firmware source baseline is missing."
            )
        archive = retained_baseline

    prepare(archive, args.output.resolve())

    # A coordinated release directory contains only the exact current firmware
    # image and source archive. The historical build baseline remains available
    # outside release/firmware for reproducible future builds.
    legacy_release_source.unlink(missing_ok=True)
    legacy_release_hex.unlink(missing_ok=True)
    return 0
'''
          if new not in text:
              if text.count(old) != 1:
                  raise SystemExit(f'Expected one firmware generator main block, found {text.count(old)}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
          rm .github/workflows/move-flight-commander-3.0.7-baseline.yml
      - name: Commit baseline relocation support
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Move the retained 3.0.7 firmware baseline outside release artifacts'
          git push origin HEAD:develop/4.0.0-holybro-moving-baseline
