name: Apply Flight Commander UI regression fixes

"on":
  push:
    branches:
      - agent/fix-4.0.8-ui-regressions
    paths:
      - .github/workflows/apply-ui-regression-fixes.yml

permissions:
  contents: write

jobs:
  patch-test-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the regression-fix branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Apply the three targeted UI repairs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          root = Path.cwd()

          configuration = root / 'tabs/configuration.js'
          configuration_text = configuration.read_text(encoding='utf-8')
          old_settings_refresh = """        settingsPromise.then(function() {
                      $i2cSpeed.trigger('change');
                  }).catch(function(error) {
                      console.error('Settings load failed, I2C speed change not triggered:', error);
                  });
          """
          new_settings_refresh = """        settingsPromise.then(function() {
                      renderCompassSourceSelectionInfo();
                      $i2cSpeed.trigger('change');
                  }).catch(function(error) {
                      console.error('Settings load failed, delayed UI refreshes were not triggered:', error);
                  });
          """
          if old_settings_refresh not in configuration_text:
              raise SystemExit('Configuration settings-refresh marker was not found')
          configuration.write_text(
              configuration_text.replace(old_settings_refresh, new_settings_refresh, 1),
              encoding='utf-8',
          )

          theme = root / 'src/css/theme.css'
          theme_text = theme.read_text(encoding='utf-8')
          legacy_failsafe_selector = '.tab-failsafe .radioarea,\n'
          if legacy_failsafe_selector not in theme_text:
              raise SystemExit('Failsafe dark-theme scrub selector was not found')
          theme_text = theme_text.replace(legacy_failsafe_selector, '', 1)
          failsafe_marker = '/* Preserve the original INAV failsafe behavior illustrations in the dark theme. */'
          if failsafe_marker in theme_text:
              raise SystemExit('Failsafe illustration repair was already present unexpectedly')
          theme_text = theme_text.rstrip() + """

          /* Preserve the original INAV failsafe behavior illustrations in the dark theme. */
          .tab-failsafe .radioarea {
              color: var(--fc-theme-text) !important;
              border: 1px solid var(--fc-theme-border) !important;
              background-color: var(--fc-theme-surface-alt) !important;
          }

          .tab-failsafe .radioarea.pro1,
          .tab-failsafe .radioarea.pro2,
          .tab-failsafe .radioarea.pro4 {
              background-repeat: no-repeat, no-repeat !important;
              background-position: top right 10px, top right !important;
              background-size: 200px auto, 220px 100% !important;
          }

          .tab-failsafe .radioarea.pro1 {
              background-image:
                  url("./../../images/icons/cf_failsafe_procedure1.svg"),
                  linear-gradient(#dce3e7, #dce3e7) !important;
          }

          .tab-failsafe .radioarea.pro2 {
              background-image:
                  url("./../../images/icons/cf_failsafe_procedure2.svg"),
                  linear-gradient(#dce3e7, #dce3e7) !important;
          }

          .tab-failsafe .radioarea.pro4 {
              background-image:
                  url("./../../images/icons/cf_failsafe_procedure4.svg"),
                  linear-gradient(#dce3e7, #dce3e7) !important;
          }

          .tab-failsafe .radioarea.pro5 {
              background-image: none !important;
          }
          """.lstrip('\n')
          theme.write_text(theme_text, encoding='utf-8')

          planner_css = root / 'src/css/flight-commander.css'
          planner_text = planner_css.read_text(encoding='utf-8')
          planner_marker = '/* Keep Flight Planner label text and its inline unit on one caption line. */'
          if planner_marker in planner_text:
              raise SystemExit('Flight Planner label repair was already present unexpectedly')
          planner_text = planner_text.rstrip() + """

          /* Keep Flight Planner label text and its inline unit on one caption line. */
          .tab-flight-planner .fc-form-grid label {
              display: block;
              min-width: 0;
              line-height: 1.35;
          }

          .tab-flight-planner .fc-form-grid label > input,
          .tab-flight-planner .fc-form-grid label > select {
              display: block;
              margin-top: 4px;
          }
          """.lstrip('\n')
          planner_css.write_text(planner_text, encoding='utf-8')

          regression_test = root / 'tests/flight-commander/configurator/ui-regression-fixes.test.mjs'
          regression_test.write_text("""import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          import { dirname, resolve } from 'node:path';
          import test from 'node:test';
          import { fileURLToPath } from 'node:url';

          const projectRoot = resolve(dirname(fileURLToPath(import.meta.url)), '../../..');
          const configurationSource = readFileSync(resolve(projectRoot, 'tabs/configuration.js'), 'utf8');
          const themeSource = readFileSync(resolve(projectRoot, 'src/css/theme.css'), 'utf8');
          const flightCommanderCss = readFileSync(resolve(projectRoot, 'src/css/flight-commander.css'), 'utf8');

          test('compass source status is refreshed after asynchronous settings are populated', () => {
            const delayedRefresh = /settingsPromise\\.then\\(function\\(\\)\\s*\\{([\\s\\S]*?)\\}\\)\\.catch/.exec(configurationSource)?.[1] ?? '';
            assert.match(delayedRefresh, /renderCompassSourceSelectionInfo\\(\\);/);
            assert.match(delayedRefresh, /\\$i2cSpeed\\.trigger\\('change'\\);/);
          });

          test('dark theme preserves the original failsafe behavior illustrations', () => {
            const legacyScrub = /\\/\\* Per-tab legacy contrast scrub[\\s\\S]+?background-image:\\s*none\\s*!important;\\s*\\}/.exec(themeSource)?.[0] ?? '';
            assert.ok(legacyScrub, 'legacy contrast scrub block should remain present');
            assert.doesNotMatch(legacyScrub, /\\.tab-failsafe \\.radioarea,/);
            for (const procedure of [1, 2, 4]) {
              assert.match(
                themeSource,
                new RegExp(`\\\\.tab-failsafe \\\\.radioarea\\\\.pro${procedure}\\\\s*\\\\{[^}]*cf_failsafe_procedure${procedure}\\\\.svg`, 's'),
              );
            }
          });

          test('Flight Planner captions keep inline unit spans on the caption line', () => {
            assert.match(
              flightCommanderCss,
              /\\.tab-flight-planner \\.fc-form-grid label\\s*\\{[^}]*display:\\s*block;/s,
            );
            assert.match(
              flightCommanderCss,
              /\\.tab-flight-planner \\.fc-form-grid label > input,[\\s\\S]*label > select\\s*\\{[^}]*margin-top:\\s*4px;/s,
            );
          });
          """, encoding='utf-8')
          PY

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Install dependencies and run the complete Configurator test suite
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare yarn@1.22.22 --activate
          yarn install --frozen-lockfile --non-interactive
          yarn test

      - name: Commit the verified repairs and remove this one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/apply-ui-regression-fixes.yml
          git add \
            tabs/configuration.js \
            src/css/theme.css \
            src/css/flight-commander.css \
            tests/flight-commander/configurator/ui-regression-fixes.test.mjs
          git config user.name 'Flight Commander Build'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'Fix compass status, failsafe illustrations, and planner labels'
          git push origin HEAD:agent/fix-4.0.8-ui-regressions
