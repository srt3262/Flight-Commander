name: Export verified Flight Commander 4.0.5 final bundle
run-name: Verify and export the published Flight Commander 4.0.5 bundle

"on":
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/export-flight-commander-4.0.5-final.yml

permissions:
  contents: read

jobs:
  export:
    name: Download and byte-verify published 4.0.5 assets
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Download complete bundle and four canonical deliverables
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v4.0.5-beta
          VERSION: 4.0.5
        run: |
          set -euo pipefail
          mkdir -p export
          for asset in \
            "Flight-Commander-v${VERSION}.zip" \
            "FC-Windows-v${VERSION}.zip" \
            "FC-Configurator-Source-v${VERSION}.zip" \
            "FC-Firmware-v${VERSION}-MICOAIR743.hex" \
            "FC-Firmware-Source-v${VERSION}.zip"
          do
            gh release download "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --dir export \
              --pattern "$asset" \
              --clobber
            test -s "export/$asset"
          done

      - name: Verify exact contents, byte identity, hashes, and source manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import zipfile
          from pathlib import Path

          version = "4.0.5"
          epoch = 1786010400
          root = Path("export")
          components = [
              f"FC-Windows-v{version}.zip",
              f"FC-Configurator-Source-v{version}.zip",
              f"FC-Firmware-v{version}-MICOAIR743.hex",
              f"FC-Firmware-Source-v{version}.zip",
          ]
          complete = root / f"Flight-Commander-v{version}.zip"
          firmware = root / f"FC-Firmware-v{version}-MICOAIR743.hex"
          source = root / f"FC-Firmware-Source-v{version}.zip"
          expected_firmware_sha = "1f248ceb0a3cf52674712c92a9308e1ebe968908512f2d929eefdb9544172ef1"
          expected_source_sha = "0f5b6b1225b928bbaee0e2078f41e59e788bbec76063ad2fb8b295c314cb7a88"

          def sha256(path: Path) -> str:
              return hashlib.sha256(path.read_bytes()).hexdigest()

          for name in components:
              path = root / name
              assert path.is_file() and path.stat().st_size > 0, path
              if path.suffix == ".zip":
                  with zipfile.ZipFile(path) as archive:
                      assert archive.testzip() is None, name

          with zipfile.ZipFile(complete) as archive:
              assert archive.testzip() is None
              names = sorted(info.filename for info in archive.infolist() if not info.is_dir())
              assert names == sorted(components), (names, components)
              for name in components:
                  assert archive.read(name) == (root / name).read_bytes(), name

          firmware_sha = sha256(firmware)
          source_sha = sha256(source)
          assert firmware_sha == expected_firmware_sha, firmware_sha
          assert source_sha == expected_source_sha, source_sha

          with zipfile.ZipFile(source) as archive:
              manifest_names = [
                  name for name in archive.namelist()
                  if name.endswith('/RELEASE-MANIFEST.json')
              ]
              assert len(manifest_names) == 1, manifest_names
              manifest = json.loads(archive.read(manifest_names[0]))
          assert manifest["version"] == version
          assert manifest["target"] == "MICOAIR743"
          assert manifest["source_date_epoch"] == epoch
          assert manifest["artifact"]["sha256"] == firmware_sha
          assert manifest["artifact"]["bytes"] == firmware.stat().st_size

          hashes = {
              path.name: sha256(path)
              for path in sorted(root.iterdir())
              if path.is_file()
          }
          (root / "SHA256SUMS.txt").write_text(
              "".join(f"{digest}  {name}\n" for name, digest in sorted(hashes.items())),
              encoding="ascii",
          )
          export_manifest = {
              "version": version,
              "tag": "v4.0.5-beta",
              "releaseCommit": "614061e8168393e22f78150c52fb0abf164e3748",
              "completeBundle": complete.name,
              "componentCount": 4,
              "components": components,
              "firmwareSourceEpoch": epoch,
              "sha256": hashes,
          }
          (root / "release-export-manifest.json").write_text(
              json.dumps(export_manifest, indent=2) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(export_manifest, indent=2))
          PY

      - name: Upload verified release downloads
        uses: actions/upload-artifact@v4
        with:
          name: flight-commander-4.0.5-final-release-downloads
          retention-days: 30
          if-no-files-found: error
          path: export
