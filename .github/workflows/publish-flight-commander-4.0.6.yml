name: Publish Flight Commander 4.0.6 beta
run-name: Publish and verify Flight Commander 4.0.6 beta

"on":
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-flight-commander-4.0.6.yml
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: publish-flight-commander-4.0.6
  cancel-in-progress: true

env:
  FC_VERSION: 4.0.6
  FC_TAG: v4.0.6-beta
  FC_INPUT_SHA256: 4ce68e3b8b72711420e6da4e57bbdb3c56b45caff7d5967e59f8312519a58349
  FC_FIRMWARE_ARTIFACT: fc406-firmware-${{ github.run_id }}
  FC_RELEASE_ARTIFACT: fc406-release-${{ github.run_id }}

jobs:
  announce:
    name: Record release run
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Post observable run link
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh pr comment 21 --repo "$GITHUB_REPOSITORY" --body \
            "Flight Commander 4.0.6 publication started in run **${GITHUB_RUN_ID}** (attempt ${GITHUB_RUN_ATTEMPT}): ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

  firmware:
    name: Build and verify MICOAIR743 firmware
    needs: announce
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out exact release source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Expand checksum-guarded build inputs
        shell: bash
        run: |
          set -euo pipefail
          encoded="$RUNNER_TEMP/fc406-inputs.b64"
          payload="$RUNNER_TEMP/fc406-inputs.tar.xz"
          cat .flight-commander/4.0.6-build-inputs.part-{00..08} > "$encoded"
          base64 --decode "$encoded" > "$payload"
          printf '%s  %s\n' "$FC_INPUT_SHA256" "$payload" | sha256sum --check --strict
          tar -xJf "$payload" -C "$GITHUB_WORKSPACE"

      - name: Install firmware build prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build curl xz-utils unzip zip python3

      - name: Install exact Arm GNU Toolchain 13.2.1
        shell: bash
        run: |
          set -euo pipefail
          release=arm-gnu-toolchain-13.2.Rel1-x86_64-arm-none-eabi
          archive=arm-gnu-toolchain-13.2.rel1-x86_64-arm-none-eabi.tar.xz
          expected=6cd1bbc1d9ae57312bcd169ae283153a9572bd6a8e4eeae2fedfbc33b115fdbb
          url="https://developer.arm.com/-/media/Files/downloads/gnu/13.2.rel1/binrel/$archive"
          mkdir -p "$RUNNER_TEMP/toolchain"
          curl --fail --location --retry 5 --retry-all-errors \
            --output "$RUNNER_TEMP/toolchain/$archive" "$url"
          printf '%s  %s\n' "$expected" "$RUNNER_TEMP/toolchain/$archive" \
            | sha256sum --check --strict
          tar -xJf "$RUNNER_TEMP/toolchain/$archive" -C "$RUNNER_TEMP/toolchain"
          echo "$RUNNER_TEMP/toolchain/$release/bin" >> "$GITHUB_PATH"

      - name: Build firmware and source archive
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/build-flight-commander-4.0.6.py firmware \
            --workspace "$GITHUB_WORKSPACE" \
            --temp "$RUNNER_TEMP/fc406-firmware"
          test -s "$RUNNER_TEMP/fc406-firmware/FC-Firmware-v4.0.6-MICOAIR743.hex"
          test -s "$RUNNER_TEMP/fc406-firmware/FC-Firmware-Source-v4.0.6.zip"
          test -s "$RUNNER_TEMP/fc406-firmware/firmware-4.0.6-metadata.json"

      - name: Upload verified firmware
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ env.FC_FIRMWARE_ARTIFACT }}
          path: |
            ${{ runner.temp }}/fc406-firmware/FC-Firmware-v4.0.6-MICOAIR743.hex
            ${{ runner.temp }}/fc406-firmware/FC-Firmware-Source-v4.0.6.zip
            ${{ runner.temp }}/fc406-firmware/firmware-4.0.6-metadata.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  package:
    name: Test and package Configurator plus four deliverables
    needs: firmware
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Check out exact release source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Expand checksum-guarded build inputs
        shell: bash
        run: |
          set -euo pipefail
          encoded="$RUNNER_TEMP/fc406-inputs.b64"
          payload="$RUNNER_TEMP/fc406-inputs.tar.xz"
          cat .flight-commander/4.0.6-build-inputs.part-{00..08} > "$encoded"
          python - "$encoded" "$payload" "$FC_INPUT_SHA256" <<'PY'
          import base64
          import hashlib
          import sys
          import tarfile
          from pathlib import Path

          encoded = Path(sys.argv[1])
          payload = Path(sys.argv[2])
          expected = sys.argv[3]
          payload.write_bytes(base64.b64decode(encoded.read_text(encoding="ascii"), validate=True))
          actual = hashlib.sha256(payload.read_bytes()).hexdigest()
          if actual != expected:
              raise SystemExit(f"4.0.6 input SHA-256 mismatch: {actual}")
          with tarfile.open(payload, mode="r:xz") as archive:
              archive.extractall(Path.cwd())
          print(f"Expanded verified 4.0.6 build inputs: {actual}")
          PY

      - name: Download verified firmware
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ env.FC_FIRMWARE_ARTIFACT }}
          path: release-candidate/firmware

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Enable pinned Yarn
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          corepack enable
          corepack prepare yarn@1.22.22 --activate
          yarn --version
          python --version

      - name: Build, test and package coordinated release
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build-flight-commander-4.0.6.py release \
            --workspace "$GITHUB_WORKSPACE" \
            --firmware-dir "$GITHUB_WORKSPACE/release-candidate/firmware" \
            --output "$GITHUB_WORKSPACE/release-candidate/Flight-Commander-v4.0.6"

      - name: Verify exact four-file complete bundle
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import zipfile
          from pathlib import Path

          root = Path("release-candidate/Flight-Commander-v4.0.6")
          expected = sorted([
              "FC-Windows-v4.0.6.zip",
              "FC-Configurator-Source-v4.0.6.zip",
              "FC-Firmware-v4.0.6-MICOAIR743.hex",
              "FC-Firmware-Source-v4.0.6.zip",
          ])
          complete = root / "Flight-Commander-v4.0.6.zip"
          disk = sorted(path.name for path in root.iterdir()
                        if path.is_file() and path.name.startswith("FC-"))
          if disk != expected:
              raise SystemExit(f"Canonical component mismatch: {disk}")
          with zipfile.ZipFile(complete) as archive:
              names = sorted(info.filename for info in archive.infolist() if not info.is_dir())
              if names != expected:
                  raise SystemExit(f"Complete bundle mismatch: {names}")
              for name in expected:
                  if hashlib.sha256((root / name).read_bytes()).digest() != \
                          hashlib.sha256(archive.read(name)).digest():
                      raise SystemExit(f"Byte mismatch inside bundle: {name}")
          for required in [complete, root / "SHA256SUMS.txt", *(root / name for name in expected)]:
              if not required.is_file() or required.stat().st_size == 0:
                  raise SystemExit(f"Missing or empty release file: {required}")
          print("Verified exactly four byte-matched deliverables and the complete bundle.")
          PY

      - name: Upload verified complete release
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ env.FC_RELEASE_ARTIFACT }}
          path: release-candidate/Flight-Commander-v4.0.6/**
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  publish:
    name: Integrate source, publish prerelease and verify download
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact release source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Expand checksum-guarded build inputs
        shell: bash
        run: |
          set -euo pipefail
          encoded="$RUNNER_TEMP/fc406-inputs.b64"
          payload="$RUNNER_TEMP/fc406-inputs.tar.xz"
          cat .flight-commander/4.0.6-build-inputs.part-{00..08} > "$encoded"
          base64 --decode "$encoded" > "$payload"
          printf '%s  %s\n' "$FC_INPUT_SHA256" "$payload" | sha256sum --check --strict
          tar -xJf "$payload" -C "$GITHUB_WORKSPACE"

      - name: Download verified complete release
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ env.FC_RELEASE_ARTIFACT }}
          path: release-candidate/Flight-Commander-v4.0.6

      - name: Integrate canonical 4.0.6 source into main
        id: integrate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          ci = Path(".github/workflows/ci.yml")
          if ci.exists():
              lines = ci.read_text(encoding="utf-8").splitlines(keepends=True)
              ci.write_text(
                  "".join(
                      line for line in lines
                      if not (
                          line.lstrip().startswith("if:")
                          and "Start Flight Commander 4.0.6 release" in line
                      )
                  ),
                  encoding="utf-8",
              )

          root = Path("release-candidate/Flight-Commander-v4.0.6")
          sums = {}
          for raw in (root / "SHA256SUMS.txt").read_text(encoding="utf-8").splitlines():
              digest, name = raw.split("  ", 1)
              sums[name] = digest
          marker = {
              "version": "4.0.6",
              "tag": "v4.0.6-beta",
              "workflow_run_id": int(os.environ["GITHUB_RUN_ID"]),
              "workflow_run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "trigger_sha": os.environ["GITHUB_SHA"],
              "artifact_name": os.environ["FC_RELEASE_ARTIFACT"],
              "bundle_sha256": sums["Flight-Commander-v4.0.6.zip"],
              "component_sha256": {
                  name: digest
                  for name, digest in sums.items()
                  if name.startswith("FC-")
              },
          }
          path = Path("release/published/v4.0.6-beta-build.json")
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(marker, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(marker, indent=2))
          PY
          printf '%s\n' 'release-candidate/' >> .git/info/exclude
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Flight Commander 4.0.6: learned compass orientation'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
          integrated_sha="$(git rev-parse HEAD)"
          echo "integrated_sha=$integrated_sha" >> "$GITHUB_OUTPUT"

      - name: Create or update 4.0.6 beta prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          INTEGRATED_SHA: ${{ steps.integrate.outputs.integrated_sha }}
        run: |
          set -euo pipefail
          root='release-candidate/Flight-Commander-v4.0.6'
          assets=(
            "$root/FC-Windows-v4.0.6.zip"
            "$root/FC-Configurator-Source-v4.0.6.zip"
            "$root/FC-Firmware-v4.0.6-MICOAIR743.hex"
            "$root/FC-Firmware-Source-v4.0.6.zip"
            "$root/Flight-Commander-v4.0.6.zip"
            "$root/SHA256SUMS.txt"
          )
          if gh release view "$FC_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete "$FC_TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
          fi
          gh release create "$FC_TAG" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$INTEGRATED_SHA" \
            --title 'Flight Commander 4.0.6 Beta' \
            --notes-file release/notes/v4.0.6-beta.md \
            --prerelease

      - name: Re-download and verify published complete bundle
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          published="$RUNNER_TEMP/published-fc406"
          mkdir -p "$published"
          gh release download "$FC_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern 'Flight-Commander-v4.0.6.zip' --dir "$published"
          local='release-candidate/Flight-Commander-v4.0.6/Flight-Commander-v4.0.6.zip'
          remote="$published/Flight-Commander-v4.0.6.zip"
          test "$(sha256sum "$local" | cut -d' ' -f1)" = \
               "$(sha256sum "$remote" | cut -d' ' -f1)"
          gh release view "$FC_TAG" --repo "$GITHUB_REPOSITORY" \
            --json url,tagName,isPrerelease,targetCommitish,publishedAt,assets

      - name: Remove one-time inputs and retarget release to canonical source
        id: cleanup
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -f .flight-commander/4.0.6-build-inputs.part-* \
            .flight-commander/publish-4.0.6.trigger \
            .github/workflows/publish-flight-commander-4.0.6.yml
          git add -A
          git commit -m 'ci: finalize streamlined Flight Commander release path'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
          final_sha="$(git rev-parse HEAD)"
          git tag -f "$FC_TAG" "$final_sha"
          git push origin "refs/tags/$FC_TAG" --force
          echo "final_sha=$final_sha" >> "$GITHUB_OUTPUT"
          remote_tag="$(git ls-remote origin "refs/tags/$FC_TAG" | cut -f1)"
          test "$remote_tag" = "$final_sha"

  report:
    name: Report publication result
    if: always()
    needs:
      - announce
      - firmware
      - package
      - publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Post final run status
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ANNOUNCE_RESULT: ${{ needs.announce.result }}
          FIRMWARE_RESULT: ${{ needs.firmware.result }}
          PACKAGE_RESULT: ${{ needs.package.result }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
        run: |
          set -euo pipefail
          gh pr comment 21 --repo "$GITHUB_REPOSITORY" --body \
            "Flight Commander 4.0.6 publication run **${GITHUB_RUN_ID}** finished. announce=${ANNOUNCE_RESULT}; firmware=${FIRMWARE_RESULT}; package=${PACKAGE_RESULT}; publish=${PUBLISH_RESULT}. ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
