name: One-time prepare Flight Commander 4.1.2

"on":
  push:
    branches:
      - main
    paths:
      - .github/workflows/one-time-prepare-flight-commander-4.1.2.yml
      - scripts/prepare-flight-commander-4.1.2.py

permissions:
  contents: write

concurrency:
  group: one-time-prepare-flight-commander-4.1.2
  cancel-in-progress: false

jobs:
  transform:
    name: Transform and test release branch
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out transformation branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: remove-official-inav-support
          fetch-depth: 0
          persist-credentials: true

      - name: Reset branch to triggering main and load transformer
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git show origin/main:scripts/prepare-flight-commander-4.1.2.py > /tmp/prepare-flight-commander-4.1.2.py
          git checkout -B remove-official-inav-support origin/main

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Apply transformation, run tests, and publish branch result
        shell: bash
        run: |
          set +e
          python3 /tmp/prepare-flight-commander-4.1.2.py > /tmp/transform.log 2>&1
          transform_status=$?
          install_status=0
          test_status=0

          if [ "$transform_status" -eq 0 ]; then
            corepack enable > /tmp/install.log 2>&1
            install_status=$?
            if [ "$install_status" -eq 0 ]; then
              corepack prepare yarn@1.22.22 --activate >> /tmp/install.log 2>&1
              install_status=$?
            fi
            if [ "$install_status" -eq 0 ]; then
              yarn install --frozen-lockfile --non-interactive >> /tmp/install.log 2>&1
              install_status=$?
            fi
            if [ "$install_status" -eq 0 ]; then
              yarn test > /tmp/test.log 2>&1
              test_status=$?
            fi
          fi

          mkdir -p docs/internal
          status_path=docs/internal/flight-commander-4.1.2-transform-status.txt
          if [ "$transform_status" -eq 0 ] && [ "$install_status" -eq 0 ] && [ "$test_status" -eq 0 ]; then
            rm -f "$status_path"
          else
            {
              echo "Flight Commander 4.1.2 one-time transformation failed."
              echo "transform_status=$transform_status"
              echo "install_status=$install_status"
              echo "test_status=$test_status"
              echo
              echo "--- transformer log ---"
              tail -n 300 /tmp/transform.log 2>/dev/null || true
              echo
              echo "--- dependency log ---"
              tail -n 200 /tmp/install.log 2>/dev/null || true
              echo
              echo "--- test log ---"
              tail -n 500 /tmp/test.log 2>/dev/null || true
            } > "$status_path"
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            if [ "$transform_status" -eq 0 ] && [ "$install_status" -eq 0 ] && [ "$test_status" -eq 0 ]; then
              git commit -m "Prepare Flight Commander 4.1.2 firmware-only support"
            else
              git commit -m "Record Flight Commander 4.1.2 transformation failure"
            fi
          fi
          git push --force origin HEAD:remove-official-inav-support

          if [ "$transform_status" -ne 0 ]; then exit "$transform_status"; fi
          if [ "$install_status" -ne 0 ]; then exit "$install_status"; fi
          exit "$test_status"

# Triggered after bootstrap merge.
