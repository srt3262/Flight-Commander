name: Build Flight Commander 4.0.3 compass alignment repair

"on":
  push:
    branches:
      - agent/fix-4.0.3-compass-alignment-layer
    paths:
      - .github/workflows/build-flight-commander-4.0.3-compass-alignment.yml
      - scripts/prepare-flight-commander-firmware-4.0.3.py
      - scripts/apply-flight-commander-4.0.3-beta.py
      - tests/flight-commander/firmware/onboard-ist8310-transform.test.mjs
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    branches:
      - main
    paths:
      - .github/workflows/build-flight-commander-4.0.3-compass-alignment.yml
      - scripts/prepare-flight-commander-firmware-4.0.3.py
      - scripts/apply-flight-commander-4.0.3-beta.py
      - tests/flight-commander/firmware/onboard-ist8310-transform.test.mjs
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: flight-commander-4.0.3-compass-alignment
  cancel-in-progress: false

jobs:
  build-and-integrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Check out repair branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: agent/fix-4.0.3-compass-alignment-layer
          fetch-depth: 0
          persist-credentials: true

      - name: Install Arm GNU Toolchain 13.2.1
        shell: bash
        run: |
          set -euo pipefail
          toolchain_release="arm-gnu-toolchain-13.2.Rel1-x86_64-arm-none-eabi"
          toolchain_archive="arm-gnu-toolchain-13.2.rel1-x86_64-arm-none-eabi.tar.xz"
          toolchain_sha256="6cd1bbc1d9ae57312bcd169ae283153a9572bd6a8e4eeae2fedfbc33b115fdbb"
          toolchain_url="https://developer.arm.com/-/media/Files/downloads/gnu/13.2.rel1/binrel/${toolchain_archive}"
          cache_parent="${RUNNER_TEMP}/flight-commander-toolchains"
          toolchain_root="${cache_parent}/${toolchain_release}"
          if [[ ! -x "${toolchain_root}/bin/arm-none-eabi-gcc" ]]; then
            mkdir -p "${cache_parent}"
            curl --fail --location --retry 3 \
              --output "${cache_parent}/${toolchain_archive}.partial" \
              "${toolchain_url}"
            printf '%s  %s\n' \
              "${toolchain_sha256}" \
              "${cache_parent}/${toolchain_archive}.partial" |
              sha256sum --check --strict
            mv \
              "${cache_parent}/${toolchain_archive}.partial" \
              "${cache_parent}/${toolchain_archive}"
            tar -xJf "${cache_parent}/${toolchain_archive}" -C "${cache_parent}"
          fi
          echo "${toolchain_root}/bin" >> "${GITHUB_PATH}"
          echo "ARM_GNU_TOOLCHAIN_CACHE_DIR=${cache_parent}" >> "${GITHUB_ENV}"

      - name: Prepare 4.0.3 firmware source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf work/firmware-4.0.3
          source_root="$(
            python3 scripts/prepare-flight-commander-firmware-4.0.3.py \
              --archive release/firmware/Flight-Commander-Firmware-Source-v4.0.2.zip \
              --output work/firmware-4.0.3
          )"
          test -d "${source_root}"
          echo "SOURCE_ROOT=${source_root}" >> "${GITHUB_ENV}"

      - name: Build and finalize MICOAIR743 firmware
        shell: bash
        run: |
          set -euo pipefail
          build_root="${RUNNER_TEMP}/flight-commander-4.0.3-build"
          source_zip="${RUNNER_TEMP}/Flight-Commander-Firmware-Source-v4.0.3.zip"
          rm -rf "${build_root}" "${source_zip}"
          bash "${SOURCE_ROOT}/flight-commander/build-micoair743.sh" "${build_root}"
          firmware="${build_root}/Flight-Commander-Firmware-4.0.3-MICOAIR743.hex"
          python3 scripts/prepare-flight-commander-firmware-4.0.3.py \
            --finalize-root "${SOURCE_ROOT}" \
            --firmware "${firmware}" \
            --source-zip "${source_zip}"
          test -s "${firmware}"
          test -s "${source_zip}"
          echo "BUILT_FIRMWARE=${firmware}" >> "${GITHUB_ENV}"
          echo "BUILT_SOURCE_ZIP=${source_zip}" >> "${GITHUB_ENV}"

      - name: Replace retained release-only firmware inputs
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            release/firmware/Flight-Commander-Firmware-4.0.2-MICOAIR743.hex \
            release/firmware/Flight-Commander-Firmware-Source-v4.0.2.zip
          cp \
            "${BUILT_FIRMWARE}" \
            release/firmware/Flight-Commander-Firmware-4.0.3-MICOAIR743.hex
          cp \
            "${BUILT_SOURCE_ZIP}" \
            release/firmware/Flight-Commander-Firmware-Source-v4.0.3.zip
          python3 scripts/apply-flight-commander-4.0.3-beta.py \
            --firmware release/firmware/Flight-Commander-Firmware-4.0.3-MICOAIR743.hex \
            --source-zip release/firmware/Flight-Commander-Firmware-Source-v4.0.3.zip

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Install Configurator dependencies
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          yarn install --frozen-lockfile --non-interactive

      - name: Verify coordinated source and Configurator tests
        shell: bash
        run: |
          set -euo pipefail
          node scripts/check-flight-commander-version.mjs
          yarn test
          bash scripts/rebuild-firmware-source-archive.sh

      - name: Commit coordinated 4.0.3 beta inputs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Flight Commander Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add \
            package.json \
            manifest.json \
            tabs/landing.html \
            js/main/ntripClient.js \
            tests/flight-commander/packaging/package-contract.test.mjs \
            release/notes/v4.0.3-beta.md
          git add -A release/firmware
          if git diff --cached --quiet; then
            echo "Coordinated 4.0.3 inputs are already committed."
            exit 0
          fi
          git commit -m "Build coordinated Flight Commander 4.0.3 beta"
          git push origin HEAD:agent/fix-4.0.3-compass-alignment-layer
