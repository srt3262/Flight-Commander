name: Build Flight Commander 4.0.6 firmware candidate

"on":
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-flight-commander-4.0.6-candidate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  firmware:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1

      - name: Install build prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build curl xz-utils unzip zip python3

      - name: Install Arm GNU Toolchain 13.2.1
        shell: bash
        run: |
          set -euo pipefail
          release=arm-gnu-toolchain-13.2.Rel1-x86_64-arm-none-eabi
          archive=arm-gnu-toolchain-13.2.rel1-x86_64-arm-none-eabi.tar.xz
          expected=6cd1bbc1d9ae57312bcd169ae283153a9572bd6a8e4eeae2fedfbc33b115fdbb
          url="https://developer.arm.com/-/media/Files/downloads/gnu/13.2.rel1/binrel/$archive"
          mkdir -p "$RUNNER_TEMP/toolchain"
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/toolchain/$archive" "$url"
          printf '%s  %s\n' "$expected" "$RUNNER_TEMP/toolchain/$archive" | sha256sum --check --strict
          tar -xJf "$RUNNER_TEMP/toolchain/$archive" -C "$RUNNER_TEMP/toolchain"
          echo "$RUNNER_TEMP/toolchain/$release/bin" >> "$GITHUB_PATH"

      - name: Prepare 4.0.6 source from verified 4.0.5 baseline
        id: prepare
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/flight-commander-4.0.6"
          patch="$RUNNER_TEMP/flight-commander-firmware-4.0.6.patch"
          rm -rf "$work"
          mkdir -p "$work"
          cat "$GITHUB_WORKSPACE"/scripts/flight-commander-firmware-4.0.6.patch.gz.b64.part-* \
            | base64 --decode \
            | gzip --decompress > "$patch"
          test "$(sha256sum "$patch" | cut -d' ' -f1)" = "9fdc567d3b29f52393d04101b3b4823d9b623a2382b3dd225b625201dce3fd1b"
          unzip -q release/firmware/Flight-Commander-Firmware-Source-v4.0.5.zip -d "$work"
          old="$work/Flight-Commander-Firmware-Source-v4.0.5"
          root="$work/Flight-Commander-Firmware-Source-v4.0.6"
          mv "$old" "$root"
          (cd "$root" && git apply "$patch")
          python3 "$GITHUB_WORKSPACE/scripts/postpatch-flight-commander-firmware-4.0.6.py" "$root"
          python3 "$root/flight-commander/test-compass-orientation-handedness.py"
          python3 - "$root" <<'PY'
          import hashlib, json, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          records = []
          for path in sorted(root.rglob('*')):
              if not path.is_file() or path.name == 'RELEASE-MANIFEST.json':
                  continue
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              records.append(f"{digest}  {path.relative_to(root).as_posix()}\n")
          canonical = ''.join(records).encode()
          revision = hashlib.sha1(canonical).hexdigest()
          tree = hashlib.sha1(b'flight-commander-source-tree-v1\n' + canonical).hexdigest()
          manifest_path = root / 'RELEASE-MANIFEST.json'
          manifest = json.loads(manifest_path.read_text())
          manifest['source_revision'] = revision
          manifest['source_tree'] = tree
          manifest_path.write_text(json.dumps(manifest, indent=2) + '\n')
          print(f'source revision: {revision}')
          print(f'source tree: {tree}')
          PY
          python3 - "$root" <<'PY'
          import importlib.util, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          verifier = root / 'flight-commander/verify-release.py'
          spec = importlib.util.spec_from_file_location('verify_release', verifier)
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          module.verify_source(root)
          print('source contract verified before build')
          PY
          echo "root=$root" >> "$GITHUB_OUTPUT"

      - name: Compile and verify MICOAIR743 firmware
        id: build
        shell: bash
        run: |
          set -euo pipefail
          root='${{ steps.prepare.outputs.root }}'
          build="$RUNNER_TEMP/build-flight-commander-4.0.6"
          source_revision="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["source_revision"])' "$root/RELEASE-MANIFEST.json")"
          source_epoch="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["source_date_epoch"])' "$root/RELEASE-MANIFEST.json")"
          export FLIGHT_COMMANDER_SOURCE_REVISION="$source_revision"
          export SOURCE_DATE_EPOCH="$source_epoch"
          bash "$root/flight-commander/build-micoair743.sh" "$build" | tee "$RUNNER_TEMP/firmware-4.0.6-build.log"
          hex="$build/Flight-Commander-Firmware-4.0.6-MICOAIR743.hex"
          test -s "$hex"
          echo "hex=$hex" >> "$GITHUB_OUTPUT"

      - name: Finalize manifest and deterministic source archive
        id: package
        shell: bash
        run: |
          set -euo pipefail
          root='${{ steps.prepare.outputs.root }}'
          hex='${{ steps.build.outputs.hex }}'
          out="$RUNNER_TEMP/flight-commander-4.0.6-artifacts"
          mkdir -p "$out"
          cp "$hex" "$out/Flight-Commander-Firmware-4.0.6-MICOAIR743.hex"
          python3 - "$root" "$hex" <<'PY'
          import hashlib, json, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          firmware = pathlib.Path(sys.argv[2])
          path = root / 'RELEASE-MANIFEST.json'
          manifest = json.loads(path.read_text())
          manifest['artifact'] = {
              'filename': firmware.name,
              'sha256': hashlib.sha256(firmware.read_bytes()).hexdigest(),
              'bytes': firmware.stat().st_size,
          }
          path.write_text(json.dumps(manifest, indent=2) + '\n')
          PY
          python3 "$root/flight-commander/verify-release.py" \
            --source-root "$root" \
            --hex "$hex" \
            --manifest "$root/RELEASE-MANIFEST.json"
          python3 - "$root" "$out/Flight-Commander-Firmware-Source-v4.0.6.zip" <<'PY'
          import datetime, json, pathlib, stat, sys, zipfile
          root = pathlib.Path(sys.argv[1])
          output = pathlib.Path(sys.argv[2])
          epoch = json.loads((root / 'RELEASE-MANIFEST.json').read_text())['source_date_epoch']
          stamp = datetime.datetime.fromtimestamp(epoch, datetime.timezone.utc)
          stamp = (max(stamp.year, 1980), stamp.month, stamp.day, stamp.hour, stamp.minute, stamp.second)
          prefix = 'Flight-Commander-Firmware-Source-v4.0.6'
          with zipfile.ZipFile(output, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=9) as archive:
              for path in sorted(root.rglob('*')):
                  if not path.is_file():
                      continue
                  info = zipfile.ZipInfo(f'{prefix}/{path.relative_to(root).as_posix()}', stamp)
                  mode = 0o755 if path.stat().st_mode & stat.S_IXUSR else 0o644
                  info.external_attr = (mode & 0xFFFF) << 16
                  info.compress_type = zipfile.ZIP_DEFLATED
                  archive.writestr(info, path.read_bytes(), compress_type=zipfile.ZIP_DEFLATED, compresslevel=9)
          PY
          sha256sum "$out"/*
          echo "out=$out" >> "$GITHUB_OUTPUT"

      - name: Upload firmware candidate
        uses: actions/upload-artifact@v4
        with:
          name: flight-commander-4.0.6-firmware-candidate
          path: |
            ${{ steps.package.outputs.out }}/Flight-Commander-Firmware-4.0.6-MICOAIR743.hex
            ${{ steps.package.outputs.out }}/Flight-Commander-Firmware-Source-v4.0.6.zip
            ${{ runner.temp }}/firmware-4.0.6-build.log
          if-no-files-found: error
          retention-days: 14
