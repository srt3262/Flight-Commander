name: Delete all failed workflow runs

"on":
  push:
    branches:
      - main
    paths:
      - .github/workflows/delete-failed-workflow-runs.yml
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: delete-all-failed-workflow-runs
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Delete every failed workflow run and verify none remain
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          deleted=0
          already_gone=0
          pass=0

          delete_run() {
            local run_id="$1"
            local attempt output_file
            output_file="$RUNNER_TEMP/delete-${run_id}.log"

            for attempt in 1 2 3 4 5 6; do
              if gh api \
                --method DELETE \
                -H 'Accept: application/vnd.github+json' \
                -H 'X-GitHub-Api-Version: 2022-11-28' \
                "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" \
                >"$output_file" 2>&1; then
                deleted=$((deleted + 1))
                return 0
              fi

              if grep -qiE '404|not found' "$output_file"; then
                already_gone=$((already_gone + 1))
                return 0
              fi

              sleep $((attempt * attempt))
            done

            cat "$output_file" >&2
            return 1
          }

          while true; do
            pass=$((pass + 1))
            ids_file="$RUNNER_TEMP/failed-run-ids-${pass}.txt"

            gh api --paginate \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "repos/$GITHUB_REPOSITORY/actions/runs?status=failure&per_page=100" \
              --jq '.workflow_runs[].id' > "$ids_file"

            mapfile -t run_ids < "$ids_file"
            if (( ${#run_ids[@]} == 0 )); then
              break
            fi

            echo "Cleanup pass $pass found ${#run_ids[@]} failed workflow runs."
            for run_id in "${run_ids[@]}"; do
              delete_run "$run_id"
            done

            if (( pass >= 20 )); then
              echo 'Failed workflow runs continued to appear after 20 cleanup passes.' >&2
              exit 1
            fi
            sleep 2
          done

          remaining="$(gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/$GITHUB_REPOSITORY/actions/runs?status=failure&per_page=1" \
            --jq '.total_count')"

          test "$remaining" = 0
          echo "Deleted $deleted failed workflow runs; $already_gone were already absent; verified $remaining remain."
          echo "DELETED_FAILED_RUNS=$deleted" >> "$GITHUB_ENV"
          echo "ALREADY_GONE_FAILED_RUNS=$already_gone" >> "$GITHUB_ENV"
          echo "REMAINING_FAILED_RUNS=$remaining" >> "$GITHUB_ENV"

      - name: Remove this one-time workflow and record the verified result
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/delete-failed-workflow-runs.yml

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m "Delete ${DELETED_FAILED_RUNS} failed workflow runs; verified ${REMAINING_FAILED_RUNS} remain [skip ci]"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
