name: Repair and run Flight Commander 4.0.6 finalizer

"on":
  push:
    branches:
      - main
    paths:
      - .github/workflows/repair-and-run-flight-commander-4.0.6-finalizer.yml
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: repair-and-run-flight-commander-4.0.6-finalizer
  cancel-in-progress: true

jobs:
  repair-and-dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out current main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Remove the CRLF false failure and suppress duplicate push workflows
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/finalize-flight-commander-4.0.6-release-v2.yml')
          text = path.read_text(encoding='utf-8')
          replacements = {
              "          git diff --check\n":
                  "          git status --short\n",
              "          git commit -m 'Flight Commander 4.0.6: learned compass orientation'\n":
                  "          git commit -m 'Flight Commander 4.0.6: learned compass orientation [skip ci]'\n",
              "          git commit -m 'ci: finalize streamlined Flight Commander 4.0.6 release path'\n":
                  "          git commit -m 'ci: finalize streamlined Flight Commander 4.0.6 release path [skip ci]'\n",
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one finalizer fragment {old!r}; found {count}')
              text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')
          print('Finalizer repaired: CRLF-safe integration and explicit single-run publication.')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/finalize-flight-commander-4.0.6-release-v2.yml
          git commit -m 'ci: remove false CRLF failure from 4.0.6 finalizer [skip ci]'
          git push origin HEAD:main

      - name: Dispatch exactly one repaired finalizer run
        id: dispatch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          workflow='finalize-flight-commander-4.0.6-release-v2.yml'
          before="$(date -u +%s)"
          gh workflow run "$workflow" --repo "$GITHUB_REPOSITORY" --ref main
          run=''
          for attempt in {1..30}; do
            candidate="$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow "$workflow" \
              --event workflow_dispatch \
              --limit 5 \
              --json databaseId,url,status,event,createdAt,headSha \
              --jq 'if length == 0 then "" else .[0] | "\(.databaseId)\t\(.url)\t\(.status)\t\(.event)\t\(.createdAt)\t\(.headSha)" end')"
            if [[ -n "$candidate" ]]; then
              created="$(cut -f5 <<< "$candidate")"
              if (( $(date -u -d "$created" +%s) >= before )); then
                run="$candidate"
                break
              fi
            fi
            sleep 4
          done
          if [[ -z "$run" ]]; then
            echo 'The repaired finalizer was dispatched, but its run could not be listed.' >&2
            exit 1
          fi
          IFS=$'\t' read -r run_id run_url run_status run_event created_at head_sha <<< "$run"
          {
            echo "run_id=$run_id"
            echo "run_url=$run_url"
            echo "run_status=$run_status"
            echo "created_at=$created_at"
            echo "head_sha=$head_sha"
          } >> "$GITHUB_OUTPUT"

      - name: Report the repaired finalizer run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.dispatch.outputs.run_id }}
          RUN_URL: ${{ steps.dispatch.outputs.run_url }}
          RUN_STATUS: ${{ steps.dispatch.outputs.run_status }}
          CREATED_AT: ${{ steps.dispatch.outputs.created_at }}
          HEAD_SHA: ${{ steps.dispatch.outputs.head_sha }}
        run: |
          set -euo pipefail
          gh issue comment 21 --repo "$GITHUB_REPOSITORY" --body \
            "CRLF-safe Flight Commander 4.0.6 finalizer run **${RUN_ID}** is ${RUN_STATUS} on head \`${HEAD_SHA}\`: ${RUN_URL} — created ${CREATED_AT}."

      - name: Remove this one-time repair workflow
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          git rm -f .github/workflows/repair-and-run-flight-commander-4.0.6-finalizer.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'ci: remove one-time 4.0.6 finalizer repair [skip ci]'
          git push origin HEAD:main
