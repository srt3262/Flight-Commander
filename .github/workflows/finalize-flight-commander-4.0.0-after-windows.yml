name: Finalize Flight Commander 4.0.0 after Windows validation

"on":
  workflow_run:
    workflows:
      - Package Flight Commander 4.0.0 Windows bench-test bundle
    types:
      - completed

permissions:
  actions: read
  contents: write

concurrency:
  group: finalize-flight-commander-4.0.0
  cancel-in-progress: false

jobs:
  finalize:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'develop/4.0.0-holybro-moving-baseline'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop/4.0.0-holybro-moving-baseline
          fetch-depth: 1

      - name: Download and verify the successful Windows bench-test artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          WINDOWS_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          artifact_dir="$RUNNER_TEMP/windows-bench-test"
          mkdir -p "$artifact_dir"
          gh run download "$WINDOWS_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name flight-commander-4.0.0-windows-bench-test \
            --dir "$artifact_dir"

          test -f "$artifact_dir/Flight-Commander-v4.0.0-Bench-Test.zip"
          test -f "$artifact_dir/COMPLETE-BUNDLE-SHA256.txt"
          expected="$(awk '{print $1}' "$artifact_dir/COMPLETE-BUNDLE-SHA256.txt")"
          actual="$(sha256sum "$artifact_dir/Flight-Commander-v4.0.0-Bench-Test.zip" | awk '{print $1}')"
          test "$actual" = "$expected"

          unzip -l "$artifact_dir/Flight-Commander-v4.0.0-Bench-Test.zip" \
            > "$RUNNER_TEMP/windows-bench-test-contents.txt"
          for required in \
            FC-Windows-v4.0.0.zip \
            FC-Configurator-Source-v4.0.0.zip \
            FC-Firmware-v4.0.0-MICOAIR743.hex \
            FC-Firmware-Source-v4.0.0.zip \
            SHA256SUMS.txt; do
            grep -q "$required" "$RUNNER_TEMP/windows-bench-test-contents.txt"
          done

          printf '%s\n' "$actual" > "$RUNNER_TEMP/windows-complete-sha256.txt"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Remove development-only inspection and transient build files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf \
            firmware-inspection \
            .github/workflows/inspect-firmware-4.0.0.yml
          rm -f \
            .github/workflows/apply-flight-commander-4.0.0.yml \
            .github/workflows/build-flight-commander-firmware-4.0.0.yml \
            scripts/apply-flight-commander-4.0.0.py \
            firmware-source-inventory-3.0.7.txt \
            configurator-4.0.0-apply.log \
            configurator-4.0.0-apply.status \
            firmware-4.0.0-build.log \
            firmware-4.0.0-build.status \
            firmware-4.0.0-tests.status \
            firmware-4.0.0-build-metadata.json \
            windows-4.0.0-package.status

      - name: Verify exact artifact and source metadata
        shell: bash
        run: |
          set -euo pipefail
          node scripts/check-flight-commander-version.mjs
          test "$(node -p "require('./package.json').version")" = '4.0.0'
          test "$(node -p "require('./package.json').flightCommander.firmwareReleaseVersion")" = '4.0.0'
          test -f release/firmware/Flight-Commander-Firmware-4.0.0-MICOAIR743.hex
          test -f release/firmware/Flight-Commander-Firmware-Source-v4.0.0.zip
          test -f firmware-baseline/Flight-Commander-Firmware-Source-v3.0.7.zip
          test ! -e release/firmware/Flight-Commander-Firmware-3.0.7-MICOAIR743.hex
          test ! -e release/firmware/Flight-Commander-Firmware-Source-v3.0.7.zip

          firmware_expected="$(node -p "require('./package.json').flightCommander.firmwareReleaseSha256")"
          firmware_actual="$(sha256sum release/firmware/Flight-Commander-Firmware-4.0.0-MICOAIR743.hex | awk '{print $1}')"
          source_expected="$(node -p "require('./package.json').flightCommander.firmwareSourceSha256")"
          source_actual="$(sha256sum release/firmware/Flight-Commander-Firmware-Source-v4.0.0.zip | awk '{print $1}')"
          test "$firmware_actual" = "$firmware_expected"
          test "$source_actual" = "$source_expected"

      - name: Run the complete clean source test suite
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          yarn install --frozen-lockfile
          yarn test | tee flight-commander-4.0.0-final-tests.log
          grep -Eq '# pass [0-9]+' flight-commander-4.0.0-final-tests.log
          grep -q '# fail 0' flight-commander-4.0.0-final-tests.log

      - name: Record final validation manifest
        shell: bash
        env:
          WINDOWS_RUN_ID: ${{ github.event.workflow_run.id }}
          WINDOWS_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/windows-complete-sha256.txt" <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          import sys
          from pathlib import Path

          package = json.loads(Path('package.json').read_text(encoding='utf-8'))
          fc = package['flightCommander']
          test_output = Path('flight-commander-4.0.0-final-tests.log').read_text(encoding='utf-8')
          pass_line = next(
              (line.strip() for line in reversed(test_output.splitlines()) if line.startswith('# pass ')),
              '# pass unknown',
          )
          manifest = {
              'schema': 1,
              'product': 'Flight Commander',
              'version': '4.0.0',
              'branch': 'develop/4.0.0-holybro-moving-baseline',
              'validated_commit_before_cleanup': os.environ['WINDOWS_HEAD_SHA'],
              'windows_workflow_run_id': int(os.environ['WINDOWS_RUN_ID']),
              'windows_complete_bundle_sha256': Path(sys.argv[1]).read_text(encoding='utf-8').strip(),
              'firmware_sha256': fc['firmwareReleaseSha256'],
              'firmware_source_sha256': fc['firmwareSourceSha256'],
              'firmware_source_revision': fc['firmwareSourceRevision'],
              'firmware_source_tree': fc['firmwareSourceTree'],
              'source_test_result': pass_line,
              'source_test_failures': 0,
              'hardware_bench_validation': 'required',
              'release_published': False,
          }
          Path('FLIGHT-COMMANDER-4.0.0-VALIDATION.json').write_text(
              json.dumps(manifest, indent=2) + '\n',
              encoding='utf-8',
          )
          PY
          cp "$RUNNER_TEMP/windows-bench-test-contents.txt" \
            FLIGHT-COMMANDER-4.0.0-BUNDLE-CONTENTS.txt
          cp "$RUNNER_TEMP/windows-complete-sha256.txt" \
            windows-4.0.0-package.sha256
          rm -f flight-commander-4.0.0-final-tests.log
          rm .github/workflows/finalize-flight-commander-4.0.0-after-windows.yml

      - name: Commit the clean validated 4.0.0 development branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Finalize validated Flight Commander 4.0.0 development baseline'
          git push origin HEAD:develop/4.0.0-holybro-moving-baseline
