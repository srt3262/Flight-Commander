name: Diagnose Flight Commander 4.0.8 tests

"on":
  workflow_dispatch:
  push:
    branches:
      - agent/fix-4.0.6-imu-handedness
    paths:
      - .github/workflows/diagnose-flight-commander-4.0.8.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: yarn.lock
      - name: Enable pinned Yarn
        run: |
          corepack enable
          yarn --version
      - name: Install dependencies
        run: yarn install --frozen-lockfile --non-interactive
      - name: Run tests and extract concise failures
        id: tests
        shell: bash
        run: |
          set +e
          yarn test > full-test.log 2>&1
          status=$?
          python3 - "$status" <<'PY'
          import re
          import sys
          from pathlib import Path

          status = int(sys.argv[1])
          lines = Path('full-test.log').read_text(encoding='utf-8', errors='replace').splitlines()
          selected = []
          for index, line in enumerate(lines):
              if re.search(r'(^|\s)not ok\b|AssertionError|ERR_ASSERTION|SyntaxError|ReferenceError|TypeError|RangeError|error:', line):
                  start = max(0, index - 12)
                  end = min(len(lines), index + 30)
                  block = lines[start:end]
                  if block not in selected:
                      selected.append(block)
          output = [f'yarn test exit status: {status}', '']
          for number, block in enumerate(selected[:20], 1):
              output.append(f'===== FAILURE CONTEXT {number} =====')
              output.extend(block)
              output.append('')
          if len(output) == 2:
              output.extend(lines[-200:])
          Path('ci-failure-summary.txt').write_text('\n'.join(output), encoding='utf-8')
          PY
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: flight-commander-4.0.8-test-failures
          retention-days: 1
          if-no-files-found: error
          path: ci-failure-summary.txt
      - name: Fail after preserving diagnostics
        if: steps.tests.outputs.status != '0'
        run: exit 1
