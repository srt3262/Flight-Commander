name: Publish Flight Commander 4.1.2

"on":
  push:
    branches:
      - main
    paths:
      - release/notes/v4.1.2.md

permissions:
  actions: write
  contents: write

concurrency:
  group: publish-flight-commander-4.1.2
  cancel-in-progress: false

jobs:
  dispatch-and-verify:
    name: Dispatch verified publisher and confirm release
    if: github.event.head_commit.message == 'Publish Flight Commander 4.1.2 release'
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out exact publication commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Validate publication identity
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(node -p "require('./package.json').version")" = '4.1.2'
          test "$(node -p "require('./package.json').flightCommander.firmwareReleaseVersion")" = '4.0.8'
          test "$(node -p "require('./package.json').flightCommander.firmwareChangedInRelease")" = 'false'
          test -f release/notes/v4.1.2.md

      - name: Dispatch the established checksum-guarded release workflow
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST \
            "repos/$GITHUB_REPOSITORY/actions/workflows/release.yml/dispatches" \
            -f ref=main \
            -f "inputs[expected_sha]=$GITHUB_SHA"

      - name: Wait for publication and apply the maintained release notes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag='v4.1.2'
          published=false
          for attempt in $(seq 1 180); do
            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              published=true
              break
            fi
            echo "Waiting for $tag publication (attempt $attempt of 180)..."
            sleep 30
          done
          if [ "$published" != true ]; then
            echo "Timed out waiting for $tag." >&2
            exit 1
          fi

          tag_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq '.object.sha')
          test "$tag_sha" = "$GITHUB_SHA"

          mapfile -t assets < <(
            gh release view "$tag" --repo "$GITHUB_REPOSITORY" \
              --json assets --jq '.assets[].name' | sort
          )
          test "${#assets[@]}" -eq 2
          test "${assets[0]}" = 'Flight-Commander-Firmware-4.0.8-MICOAIR743.hex'
          test "${assets[1]}" = 'Flight-Commander-v4.1.2.zip'

          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" \
            --title 'Flight Commander 4.1.2' \
            --notes-file release/notes/v4.1.2.md

          gh release view "$tag" --repo "$GITHUB_REPOSITORY" \
            --json tagName,name,isDraft,isPrerelease,assets,url
