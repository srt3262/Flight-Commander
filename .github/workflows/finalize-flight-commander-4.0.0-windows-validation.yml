name: Finalize Flight Commander 4.0.0 Windows validation

"on":
  push:
    branches:
      - develop/4.0.0-holybro-moving-baseline
    paths:
      - .github/workflows/finalize-flight-commander-4.0.0-windows-validation.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop/4.0.0-holybro-moving-baseline
          fetch-depth: 1
      - name: Finalize the Windows validation workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/pr-package-flight-commander-4.0.0-windows.yml')
          text = path.read_text(encoding='utf-8')
          text = text.replace('permissions:\n  contents: read\n', 'permissions:\n  contents: write\n', 1)

          # Correct any remaining Unix-style line continuations in PowerShell.
          text = text.replace(
              '''          Copy-Item \\
            (Join-Path $PWD "release/firmware/Flight-Commander-Firmware-$version-MICOAIR743.hex") \\
            (Join-Path $components "FC-Firmware-v$version-MICOAIR743.hex")
''',
              '''          Copy-Item -Path (Join-Path $PWD "release/firmware/Flight-Commander-Firmware-$version-MICOAIR743.hex") -Destination (Join-Path $components "FC-Firmware-v$version-MICOAIR743.hex")
''',
          )
          text = text.replace(
              '''          Copy-Item \\
            (Join-Path $PWD "release/firmware/Flight-Commander-Firmware-Source-v$version.zip") \\
            (Join-Path $components "FC-Firmware-Source-v$version.zip")
''',
              '''          Copy-Item -Path (Join-Path $PWD "release/firmware/Flight-Commander-Firmware-Source-v$version.zip") -Destination (Join-Path $components "FC-Firmware-Source-v$version.zip")
''',
          )

          anchor = '''      - name: Upload the verified Windows and four-component bundle
        uses: actions/upload-artifact@v4
'''
          record = '''      - name: Record the verified Windows bundle hashes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Copy-Item -Path (Join-Path $PWD 'bench-test-bundle/COMPLETE-BUNDLE-SHA256.txt') -Destination (Join-Path $PWD 'windows-4.0.0-package.sha256') -Force
          'PASS' | Set-Content -Path (Join-Path $PWD 'windows-4.0.0-package.status') -Encoding ascii
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add windows-4.0.0-package.status windows-4.0.0-package.sha256
          if (-not (git diff --cached --quiet)) {
            git commit -m 'Record verified Flight Commander 4.0.0 Windows bundle'
            git push origin HEAD:develop/4.0.0-holybro-moving-baseline
          }

'''
          if record not in text:
              if anchor not in text:
                  raise SystemExit('Windows artifact upload anchor was not found')
              text = text.replace(anchor, record + anchor, 1)
          path.write_text(text, encoding='utf-8')
          PY
          rm .github/workflows/finalize-flight-commander-4.0.0-windows-validation.yml
      - name: Commit finalized Windows validation workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Finalize Flight Commander 4.0.0 Windows package validation'
          git push origin HEAD:develop/4.0.0-holybro-moving-baseline
