name: Apply Ground Control live diagnostics fix

"on":
  push:
    branches:
      - agent/fix-4.0.8-ui-regressions
    paths:
      - .github/workflows/apply-gcs-live-diagnostics-fix.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the regression-fix branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: agent/fix-4.0.8-ui-regressions
          fetch-depth: 0

      - name: Keep the log available and add MAVLink link-health diagnostics
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str, label: str) -> None:
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one {label} block, found {count}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          flight_data = Path('tabs/flight_data.js')
          text = flight_data.read_text(encoding='utf-8')
          start = text.index('flightData.suspendGlobalLog = function () {')
          end = text.index('flightData.initialize = function (callback) {', start)
          replacement = '''flightData.suspendGlobalLog = function () {
            // Ground Control must never hide the only live serial/MAVLink
            // diagnostic surface. Preserve the operator's current log state
            // and make the normal Show/Hide Log control available.
            if (this.globalLogGuard) {
              document.querySelector('#showlog')?.removeEventListener(
                'click',
                this.globalLogGuard,
                true,
              );
            }
            this.globalLogWasOpen = false;
            this.globalLogGuard = null;
            $('#showlog')
              .prop('disabled', false)
              .removeClass('fc-ground-control-locked')
              .removeAttr('aria-disabled')
              .removeAttr('title');
          };

          flightData.restoreGlobalLog = function () {
            this.suspendGlobalLog();
          };

          '''
          flight_data.write_text(text[:start] + replacement + text[end:], encoding='utf-8')

          session = Path('js/mavlink/mavlinkSession.js')
          replace_once(
              session,
              '''    this.lastDiscoveryErrors = new Map();
              this.discoveryHeartbeatInFlight = false;

              if (this.firmwareFamilyOverride != null) {''',
              '''    this.lastDiscoveryErrors = new Map();
              this.discoveryHeartbeatInFlight = false;
              this.receivedByteCount = 0;
              this.decodedFrameCount = 0;
              this.lastSerialByteAt = 0;
              this.lastDecodedFrameAt = 0;
              this.lastDecodedMessageName = null;

              if (this.firmwareFamilyOverride != null) {''',
              'constructor diagnostics',
          )
          replace_once(
              session,
              '''    this.lastDiscoveryErrors.clear();
              this.discoveryHeartbeatInFlight = false;
              const attachment = this.activeAttachment("receiving MAVLink data");''',
              '''    this.lastDiscoveryErrors.clear();
              this.discoveryHeartbeatInFlight = false;
              this.receivedByteCount = 0;
              this.decodedFrameCount = 0;
              this.lastSerialByteAt = 0;
              this.lastDecodedFrameAt = 0;
              this.lastDecodedMessageName = null;
              const attachment = this.activeAttachment("receiving MAVLink data");''',
              'attachment diagnostics reset',
          )
          replace_once(
              session,
              '''    if (event?.data != null && this.attachmentIsCurrent(activeAttachment)) {
                if (!this.reportedReceiveBytes) {
                  const byteLength =
                    Number(event.data?.byteLength) ||
                    Number(event.data?.length) ||
                    0;
                  this.reportedReceiveBytes = true;
                  this.emit("transportDiagnostic", {
                    stage: "serial-bytes-received",
                    byteLength,
                    generation: activeAttachment.generation,
                  });
                }
                this.bridge?.mavlinkFeed?.(event.data, activeAttachment.generation);
              }''',
              '''    if (event?.data != null && this.attachmentIsCurrent(activeAttachment)) {
                const byteLength =
                  Number(event.data?.byteLength) ||
                  Number(event.data?.length) ||
                  0;
                this.receivedByteCount += byteLength;
                this.lastSerialByteAt = this.now();
                if (!this.reportedReceiveBytes) {
                  this.reportedReceiveBytes = true;
                  this.emit("transportDiagnostic", {
                    stage: "serial-bytes-received",
                    byteLength,
                    generation: activeAttachment.generation,
                  });
                }
                this.bridge?.mavlinkFeed?.(event.data, activeAttachment.generation);
              }''',
              'serial receive accounting',
          )
          replace_once(
              session,
              '''    const envelope = normalizeMavlinkEnvelope(frame);
              const { messageName, data, header } = envelope;
              if (!this.reportedValidFrame) {''',
              '''    const envelope = normalizeMavlinkEnvelope(frame);
              const { messageName, data, header } = envelope;
              this.decodedFrameCount += 1;
              this.lastDecodedFrameAt = this.now();
              this.lastDecodedMessageName = messageName;
              if (!this.reportedValidFrame) {''',
              'decoded frame accounting',
          )
          replace_once(
              session,
              '''  checkHeartbeat() {
              if (!this.state.connected || !this.state.lastHeartbeatAt) return;
              if (
                this.now() - this.state.lastHeartbeatAt <= this.heartbeatTimeoutMs ||
                this.state.linkLost
              )
                return;
              this.state.linkLost = true;
              this.emit("linkLost", this.snapshot());
              this.emit("state", this.snapshot());
            }''',
              '''  checkHeartbeat() {
              if (!this.state.connected || !this.state.lastHeartbeatAt) return;
              const now = this.now();
              if (
                now - this.state.lastHeartbeatAt <= this.heartbeatTimeoutMs ||
                this.state.linkLost
              )
                return;
              this.state.linkLost = true;
              this.emit("transportDiagnostic", {
                stage: "vehicle-heartbeat-timeout",
                generation: this.attachmentGeneration,
                millisecondsSinceHeartbeat: now - this.state.lastHeartbeatAt,
                millisecondsSinceSerialByte:
                  this.lastSerialByteAt > 0 ? now - this.lastSerialByteAt : null,
                millisecondsSinceValidFrame:
                  this.lastDecodedFrameAt > 0 ? now - this.lastDecodedFrameAt : null,
                receivedByteCount: this.receivedByteCount,
                decodedFrameCount: this.decodedFrameCount,
                lastMessageName: this.lastDecodedMessageName,
              });
              this.emit("linkLost", this.snapshot());
              this.emit("state", this.snapshot());
            }''',
              'heartbeat timeout diagnostics',
          )
          replace_once(
              session,
              '''    const firstConnection = !this.state.connected;
              if (firstConnection) {''',
              '''    const firstConnection = !this.state.connected;
              const linkWasLost = this.state.linkLost;
              if (firstConnection) {''',
              'heartbeat restoration state',
          )
          replace_once(
              session,
              '''    this.state.systemStatus =
                numeric(field(data, "systemStatus", "system_status")) ?? 0;

              if (firstConnection) {''',
              '''    this.state.systemStatus =
                numeric(field(data, "systemStatus", "system_status")) ?? 0;

              if (linkWasLost) {
                this.emit("transportDiagnostic", {
                  stage: "vehicle-heartbeat-restored",
                  generation: this.attachmentGeneration,
                  receivedByteCount: this.receivedByteCount,
                  decodedFrameCount: this.decodedFrameCount,
                  lastMessageName: this.lastDecodedMessageName,
                });
              }

              if (firstConnection) {''',
              'heartbeat restoration diagnostic',
          )

          backend = Path('js/serial_backend.js')
          replace_once(
              backend,
              '''            case 'valid-frame-decoded':
                          GUI.log(
                              `Valid ${diagnostic.protocol || 'MAVLink'} ` +
                              `${diagnostic.messageName} frame decoded.`,
                          );
                          break;
                      default:''',
              '''            case 'valid-frame-decoded':
                          GUI.log(
                              `Valid ${diagnostic.protocol || 'MAVLink'} ` +
                              `${diagnostic.messageName} frame decoded.`,
                          );
                          break;
                      case 'vehicle-heartbeat-timeout': {
                          const serialAge = diagnostic.millisecondsSinceSerialByte;
                          const frameAge = diagnostic.millisecondsSinceValidFrame;
                          const serialStatus = serialAge == null
                              ? 'no inbound serial bytes were received'
                              : serialAge <= 1500
                                  ? `inbound serial bytes are still arriving (${serialAge} ms ago)`
                                  : `last inbound serial bytes arrived ${serialAge} ms ago`;
                          const frameStatus = frameAge == null
                              ? 'no valid MAVLink frame was decoded'
                              : frameAge <= 1500
                                  ? `valid frames are still decoding (${frameAge} ms ago)`
                                  : `last valid frame decoded ${frameAge} ms ago`;
                          const lastMessage = $('<div>')
                              .text(diagnostic.lastMessageName || 'none')
                              .html();
                          GUI.log(
                              `<span style="color: #d98f00">Vehicle heartbeat timed out ` +
                              `after ${diagnostic.millisecondsSinceHeartbeat} ms; ${serialStatus}; ` +
                              `${frameStatus}; ${diagnostic.receivedByteCount} inbound bytes, ` +
                              `${diagnostic.decodedFrameCount} decoded frames, last message ` +
                              `${lastMessage}.</span>`,
                          );
                          break;
                      }
                      case 'vehicle-heartbeat-restored':
                          GUI.log(
                              `MAVLink vehicle heartbeat restored after link loss ` +
                              `(${diagnostic.receivedByteCount} inbound bytes, ` +
                              `${diagnostic.decodedFrameCount} decoded frames).`,
                          );
                          break;
                      default:''',
              'transport health log cases',
          )

          test_path = Path('tests/flight-commander/gcs/mavlink-live-diagnostics.test.mjs')
          test_path.write_text('''import assert from "node:assert/strict";
          import { readFileSync } from "node:fs";
          import { dirname, resolve } from "node:path";
          import test from "node:test";
          import { fileURLToPath } from "node:url";

          const root = resolve(dirname(fileURLToPath(import.meta.url)), "../../..");
          const flightData = readFileSync(resolve(root, "tabs/flight_data.js"), "utf8");
          const session = readFileSync(resolve(root, "js/mavlink/mavlinkSession.js"), "utf8");
          const backend = readFileSync(resolve(root, "js/serial_backend.js"), "utf8");

          test("Ground Control leaves the global diagnostics log operator-controlled", () => {
            const start = flightData.indexOf("flightData.suspendGlobalLog = function () {");
            const end = flightData.indexOf("flightData.initialize = function (callback) {", start);
            assert.ok(start >= 0 && end > start);
            const block = flightData.slice(start, end);
            assert.doesNotMatch(block, /trigger\\('click'\\)/);
            assert.doesNotMatch(block, /addEventListener\\(/);
            assert.doesNotMatch(block, /stopImmediatePropagation/);
            assert.match(block, /prop\\('disabled', false\\)/);
            assert.match(block, /removeClass\\('fc-ground-control-locked'\\)/);
          });

          test("MAVLink timeout diagnostics distinguish bytes, frames, and heartbeats", () => {
            assert.match(session, /stage: "vehicle-heartbeat-timeout"/);
            assert.match(session, /millisecondsSinceSerialByte/);
            assert.match(session, /millisecondsSinceValidFrame/);
            assert.match(session, /receivedByteCount/);
            assert.match(session, /decodedFrameCount/);
            assert.match(session, /stage: "vehicle-heartbeat-restored"/);
            assert.match(backend, /case 'vehicle-heartbeat-timeout'/);
            assert.match(backend, /inbound serial bytes are still arriving/);
            assert.match(backend, /case 'vehicle-heartbeat-restored'/);
          });
          ''', encoding='utf-8')
          PY

      - name: Run focused source and syntax checks
        shell: bash
        run: |
          set -euo pipefail
          node --check tabs/flight_data.js
          node --check js/mavlink/mavlinkSession.js
          node --check js/serial_backend.js
          node --test tests/flight-commander/gcs/mavlink-live-diagnostics.test.mjs

      - name: Commit the verified fix and remove this one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/apply-gcs-live-diagnostics-fix.yml
          git add tabs/flight_data.js js/mavlink/mavlinkSession.js js/serial_backend.js \
            tests/flight-commander/gcs/mavlink-live-diagnostics.test.mjs \
            .github/workflows/apply-gcs-live-diagnostics-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Keep Ground Control diagnostics available [skip ci]'
          git push origin HEAD:agent/fix-4.0.8-ui-regressions
