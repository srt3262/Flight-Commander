name: One-time prepare Flight Commander 4.1.3

"on":
  push:
    branches:
      - fix/flight-commander-4.1.3-gcs-flasher
    paths:
      - .github/workflows/one-time-prepare-flight-commander-4.1.3.yml
      - scripts/internal/flight-commander-4.1.3-transform.b64.part00
      - scripts/internal/flight-commander-4.1.3-transform.b64.part01
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: one-time-prepare-flight-commander-4.1.3
  cancel-in-progress: false

jobs:
  transform:
    name: Transform and test 4.1.3 branch
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out transformation branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: fix/flight-commander-4.1.3-gcs-flasher
          fetch-depth: 0
          persist-credentials: true

      - name: Decode and apply the 4.1.3 transformation
        shell: bash
        run: |
          set -euo pipefail
          if grep -q '"version": "4.1.3"' package.json; then
            echo 'Flight Commander 4.1.3 transformation is already present.'
            exit 0
          fi
          transform_path=scripts/prepare-flight-commander-4.1.3.py
          cat \
            scripts/internal/flight-commander-4.1.3-transform.b64.part00 \
            scripts/internal/flight-commander-4.1.3-transform.b64.part01 \
            | tr -d '\r\n' \
            | base64 --decode \
            | gzip --decompress \
            > "$transform_path"
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/prepare-flight-commander-4.1.3.py')
          text = path.read_text(encoding='utf-8')
          old = 'updated, count = re.subn(pattern, replacement, text, count=1, flags=flags)'
          new = 'updated, count = re.subn(pattern, lambda _match: replacement, text, count=1, flags=flags)'
          if old not in text:
              raise SystemExit('regex replacement helper marker was not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          python3 -m py_compile "$transform_path"
          python3 "$transform_path"
          rm -f "$transform_path"

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Install and run source tests
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare yarn@1.22.22 --activate
          yarn install --frozen-lockfile --non-interactive
          yarn test

      - name: Commit the tested transformation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- ':!.github/workflows/one-time-prepare-flight-commander-4.1.3.yml' ':!.github/workflows/one-time-inspect-flight-commander-4.0.8-mavlink.yml' ':!scripts/internal/flight-commander-4.1.3-transform.b64.part00' ':!scripts/internal/flight-commander-4.1.3-transform.b64.part01'
          if git diff --cached --quiet; then
            echo 'No uncommitted source transformation remains.'
            exit 0
          fi
          git commit -m "Prepare Flight Commander 4.1.3 GCS and flasher fixes"
          git push origin HEAD:fix/flight-commander-4.1.3-gcs-flasher
