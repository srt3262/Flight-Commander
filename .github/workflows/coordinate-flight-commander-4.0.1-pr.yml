name: Coordinate Flight Commander 4.0.1 release tree

"on":
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/coordinate-flight-commander-4.0.1-pr.yml
      - scripts/coordinate-flight-commander-4.0.1-release-tree.py

permissions:
  contents: write
  actions: read

jobs:
  coordinate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Download strictly verified 4.0.1 firmware payload
        uses: actions/download-artifact@v4
        with:
          name: flight-commander-4.0.1-firmware-payload
          path: ${{ runner.temp }}/firmware-payload
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 31014386005

      - name: Coordinate the complete release tree
        shell: bash
        run: python3 scripts/coordinate-flight-commander-4.0.1-release-tree.py --payload "${{ runner.temp }}/firmware-payload"

      - name: Commit coordinated release tree to the PR branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --stat
          git commit -m 'Prepare Flight Commander 4.0.1 release tree'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
