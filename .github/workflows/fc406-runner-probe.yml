name: Flight Commander 4.0.6 runner probe

"on":
  push:
    branches:
      - agent/4.0.6-compass-orientation
    paths:
      - .github/workflows/fc406-runner-probe.yml

permissions:
  contents: read

jobs:
  linux-slim:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - run: echo "ubuntu-slim available"

  windows-current:
    runs-on: windows-2025
    timeout-minutes: 5
    steps:
      - run: Write-Output "windows-2025 available"
