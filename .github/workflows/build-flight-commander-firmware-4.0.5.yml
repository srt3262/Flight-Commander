name: Build Flight Commander Firmware 4.0.5
run-name: Build and verify Flight Commander 4.0.5 from ${{ github.sha }}

"on":
  push:
    branches:
      - agent/release-flight-commander-4.0.5
    paths:
      - .github/workflows/build-flight-commander-firmware-4.0.5.yml
      - release/patches/4.0.5/**
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: flight-commander-4.0.5-firmware-build
  cancel-in-progress: false

jobs:
  build:
    name: Compile, verify and retain coordinated 4.0.5 release inputs
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out the exact development branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: agent/release-flight-commander-4.0.5
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install native build prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build curl xz-utils unzip zip python3

      - name: Restore Arm GNU Toolchain 13.2.1
        id: arm-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/arm-gnu-toolchain-13.2.Rel1-x86_64-arm-none-eabi
          key: arm-gnu-toolchain-13.2.Rel1-x86_64-arm-none-eabi

      - name: Install Arm GNU Toolchain 13.2.1
        if: steps.arm-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          release=arm-gnu-toolchain-13.2.Rel1-x86_64-arm-none-eabi
          archive=arm-gnu-toolchain-13.2.rel1-x86_64-arm-none-eabi.tar.xz
          expected=6cd1bbc1d9ae57312bcd169ae283153a9572bd6a8e4eeae2fedfbc33b115fdbb
          url="https://developer.arm.com/-/media/Files/downloads/gnu/13.2.rel1/binrel/$archive"
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/$archive" "$url"
          printf '%s  %s\n' "$expected" "$RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xJf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP"
          test -x "$RUNNER_TEMP/$release/bin/arm-none-eabi-gcc"

      - name: Add the verified compiler to PATH
        shell: bash
        run: |
          set -euo pipefail
          toolchain="$RUNNER_TEMP/arm-gnu-toolchain-13.2.Rel1-x86_64-arm-none-eabi/bin"
          test -x "$toolchain/arm-none-eabi-gcc"
          echo "$toolchain" >> "$GITHUB_PATH"

      - name: Reconstruct and verify every reviewed build input
        shell: bash
        run: |
          set -euo pipefail
          cat release/patches/4.0.4/firmware.patch.part-* > "$RUNNER_TEMP/firmware-4.0.4.patch"
          cat release/patches/4.0.4/prepare.py.part-* > "$RUNNER_TEMP/prepare-4.0.4.py"
          cat release/patches/4.0.5/prepare.py.part-* > "$RUNNER_TEMP/prepare-4.0.5.py"
          cat release/patches/4.0.5/apply.py.part-* > "$RUNNER_TEMP/apply-4.0.5.py"

          printf '%s  %s\n' bb0ddd325ec139b901544511d6efda53bf87264775f562db2015f0d6f8dc6c8b "$RUNNER_TEMP/firmware-4.0.4.patch" | sha256sum --check --strict
          printf '%s  %s\n' 548583a05168e5dcb7d45ad21c4e91ef3ca69e46087f57e087f0e6a6a5a768e9 "$RUNNER_TEMP/prepare-4.0.4.py" | sha256sum --check --strict
          printf '%s  %s\n' dee87c3c349a597dfab79621ad4a9d35869bb9f7f3873876fb46a38ce82aeb9a release/patches/4.0.4/firmware-compile-fix.patch | sha256sum --check --strict
          printf '%s  %s\n' dbf6d2b6cba2a24c9ae24d39cd32d36ed22152b3cbfc2d453d391d4d596a3b23 "$RUNNER_TEMP/prepare-4.0.5.py" | sha256sum --check --strict
          printf '%s  %s\n' 7322fcc6d2d768a7eb9293f363aefd78f3e7f9f95e21219bf08126a8655614bd "$RUNNER_TEMP/apply-4.0.5.py" | sha256sum --check --strict
          python3 -B -m py_compile "$RUNNER_TEMP/prepare-4.0.4.py" "$RUNNER_TEMP/prepare-4.0.5.py" "$RUNNER_TEMP/apply-4.0.5.py"

      - name: Prepare, compile, finalize and apply Flight Commander 4.0.5
        id: firmware
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/flight-commander-firmware-4.0.4"
          root404="$output/Flight-Commander-Firmware-Source-v4.0.4"
          root405="$output/Flight-Commander-Firmware-Source-v4.0.5"
          build="$RUNNER_TEMP/build-flight-commander-4.0.5"
          hex="$build/Flight-Commander-Firmware-4.0.5-MICOAIR743.hex"
          source_zip="$RUNNER_TEMP/Flight-Commander-Firmware-Source-v4.0.5.zip"

          python3 -B "$RUNNER_TEMP/prepare-4.0.4.py" \
            --archive release/firmware/Flight-Commander-Firmware-Source-v4.0.3.zip \
            --output "$output" \
            --patch "$RUNNER_TEMP/firmware-4.0.4.patch" \
            --compile-fix-patch release/patches/4.0.4/firmware-compile-fix.patch
          test -d "$root404"

          python3 -B "$RUNNER_TEMP/prepare-4.0.5.py" \
            --prepared-4.0.4-root "$root404"
          test -d "$root405"

          echo "Compiler: $(arm-none-eabi-gcc -dumpfullversion -dumpversion)"
          bash "$root405/flight-commander/build-micoair743.sh" "$build"
          test -s "$hex"

          python3 -B "$RUNNER_TEMP/prepare-4.0.5.py" \
            --finalize-root "$root405" \
            --firmware "$hex" \
            --source-zip "$source_zip"
          python3 -B "$root405/flight-commander/verify-release.py" \
            --source-root "$root405" \
            --hex "$hex" \
            --manifest "$root405/RELEASE-MANIFEST.json"

          python3 -B "$RUNNER_TEMP/apply-4.0.5.py" \
            --firmware "$hex" \
            --source-zip "$source_zip"

          echo "firmware_sha256=$(sha256sum "$hex" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "source_sha256=$(sha256sum "$source_zip" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Run focused 4.0.5 source-liveness and release contract tests
        shell: bash
        run: |
          set -euo pipefail
          node --check js/flightCommander/firmwareCatalog.js
          node --check js/flightCommander/headingFusion.js
          node --check tabs/gps.js
          node --check tabs/magnetometer.js
          node --test \
            tests/flight-commander/firmware/heading-fusion.test.mjs \
            tests/flight-commander/firmware/heading-source-liveness.test.mjs \
            tests/flight-commander/firmware/onboard-ist8310-transform.test.mjs \
            tests/flight-commander/firmware/flight-commander-catalog.test.mjs \
            tests/flight-commander/packaging/package-contract.test.mjs
          node scripts/check-flight-commander-version.mjs

      - name: Install and run the complete Configurator test suite
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare yarn@1.22.22 --activate
          yarn install --frozen-lockfile --non-interactive
          yarn test

      - name: Upload verified coordinated 4.0.5 release inputs
        uses: actions/upload-artifact@v4
        with:
          name: flight-commander-4.0.5-coordinated-inputs
          retention-days: 30
          if-no-files-found: error
          path: |
            release/firmware/Flight-Commander-Firmware-4.0.5-MICOAIR743.hex
            release/firmware/Flight-Commander-Firmware-Source-v4.0.5.zip
            release/notes/v4.0.5-beta.md

      - name: Commit verified 4.0.5 release source and retire bad candidates
        shell: bash
        env:
          FIRMWARE_SHA256: ${{ steps.firmware.outputs.firmware_sha256 }}
          SOURCE_SHA256: ${{ steps.firmware.outputs.source_sha256 }}
          TARGET_BRANCH: agent/release-flight-commander-4.0.5
        run: |
          set -euo pipefail
          rm -rf release/patches/4.0.4 release/patches/4.0.5
          rm -f \
            .github/workflows/build-flight-commander-firmware-4.0.4.yml \
            .github/workflows/build-flight-commander-firmware-4.0.5.yml

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Expected generated 4.0.5 release changes, but the staged tree is empty." >&2
            exit 1
          fi
          git commit \
            -m "Flight Commander 4.0.5: fix stationary heading startup" \
            -m "Remove 4.0.0-4.0.4 from the online flasher catalog and normalize disabled heading-source weights to zero." \
            -m "Firmware SHA-256: $FIRMWARE_SHA256" \
            -m "Source SHA-256: $SOURCE_SHA256"
          git push origin "HEAD:$TARGET_BRANCH"
