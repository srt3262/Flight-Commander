name: Apply local firmware loader fix

"on":
  push:
    branches:
      - agent/fix-compass-persistence-and-local-flashing
    paths:
      - scripts/apply-local-firmware-loader-fix.py
      - .github/workflows/apply-local-firmware-loader-fix.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repair branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: agent/fix-compass-persistence-and-local-flashing
          fetch-depth: 1

      - name: Apply deterministic source patch
        run: python3 scripts/apply-local-firmware-loader-fix.py

      - name: Run focused catalog tests
        run: node --test tests/flight-commander/firmware/flight-commander-catalog.test.mjs

      - name: Commit patched Configurator source
        shell: bash
        run: |
          set -euo pipefail
          git add tabs/firmware_flasher.js
          if git diff --cached --quiet; then
            echo 'Local firmware loader source is already patched.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Allow renamed local Flight Commander firmware files'
          git push origin HEAD:agent/fix-compass-persistence-and-local-flashing
