name: One-time finalize Flight Commander 4.1.2

"on":
  push:
    branches:
      - main
    paths:
      - .github/workflows/one-time-finalize-flight-commander-4.1.2.yml
      - scripts/finalize-flight-commander-4.1.2.py

permissions:
  contents: write

concurrency:
  group: one-time-finalize-flight-commander-4.1.2
  cancel-in-progress: false

jobs:
  finalize:
    name: Clean product surfaces and retest release branch
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out release branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: remove-official-inav-support
          fetch-depth: 0
          persist-credentials: true

      - name: Load finalizer from current main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git show origin/main:scripts/finalize-flight-commander-4.1.2.py > /tmp/finalize-flight-commander-4.1.2.py

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Apply cleanup and run complete source tests
        shell: bash
        run: |
          set -euo pipefail
          python3 /tmp/finalize-flight-commander-4.1.2.py
          corepack enable
          corepack prepare yarn@1.22.22 --activate
          yarn install --frozen-lockfile --non-interactive
          yarn test

      - name: Publish tested branch update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Finalize Flight Commander 4.1.2 firmware-only surfaces"
            git push origin HEAD:remove-official-inav-support
          fi
