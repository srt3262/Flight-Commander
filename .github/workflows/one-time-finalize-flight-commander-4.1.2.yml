name: One-time finalize Flight Commander 4.1.2

"on":
  push:
    branches:
      - main
    paths:
      - .github/workflows/one-time-finalize-flight-commander-4.1.2.yml
      - scripts/fix-windows-verifier-4.1.2.py

permissions:
  contents: write

concurrency:
  group: one-time-finalize-flight-commander-4.1.2
  cancel-in-progress: false

jobs:
  finalize:
    name: Correct Windows verification and retest release branch
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out release branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: remove-official-inav-support
          fetch-depth: 0
          persist-credentials: true

      - name: Load verifier correction from current main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git show origin/main:scripts/fix-windows-verifier-4.1.2.py > /tmp/fix-windows-verifier-4.1.2.py

      - name: Apply correction, run tests, and publish result
        shell: bash
        run: |
          set +e
          python3 /tmp/fix-windows-verifier-4.1.2.py > /tmp/verifier-fix.log 2>&1
          verifier_status=$?
          install_status=0
          test_status=0

          if [ "$verifier_status" -eq 0 ]; then
            corepack enable > /tmp/install.log 2>&1
            install_status=$?
            if [ "$install_status" -eq 0 ]; then
              corepack prepare yarn@1.22.22 --activate >> /tmp/install.log 2>&1
              install_status=$?
            fi
            if [ "$install_status" -eq 0 ]; then
              yarn install --frozen-lockfile --non-interactive >> /tmp/install.log 2>&1
              install_status=$?
            fi
            if [ "$install_status" -eq 0 ]; then
              yarn test > /tmp/test.log 2>&1
              test_status=$?
            fi
          fi

          status_path=docs/internal/flight-commander-4.1.2-finalize-status.txt
          mkdir -p docs/internal
          if [ "$verifier_status" -eq 0 ] && [ "$install_status" -eq 0 ] && [ "$test_status" -eq 0 ]; then
            rm -f "$status_path"
          else
            git reset --hard HEAD
            {
              echo "Flight Commander 4.1.2 Windows verifier correction failed."
              echo "verifier_status=$verifier_status"
              echo "install_status=$install_status"
              echo "test_status=$test_status"
              echo
              echo "--- verifier-fix log ---"
              cat /tmp/verifier-fix.log 2>/dev/null || true
              echo
              echo "--- dependency log ---"
              cat /tmp/install.log 2>/dev/null || true
              echo
              echo "--- test failure index ---"
              grep -nE '(^|# )(not ok|failureType:|error:|AssertionError|SyntaxError|ERR_[A-Z_]+|expected:|actual:)' /tmp/test.log 2>/dev/null || true
              echo
              echo "--- complete test log ---"
              cat /tmp/test.log 2>/dev/null || true
            } > "$status_path"
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            if [ "$verifier_status" -eq 0 ] && [ "$install_status" -eq 0 ] && [ "$test_status" -eq 0 ]; then
              git commit -m "Align Flight Commander 4.1.2 Windows verification"
            else
              git commit -m "Record Flight Commander 4.1.2 verifier failure"
            fi
            git push origin HEAD:remove-official-inav-support
          fi

          if [ "$verifier_status" -ne 0 ]; then exit "$verifier_status"; fi
          if [ "$install_status" -ne 0 ]; then exit "$install_status"; fi
          exit "$test_status"
