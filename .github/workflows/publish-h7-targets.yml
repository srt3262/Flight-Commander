name: Publish H7 target assets

"on":
  workflow_run:
    workflows:
      - CI
    types:
      - completed
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact master commit containing the validated H7 expansion
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-flight-commander-4.3.1-h7-targets
  cancel-in-progress: false

env:
  RELEASE_TAG: v4.3.1
  RELEASE_VERSION: 4.3.1

jobs:
  authorize:
    name: Authorize additive H7 publication
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'master' &&
      contains(github.event.workflow_run.head_commit.message,
      'Publish Flight Commander 4.3.1 H7 target assets'))
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - name: Resolve and guard current master
        id: source
        env:
          DISPATCH_SHA: ${{ inputs.expected_sha }}
          WORKFLOW_RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            sha="$DISPATCH_SHA"
          else
            sha="$WORKFLOW_RUN_SHA"
          fi
          if [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "A full 40-character source commit is required." >&2
            exit 1
          fi
          master_sha="$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" refs/heads/master | cut -f1)"
          if [[ "$sha" != "$master_sha" ]]; then
            echo "Expansion commit $sha is not current master $master_sha." >&2
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  build:
    name: Build 48 additive target assets
    needs: authorize
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out authorized source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.authorize.outputs.source_sha }}
          persist-credentials: false

      - name: Install pinned Arm GNU toolchain
        run: bash flight-commander/install-toolchain.sh

      - name: Build, regress, verify, and package
        run: >-
          python3 flight-commander/package-h7-targets.py
          --output "$RUNNER_TEMP/h7-target-assets"
          --build-dir "$RUNNER_TEMP/h7-target-build"
          --regression-build-dir "$RUNNER_TEMP/legacy-regression-build"
          --source-revision "${{ needs.authorize.outputs.source_sha }}"

      - name: Upload verified publication candidates
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: h7-target-assets-${{ needs.authorize.outputs.source_sha }}
          path: ${{ runner.temp }}/h7-target-assets/
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Add targets without replacing published assets
    needs:
      - authorize
      - build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - name: Check out authorized source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.authorize.outputs.source_sha }}
          persist-credentials: false

      - name: Download verified candidates
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: h7-target-assets-${{ needs.authorize.outputs.source_sha }}
          path: ${{ runner.temp }}/candidates

      - name: Validate candidates and protect existing assets
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.authorize.outputs.source_sha }}
        run: |
          set -euo pipefail
          candidate="$RUNNER_TEMP/candidates"
          release_before="$RUNNER_TEMP/release-before.json"
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > "$release_before"
          python3 - "$candidate" "$release_before" "$SOURCE_SHA" <<'PY'
          import hashlib
          import json
          import pathlib
          import sys

          candidate = pathlib.Path(sys.argv[1])
          release = json.loads(pathlib.Path(sys.argv[2]).read_text())
          source_sha = sys.argv[3]
          metadata = json.loads((candidate / "h7-target-release-metadata.json").read_text())
          assert metadata["version"] == "4.3.1"
          assert metadata["release_tag"] == "v4.3.1"
          assert metadata["source_revision"] == source_sha
          assert len(metadata["targets"]) == len(metadata["artifacts"]) == 48
          assert metadata["excluded_existing_targets"] == ["MICOAIR743", "CUBEORANGEPLUS"]
          protected_artifacts = metadata["protected_existing_artifacts"]
          assert set(protected_artifacts) == {"MICOAIR743", "CUBEORANGEPLUS"}
          assert protected_artifacts["MICOAIR743"]["sha256"] == (
              "1fcb891cd7bcee51e86c6dcf0afcc58bc9228584cc3105406e33d00d9ebb7921"
          )
          assert protected_artifacts["CUBEORANGEPLUS"]["sha256"] == (
              "8370b421637226e61d5f50345a21c6e0888943903962377b4a629c5c51ef029f"
          )

          expected_files = {
              record["filename"] for record in metadata["artifacts"].values()
          }
          actual_files = {path.name for path in candidate.glob("*.hex")}
          assert actual_files == expected_files
          assert "Flight-Commander-Firmware-4.3.1-MICOAIR743.hex" not in actual_files
          assert "Flight-Commander-Firmware-4.3.1-CUBEORANGEPLUS.hex" not in actual_files
          for record in metadata["artifacts"].values():
              path = candidate / record["filename"]
              assert path.stat().st_size == record["bytes"]
              assert hashlib.sha256(path.read_bytes()).hexdigest() == record["sha256"]

          protected = {
              "Flight-Commander-Firmware-4.3.1-MICOAIR743.hex":
                  "sha256:1fcb891cd7bcee51e86c6dcf0afcc58bc9228584cc3105406e33d00d9ebb7921",
              "Flight-Commander-Firmware-4.3.1-CUBEORANGEPLUS.hex":
                  "sha256:8370b421637226e61d5f50345a21c6e0888943903962377b4a629c5c51ef029f",
              "Flight-Commander-v4.3.1.zip":
                  "sha256:1797bf889dc56d0394e8ab67c82fed9fcd8fcfbfb3df7dd039cd9862d03182aa",
          }
          live = {asset["name"]: asset for asset in release["assets"]}
          for name, digest in protected.items():
              assert live[name]["digest"] == digest
          allowed = set(protected) | expected_files
          assert not (set(live) - allowed), f"Unexpected existing assets: {set(live) - allowed}"
          for target, record in metadata["artifacts"].items():
              existing = live.get(record["filename"])
              if existing is not None:
                  assert existing["digest"] == f"sha256:{record['sha256']}"
                  assert existing["size"] == record["bytes"]
          PY

      - name: Upload only missing additive assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          candidate="$RUNNER_TEMP/candidates"
          while IFS= read -r target; do
            file="Flight-Commander-Firmware-$RELEASE_VERSION-$target.hex"
            existing="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" \
              --jq ".assets[] | select(.name == \"$file\") | .name")"
            if [[ -n "$existing" ]]; then
              echo "Already verified; leaving in place: $file"
              continue
            fi
            gh release upload "$RELEASE_TAG" \
              "$candidate/$file#Flight Commander Firmware $RELEASE_VERSION for $target" \
              --repo "$GITHUB_REPOSITORY"
          done < <(python3 -c 'import json,sys; print("\n".join(json.load(open(sys.argv[1]))["targets"]))' \
            "$candidate/h7-target-release-metadata.json")

      - name: Verify final assets and append release notes
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.authorize.outputs.source_sha }}
        run: |
          set -euo pipefail
          candidate="$RUNNER_TEMP/candidates"
          release_after="$RUNNER_TEMP/release-after.json"
          notes="$RUNNER_TEMP/release-notes.md"
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > "$release_after"
          python3 - "$candidate" "$release_after" <<'PY'
          import json
          import pathlib
          import sys

          candidate = pathlib.Path(sys.argv[1])
          release = json.loads(pathlib.Path(sys.argv[2]).read_text())
          metadata = json.loads((candidate / "h7-target-release-metadata.json").read_text())
          protected = {
              "Flight-Commander-Firmware-4.3.1-MICOAIR743.hex":
                  "sha256:1fcb891cd7bcee51e86c6dcf0afcc58bc9228584cc3105406e33d00d9ebb7921",
              "Flight-Commander-Firmware-4.3.1-CUBEORANGEPLUS.hex":
                  "sha256:8370b421637226e61d5f50345a21c6e0888943903962377b4a629c5c51ef029f",
              "Flight-Commander-v4.3.1.zip":
                  "sha256:1797bf889dc56d0394e8ab67c82fed9fcd8fcfbfb3df7dd039cd9862d03182aa",
          }
          live = {asset["name"]: asset for asset in release["assets"]}
          assert len(live) == 51
          for name, digest in protected.items():
              assert live[name]["digest"] == digest
          for record in metadata["artifacts"].values():
              asset = live[record["filename"]]
              assert asset["digest"] == f"sha256:{record['sha256']}"
              assert asset["size"] == record["bytes"]
          PY
          python3 - "$release_after" docs/releases/v4.3.1-h7-target-expansion.md \
            "$candidate/SHA256SUMS-H7-TARGETS.txt" "$notes" "$SOURCE_SHA" <<'PY'
          import json
          import pathlib
          import sys

          release = json.loads(pathlib.Path(sys.argv[1]).read_text())
          fragment = pathlib.Path(sys.argv[2]).read_text().rstrip()
          checksums = pathlib.Path(sys.argv[3]).read_text().rstrip()
          output = pathlib.Path(sys.argv[4])
          source_sha = sys.argv[5]
          body = release.get("body") or ""
          marker = "<!-- flight-commander-h7-targets -->"
          if marker not in body:
              body = (
                  body.rstrip()
                  + "\n\n"
                  + fragment
                  + f"\n\nExpansion source revision: `{source_sha}`."
                  + "\n\n### Added target asset SHA-256\n\n```text\n"
                  + checksums
                  + "\n```\n"
              )
          output.write_text(body, encoding="utf-8")
          PY
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --notes-file "$notes"
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" \
            --jq '.body' | grep -F '<!-- flight-commander-h7-targets -->' >/dev/null
