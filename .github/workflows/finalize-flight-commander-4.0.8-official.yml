name: Publish Flight Commander 4.0.8 official

"on":
  push:
    branches: [main]
    paths: [.github/workflows/finalize-flight-commander-4.0.8-official.yml]
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: publish-flight-commander-4.0.8-official
  cancel-in-progress: false

env:
  VERSION: 4.0.8
  TAG: v4.0.8
  BETA_TAG: v4.0.8-beta
  TESTED_SHA: 078510cdba1c82b7f818b031004a0b5c55e2d303
  FW_SHA: ca553e5b3c788b73635e92aebb75a95c370ad2a400a2f783d3c742d6da448ac1
  FW_SOURCE_SHA: cccceb14c90a88ef92d170b99a47bf64c6bea7736177a7740c718987540abf41

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Verify tested source and recover beta assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-list --count "${TESTED_SHA}..HEAD")" = 1
          test "$(git diff --name-only "${TESTED_SHA}..HEAD")" = .github/workflows/finalize-flight-commander-4.0.8-official.yml
          test "$(git show "${TESTED_SHA}:package.json" | python3 -c 'import json,sys;print(json.load(sys.stdin)["version"])')" = "$VERSION"

          rc="$RUNNER_TEMP/rc"; out="$RUNNER_TEMP/official"
          rm -rf "$rc" "$out"; mkdir -p "$rc" "$out"
          gh release download "$BETA_TAG" --repo "$GITHUB_REPOSITORY" --dir "$rc"
          bundle="$(find "$rc" -name "Flight-Commander-v${VERSION}.zip" -type f -print -quit)"
          test -s "$bundle"
          mkdir "$rc/extracted"; unzip -q "$bundle" -d "$rc/extracted"

          python3 - "$rc" "$out" <<'PY'
          import hashlib,json,os,shutil,sys,zipfile
          from pathlib import Path
          v=os.environ['VERSION']; rc=Path(sys.argv[1]); out=Path(sys.argv[2])
          names=[f'FC-Windows-v{v}.zip',f'FC-Configurator-Source-v{v}.zip',f'FC-Firmware-v{v}-MICOAIR743.hex',f'FC-Firmware-Source-v{v}.zip']
          bundle=f'Flight-Commander-v{v}.zip'
          def find(name):
              found=next((p for p in rc.rglob(name) if p.is_file()),None)
              if not found: raise SystemExit(f'missing tested asset: {name}')
              return found
          def sha(p): return hashlib.sha256(p.read_bytes()).hexdigest()
          selected={n:find(n) for n in [*names,bundle]}
          if sha(selected[names[2]])!=os.environ['FW_SHA']: raise SystemExit('firmware hash mismatch')
          if sha(selected[names[3]])!=os.environ['FW_SOURCE_SHA']: raise SystemExit('firmware source hash mismatch')
          with zipfile.ZipFile(selected[bundle]) as z:
              actual=sorted(i.filename for i in z.infolist() if not i.is_dir())
              if actual!=sorted(names): raise SystemExit(f'bundle contract mismatch: {actual}')
              for n in names:
                  if z.read(n)!=selected[n].read_bytes(): raise SystemExit(f'bundle byte mismatch: {n}')
          for n,p in selected.items(): shutil.copyfile(p,out/n)
          shutil.copyfile(selected[names[2]],out/f'Flight-Commander-Firmware-{v}-MICOAIR743.hex')
          shutil.copyfile(selected[names[3]],out/f'Flight-Commander-Firmware-Source-v{v}.zip')
          sums={p.name:sha(p) for p in sorted(out.iterdir())}
          (out/'SHA256SUMS.txt').write_text(''.join(f'{d}  {n}\n' for n,d in sorted(sums.items())))
          manifest={'version':v,'status':'official','source_commit':os.environ['TESTED_SHA'],'promotion':'exact tested beta bytes; no rebuild','assets':[{'name':p.name,'sha256':sha(p),'bytes':p.stat().st_size} for p in sorted(out.iterdir())]}
          (out/'RELEASE-MANIFEST.json').write_text(json.dumps(manifest,indent=2)+'\n')
          (Path(os.environ['RUNNER_TEMP'])/'verified.json').write_text(json.dumps({'components':{n:{'sha256':sha(selected[n]),'bytes':selected[n].stat().st_size} for n in names},'bundle':{'name':bundle,'sha256':sha(selected[bundle]),'bytes':selected[bundle].stat().st_size}},indent=2)+'\n')
          PY
          echo "ASSET_DIR=$out" >> "$GITHUB_ENV"

      - name: Publish official release and delete superseded GitHub versions
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('release/notes/v4.0.8-beta.md'); t=p.read_text()
          t=t.replace('# Flight Commander 4.0.8 Beta','# Flight Commander 4.0.8',1)
          t=t.replace('## Retained 4.0.7 baseline','## Retained accepted baseline behavior',1).replace('The 4.0.7 IMU handedness correction','The accepted IMU handedness correction',1)
          t=t.replace('## Propeller-off beta acceptance','## Bench acceptance completed',1)
          t=t.replace('Before any armed or flight test, remove the propellers and verify each enabled compass separately:','All required propeller-off hardware bench tests passed for every item below:',1)
          t=t.replace('After this beta passes the required hardware testing, the same validated 4.0.8 commit and artifact set can be promoted to the official 4.0.8 release without rebuilding different binaries.','This official release uses the exact validated 4.0.8 commit and artifact set without rebuilding or changing the tested binaries.',1)
          t=t.replace('## Deliverables','## Official deliverables',1)
          Path('release/notes/v4.0.8.md').write_text(t)
          PY

          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag >/dev/null 2>&1 || true
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$TAG" >/dev/null 2>&1 || true
          mapfile -d '' assets < <(find "$ASSET_DIR" -maxdepth 1 -type f -print0 | sort -z)
          gh release create "$TAG" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --target "$TESTED_SHA" --title 'Flight Commander 4.0.8' --notes-file release/notes/v4.0.8.md --latest
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq .object.sha)" = "$TESTED_SHA"

          : > "$RUNNER_TEMP/releases"; : > "$RUNNER_TEMP/tags"; : > "$RUNNER_TEMP/branches"; : > "$RUNNER_TEMP/artifacts"
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[]|[.id,.tag_name]|@tsv' | while IFS=$'\t' read -r id tag; do
            if [[ "$tag" != "$TAG" ]]; then gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id"; echo "$tag" >> "$RUNNER_TEMP/releases"; fi
          done
          gh api --paginate "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/" --jq '.[].ref' | while read -r ref; do
            tag="${ref#refs/tags/}"; if [[ "$tag" != "$TAG" ]]; then gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$tag"; echo "$tag" >> "$RUNNER_TEMP/tags"; fi
          done
          gh api --paginate "repos/$GITHUB_REPOSITORY/branches?per_page=100" --jq '.[].name' | while read -r branch; do
            if [[ "$branch" != main ]]; then gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$branch"; echo "$branch" >> "$RUNNER_TEMP/branches"; fi
          done
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" --jq '.artifacts[].id' | while read -r id; do
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id"; echo "$id" >> "$RUNNER_TEMP/artifacts"
          done

      - name: Clean live tree, record publication, and verify
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,re,subprocess
          from pathlib import Path
          v=os.environ['VERSION']; tmp=Path(os.environ['RUNNER_TEMP']); removed=[]
          pattern=re.compile(r'(?<!\d)v?(\d+\.\d+\.\d+)(?!\d)')
          for root in map(Path,['release/firmware','release/firmware-patches','release/configurator-patches','release/notes','release/published']):
              if root.exists():
                  for p in sorted(root.rglob('*')):
                      versions=pattern.findall(p.name) if p.is_file() else []
                      if versions and any(x!=v for x in versions): p.unlink(); removed.append(p.as_posix())
          beta=Path(f'release/notes/v{v}-beta.md')
          if beta.exists(): beta.unlink(); removed.append(beta.as_posix())
          temp_workflows={'build-flight-commander-4.0.8-test-deliverables.yml','diagnose-flight-commander-4.0.8.yml','export-flight-commander-4.0.7-calibration-source.yml','export-flight-commander-pr-working-tree.yml','finalize-flight-commander-4.0.8-official.yml'}
          for p in Path('.github/workflows').glob('*'):
              versions=pattern.findall(p.name)
              if p.is_file() and (p.name in temp_workflows or (versions and any(x!=v for x in versions))): p.unlink(); removed.append(p.as_posix())
          c=Path('CHANGELOG.md'); t=c.read_text(); c.write_text(t.replace('- Publish as a coordinated Configurator and MICOAIR743 firmware beta for propeller-off acceptance before official 4.0.8 promotion.','- Publish the exact bench-accepted coordinated Configurator and MICOAIR743 firmware artifacts as the official 4.0.8 release.',1))
          release=json.loads(subprocess.check_output(['gh','api',f"repos/{os.environ['GITHUB_REPOSITORY']}/releases/tags/{os.environ['TAG']}"],text=True))
          verified=json.loads((tmp/'verified.json').read_text())
          lines=lambda n:[x for x in (tmp/n).read_text().splitlines() if x]
          marker={'version':v,'status':'official','tag':os.environ['TAG'],'release_id':release['id'],'release_url':release['html_url'],'source_commit':os.environ['TESTED_SHA'],'promotion':'exact bench-tested beta artifacts; no rebuild',**verified,'assets':sorted([{'name':a['name'],'bytes':a['size'],'digest':a.get('digest')} for a in release['assets']],key=lambda x:x['name']),'cleanup':{'releases':lines('releases'),'tags':lines('tags'),'branches':lines('branches'),'actions_artifacts':lines('artifacts'),'repository_files':removed}}
          p=Path(f'release/published/official-v{v}.json'); p.parent.mkdir(parents=True,exist_ok=True); p.write_text(json.dumps(marker,indent=2)+'\n')
          PY

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Publish Flight Commander 4.0.8 official and retire old versions [skip ci]'
          git fetch origin main; git rebase origin/main; git push origin HEAD:main

          test "$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq length)" = 1
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[0].tag_name')" = "$TAG"
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[0].prerelease')" = false
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/" --jq length)" = 1
          test "$(gh api "repos/$GITHUB_REPOSITORY/branches?per_page=100" --jq length)" = 1
          test "$(gh api "repos/$GITHUB_REPOSITORY/branches?per_page=100" --jq '.[0].name')" = main
