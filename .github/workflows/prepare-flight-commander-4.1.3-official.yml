name: Prepare Flight Commander 4.1.3 official release

"on":
  push:
    branches:
      - fix/flight-commander-4.1.3-gcs-flasher
    paths:
      - .release-bootstrap/**
      - .github/workflows/prepare-flight-commander-4.1.3-official.yml

permissions:
  contents: write

concurrency:
  group: prepare-flight-commander-4.1.3-official
  cancel-in-progress: false

jobs:
  prepare:
    name: Build, verify, and commit the official source tree
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Check out the release branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Preserve the one-time migration tools
        run: cp -a .release-bootstrap "$RUNNER_TEMP/bootstrap"

      - name: Create the clean INAV-style repository
        run: >-
          python3 "$RUNNER_TEMP/bootstrap/prepare.py" prepare
          --root "$GITHUB_WORKSPACE"
          --templates "$RUNNER_TEMP/bootstrap"

      - name: Install the pinned Arm GNU toolchain
        run: bash flight-commander/install-toolchain.sh

      - name: Build Firmware 4.1.3 and refresh its committed manifest
        run: >-
          python3 flight-commander/package-release.py
          --refresh-manifest
          --output "$RUNNER_TEMP/firmware-first"
          --build-dir "$RUNNER_TEMP/firmware-build-first"

      - name: Finalize Configurator release metadata from the verified firmware
        run: >-
          python3 "$RUNNER_TEMP/bootstrap/prepare.py" finalize
          --root "$GITHUB_WORKSPACE"
          --metadata "$RUNNER_TEMP/firmware-first/firmware-release-metadata.json"

      - name: Rebuild to prove the committed release is reproducible
        run: >-
          python3 flight-commander/package-release.py
          --output "$RUNNER_TEMP/firmware-second"
          --build-dir "$RUNNER_TEMP/firmware-build-second"

      - name: Compare both firmware release builds
        run: diff --recursive --brief "$RUNNER_TEMP/firmware-first" "$RUNNER_TEMP/firmware-second"

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: configurator/yarn.lock

      - name: Install and test Configurator 4.1.3
        working-directory: configurator
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate
          yarn install --frozen-lockfile --non-interactive
          yarn test

      - name: Verify the final repository contract
        run: |
          set -euo pipefail
          test "$(find .github/workflows -maxdepth 1 -type f | wc -l)" -eq 2
          test -f .github/workflows/ci.yml
          test -f .github/workflows/release.yml
          test -f src/main/build/flight_commander.h
          test -f configurator/package.json
          test ! -e release
          test ! -e firmware-inspection
          test ! -e dev/firmware-4.0.7-source
          test ! -e configurator/scripts/recovery
          test ! -e configurator/assets/linux/icon/inav_icon_128.png
          test ! -e configurator/assets/linux/icon/inav_icon_english_128.png
          test ! -e configurator/assets/windows/inav_installer_icon.ico
          test ! -e configurator/images/cf_logo_white.svg
          test ! -e docs/BENCH_TEST_4.0.0.md
          test ! -e .release-bootstrap
          test ! -e .github/workflows/prepare-flight-commander-4.1.3-official.yml
          git add --all
          test -z "$(git ls-files -z | xargs -0 -r find -type f -size +95M -print)"
          ! git grep --cached -E \
            'github.com/srt3262/Flight-Commander/(blob|tree)/main' \
            -- '*.md' '*.html' '*.js'
          git diff --cached --check -- \
            .github \
            .gitattributes \
            .gitignore \
            README.md \
            RELEASE-MANIFEST.json \
            CMakeLists.txt \
            src/main/build/flight_commander.h \
            flight-commander \
            docs/releases/v4.1.3.md \
            docs/FLIGHT_COMMANDER_VERSIONING.md

      - name: Commit and push the verified official release source
        run: |
          set -euo pipefail
          git config user.name "Flight Commander Release"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Publish Flight Commander 4.1.3 release"
          git push origin "HEAD:${GITHUB_REF_NAME}"
