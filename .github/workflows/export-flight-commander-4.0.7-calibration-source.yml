name: Apply Flight Commander 4.0.8 firmware calibration changes

"on":
  push:
    branches:
      - agent/fix-4.0.6-imu-handedness
    paths:
      - .github/workflows/export-flight-commander-4.0.7-calibration-source.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: agent/fix-4.0.6-imu-handedness
          fetch-depth: 0
      - name: Apply source-selective compass calibration changes
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/apply-flight-commander-4.0.8-firmware-calibration.py
          python3 -m py_compile scripts/apply-flight-commander-4.0.8-firmware-calibration.py
      - name: Commit transformed firmware source
        shell: bash
        run: |
          set -euo pipefail
          git add dev/firmware-4.0.7-source
          if git diff --cached --quiet; then
            echo "4.0.8 firmware calibration source already applied"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Implement source-selective compass calibration for 4.0.8 [skip ci]"
          git push origin HEAD:agent/fix-4.0.6-imu-handedness
