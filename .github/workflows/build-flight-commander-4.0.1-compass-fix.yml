name: Validate and package Flight Commander 4.0.1

"on":
  push:
    branches:
      - agent/fix-4.0.1-onboard-compass-transform
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flight-commander-4.0.1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-firmware-source:
    name: Rebuild firmware and run source tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out exact revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Install firmware build prerequisites
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build curl xz-utils unzip zip python3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Rebuild exact published firmware source
        shell: bash
        run: bash scripts/rebuild-firmware-source-archive.sh

      - name: Run complete source tests
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare yarn@1.22.22 --activate
          yarn install --frozen-lockfile --non-interactive
          yarn test

  package-windows:
    name: Package and verify Windows release candidate
    needs: verify-firmware-source
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Check out exact revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test and verify Windows application
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          corepack enable
          corepack prepare yarn@1.22.22 --activate
          yarn install --frozen-lockfile --non-interactive
          yarn test
          yarn package:windows
          yarn verify:windows

      - name: Assemble four coordinated components
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $version = '4.0.1'
          $stage = Join-Path $PWD 'release-candidate'
          $components = Join-Path $stage "Flight-Commander-v$version"
          New-Item -ItemType Directory -Force -Path $components | Out-Null

          $packageDir = Get-ChildItem -LiteralPath (Join-Path $PWD 'out') -Directory -Recurse |
            Where-Object {
              $_.Name -match 'win32-x64$' -and
              (Test-Path -LiteralPath (Join-Path $_.FullName 'flight-commander.exe'))
            } |
            Select-Object -First 1
          if (-not $packageDir) { throw 'Verified Windows package directory not found.' }

          $windowsZip = Join-Path $components "FC-Windows-v$version.zip"
          [IO.Compression.ZipFile]::CreateFromDirectory(
            $packageDir.FullName,
            $windowsZip,
            [IO.Compression.CompressionLevel]::Optimal,
            $false
          )

          $archive = Join-Path $env:RUNNER_TEMP 'configurator-head.zip'
          $configStage = Join-Path $env:RUNNER_TEMP 'configurator-source'
          git archive --format=zip --output=$archive HEAD
          if ($LASTEXITCODE -ne 0) { throw 'git archive failed.' }
          Expand-Archive -LiteralPath $archive -DestinationPath $configStage -Force
          $configZip = Join-Path $components "FC-Configurator-Source-v$version.zip"
          [IO.Compression.ZipFile]::CreateFromDirectory(
            $configStage,
            $configZip,
            [IO.Compression.CompressionLevel]::Optimal,
            $false
          )

          Copy-Item -LiteralPath (Join-Path $PWD 'release/firmware/Flight-Commander-Firmware-4.0.1-MICOAIR743.hex') -Destination (Join-Path $components "FC-Firmware-v$version-MICOAIR743.hex")
          Copy-Item -LiteralPath (Join-Path $PWD 'release/firmware/Flight-Commander-Firmware-Source-v4.0.1.zip') -Destination (Join-Path $components "FC-Firmware-Source-v$version.zip")

          $componentFiles = @(Get-ChildItem -LiteralPath $components -File | Sort-Object Name)
          $expected = @(
            "FC-Configurator-Source-v$version.zip",
            "FC-Firmware-Source-v$version.zip",
            "FC-Firmware-v$version-MICOAIR743.hex",
            "FC-Windows-v$version.zip"
          ) | Sort-Object
          $actual = @($componentFiles.Name | Sort-Object)
          if ($componentFiles.Count -ne 4 -or (Compare-Object $expected $actual)) {
            throw 'The release candidate does not contain exactly the four coordinated components.'
          }

          $hashFile = Join-Path $components 'SHA256SUMS.txt'
          $componentFiles | ForEach-Object {
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName).Hash.ToLowerInvariant()
            "$hash  $($_.Name)" | Add-Content -LiteralPath $hashFile -Encoding ascii
          }

          $completeZip = Join-Path $stage "Flight-Commander-v$version.zip"
          [IO.Compression.ZipFile]::CreateFromDirectory(
            $components,
            $completeZip,
            [IO.Compression.CompressionLevel]::Optimal,
            $true
          )
          $completeHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $completeZip).Hash.ToLowerInvariant()
          "$completeHash  $([IO.Path]::GetFileName($completeZip))" |
            Set-Content -LiteralPath (Join-Path $stage 'COMPLETE-BUNDLE-SHA256.txt') -Encoding ascii

      - name: Upload verified 4.0.1 release candidate
        uses: actions/upload-artifact@v4
        with:
          name: flight-commander-4.0.1-release-candidate
          retention-days: 14
          if-no-files-found: error
          path: |
            release-candidate/Flight-Commander-v4.0.1/FC-Windows-v4.0.1.zip
            release-candidate/Flight-Commander-v4.0.1/FC-Configurator-Source-v4.0.1.zip
            release-candidate/Flight-Commander-v4.0.1/FC-Firmware-v4.0.1-MICOAIR743.hex
            release-candidate/Flight-Commander-v4.0.1/FC-Firmware-Source-v4.0.1.zip
            release-candidate/Flight-Commander-v4.0.1/SHA256SUMS.txt
            release-candidate/Flight-Commander-v4.0.1.zip
            release-candidate/COMPLETE-BUNDLE-SHA256.txt
